# Shared pnpm + Node.js setup for this repo's workflows.
#
# Installs pnpm, sets up Node.js with the pnpm cache, and (by default) runs a
# frozen-lockfile install. Consolidates the pnpm/setup-node/install trio that was
# duplicated across every workflow into one place so the pinned action SHAs and the
# Node version are maintained once.
#
# Notes for callers:
#   - This is a LOCAL composite action, so the consuming job MUST run
#     actions/checkout BEFORE `uses: ./.github/actions/setup-node-pnpm`.
#   - Composite actions cannot declare `permissions` or read secrets; they only see
#     their declared `inputs`. Set job-level permissions and pass secrets in the
#     workflow, not here.
#   - To gate this whole setup behind a condition (e.g. a producer's proceed gate),
#     put the `if:` on the single `uses:` step in the workflow — it then guards all
#     three sub-steps.
#
# Inputs:
#   - node-version: Node.js version to install (default "22", the engines floor).
#   - registry-url: npm registry URL to configure on setup-node. Empty (the
#     default) is a no-op, so most callers omit it; release passes the npm registry
#     so it can publish.
#   - install: when "true" (the default) run `pnpm install --frozen-lockfile`. Set
#     to "false" to set up the toolchain only and run the install yourself.
name: Set up Node.js and pnpm
description: Install pnpm, set up Node.js with the pnpm cache, and optionally run a frozen-lockfile install.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"
  registry-url:
    description: npm registry URL for setup-node (empty is a no-op).
    required: false
    default: ""
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
