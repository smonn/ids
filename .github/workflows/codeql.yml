# CodeQL advanced setup.
#
# Replaces the repo's default (dynamic) CodeQL setup so a `paths-ignore` filter
# can exclude test files from security analysis. Default setup does not support
# path filtering, so test fixtures (e.g. the in-memory express() apps in the
# adapter *.test.ts integration tests) were scanned as production route handlers
# and produced false-positive `js/missing-rate-limiting` (High) alerts on routes
# that have no business being rate-limited.
#
# ******** IMPORTANT ********
# Default and advanced CodeQL setups are mutually exclusive. Before merging,
# disable CodeQL default setup under Settings -> Code security -> Code scanning
# -> CodeQL analysis -> default setup. Otherwise GitHub rejects the advanced
# uploads with "CodeQL analyses from advanced configurations cannot be processed
# when the default setup is enabled" and both Analyze jobs fail.
#
# Actions are SHA-pinned with a version comment to satisfy the repo convention
# (guarded by scorecard.yml); the codeql-action SHA matches the one already used
# in scorecard.yml (v4.36.3).

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "24 5 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the code-scanning dashboard.
      security-events: write
      # Required to fetch the CodeQL query packs.
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Test files are not production surfaces. Excluding them keeps security
          # queries (e.g. js/missing-rate-limiting) from firing on test-only
          # express()/fastify apps and other fixtures. Alerts are filtered by
          # their location, so a finding anchored in a *.test.ts / test-helpers
          # file is dropped.
          config: |
            paths-ignore:
              - '**/*.test.ts'
              - 'src/adapters/test-helpers.ts'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"
