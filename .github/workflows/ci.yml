name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Top level stays read-only (Scorecard Token-Permissions); the write grant the
# conflict guard needs is declared on the job below.
permissions:
  contents: read

jobs:
  ci:
    # Exercise the full suite across every supported Node major (engines.node
    # >=22). Without this, a 24/26-only regression in the CLI or Web Crypto
    # surface would ship undetected. fail-fast is off so one version's failure
    # doesn't cancel the others — we want to see which majors break.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    name: ci (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # A job-level permissions block REPLACES the top-level one, so contents: read
    # is redeclared. The conflict guard (first step below) reads the PR's labels
    # and, when the PR is mid-rebase, self-cancels this run — `ci` is a REQUIRED
    # check, so cancelling (which blocks merge) rather than skipping (which
    # branch protection counts as passing) is load-bearing; actions: write is
    # the only token scope that can cancel, hence this job-level write grant.
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # Monitor egress in audit mode (log-only, never blocks). This job is
      # read-only, but the dependency install runs untrusted postinstall
      # scripts, so logging unexpected outbound connections is cheap insurance.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Pause CI while this PR is mid-conflict-rebase (an `automation:*` mutex is present —
      # see .github/workflows/README.md "The automation:* rebase pause-mutex"). We
      # SELF-CANCEL rather than skip via a job-level `if`: a cancelled run is neutral — it
      # does not fail branch protection and does not strand the required `ci` check
      # "Expected" — and the rebase merge commit then runs FRESH CI on the new head. Only
      # guards PR runs; push-to-main CI is never paused. Fail-open: if the label read errors
      # we proceed and run CI (better than wrongly cancelling).
      - name: Pause while an automation mutex is present on this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qE '^automation:'; then
            echo "PR #$PR_NUMBER carries an automation:* mutex — cancelling; the rebase merge commit will run fresh CI."
            gh run cancel "$GITHUB_RUN_ID" || true
            sleep 30  # let the cancellation land so later steps don't run
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      # Fail the build on a high/critical advisory against a *runtime* dependency.
      # --prod scopes the audit to production deps so dev-only advisories (e.g. the
      # esbuild/vite findings pinned in pnpm-workspace.yaml overrides) don't block,
      # while a real runtime high/critical does. Dependabot still surfaces the rest.
      #
      # Hardened against a fail-open (#748): the audit hits the live registry on
      # every PR, and a transient outage can yield empty/garbage output that a bare
      # `pnpm audit` might read as "no advisories." So we capture the JSON and ASSERT
      # it carries a `.metadata.vulnerabilities` object (proof the registry actually
      # answered) before trusting it; missing/empty metadata fails the step loudly
      # instead of passing as clean. Then fail on any high/critical count — the same
      # threshold as the retired `--audit-level=high` flag. A scheduled, PR-independent
      # sweep also runs in security-audit.yml so registry flakiness on one PR is not
      # the only signal.
      - name: Audit production dependencies (high/critical, fail-closed)
        run: |
          set -euo pipefail
          # pnpm audit exits non-zero when it finds advisories, so don't let that
          # abort the capture; we inspect the JSON ourselves.
          audit_json=$(pnpm audit --prod --json 2>/dev/null) || true
          if [ -z "$audit_json" ] || ! printf '%s' "$audit_json" | jq -e '.metadata.vulnerabilities' >/dev/null 2>&1; then
            echo "::error::pnpm audit produced no advisory metadata — the registry fetch likely failed. Not treating this as 'no advisories'; failing closed."
            printf '%s\n' "$audit_json" | head -c 2000
            exit 1
          fi
          high=$(printf '%s' "$audit_json" | jq -r '.metadata.vulnerabilities.high // 0')
          critical=$(printf '%s' "$audit_json" | jq -r '.metadata.vulnerabilities.critical // 0')
          echo "Production advisories — high: $high, critical: $critical."
          if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then
            echo "::error::Found $high high and $critical critical advisory(ies) in production dependencies."
            printf '%s' "$audit_json" | jq '.advisories // {}'
            exit 1
          fi

      - run: pnpm lint

      # No-status-triggers invariant (ADR-0030): every `labeled`-gated workflow job
      # filters on a `do:*` label. Also enforced by the sibling vitest suite; this
      # standalone step keeps it a visible, fast CI gate.
      - run: node .github/scripts/label-trigger-lint.mjs

      # ADR front-matter schema (docs/adr/ADR-FORMAT.md > Front matter): status
      # enum, date shape/order, and bidirectional supersedes links.
      - run: node .github/scripts/adr-front-matter-lint.mjs

      - run: pnpm depcruise

      - run: pnpm knip

      - run: pnpm fmt:check

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      # Build the docs site so a change that breaks the Starlight build or a
      # TypeDoc entry point fails on the PR, not after merge in docs.yml. Gated
      # to one matrix leg — the site is Node-agnostic and reuses the dist/ just
      # built above (the playground imports @smonn/ids through the workspace
      # link, which resolves to ./dist via the package exports).
      - name: Build docs site
        if: matrix.node-version == 24
        run: pnpm --filter @smonn/ids-website build

      # Validate the published package shape against a packed tarball: attw
      # (esm-only profile) catches type-resolution regressions and publint
      # catches packaging errors. Runs after build since it inspects dist/.
      - run: pnpm pack:check
