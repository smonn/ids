name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The conflict guard (first step below) reads the PR's labels and, when the PR is
  # mid-rebase, self-cancels this run — both need slightly more than the default.
  pull-requests: read
  actions: write

jobs:
  ci:
    # Exercise the full suite across every supported Node major (engines.node
    # >=22). Without this, a 24/26-only regression in the CLI or Web Crypto
    # surface would ship undetected. fail-fast is off so one version's failure
    # doesn't cancel the others — we want to see which majors break.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    name: ci (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    steps:
      # Monitor egress in audit mode (log-only, never blocks). This job is
      # read-only, but the dependency install runs untrusted postinstall
      # scripts, so logging unexpected outbound connections is cheap insurance.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Pause CI while this PR is mid-conflict-rebase. conflicts.yml marks a PR that
      # conflicts with main `conflicting` and dispatches an automatic rebase; running
      # CI on the soon-to-be-superseded commit is wasted work. We SELF-CANCEL (not a
      # job-level `if` skip): a cancelled run is neutral — it does not fail branch
      # protection and does not strand the required `ci` check "Expected" — and the
      # rebase merge commit then runs FRESH CI that reports green on the new head
      # (rebase.yml clears `conflicting` BEFORE pushing that commit). Only guards PR
      # runs; push-to-main CI is never paused. Fail-open: if the label read errors we
      # proceed and run CI (better than wrongly cancelling).
      - name: Pause while this PR conflicts with main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qx conflicting; then
            echo "PR #$PR_NUMBER is marked conflicting — cancelling; the rebase merge commit will run fresh CI."
            gh run cancel "$GITHUB_RUN_ID" || true
            sleep 30  # let the cancellation land so later steps don't run
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      # Fail the build on a high/critical advisory against a *runtime* dependency.
      # --prod scopes the audit to production deps so dev-only advisories (e.g. the
      # esbuild/vite findings pinned in pnpm-workspace.yaml overrides) don't block,
      # while a real runtime high/critical does. Dependabot still surfaces the rest.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm lint

      - run: pnpm depcruise

      - run: pnpm knip

      - run: pnpm fmt:check

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      # Build the docs site so a change that breaks the Starlight build or a
      # TypeDoc entry point fails on the PR, not after merge in docs.yml. Gated
      # to one matrix leg — the site is Node-agnostic and reuses the dist/ just
      # built above (the playground imports @smonn/ids through the workspace
      # link, which resolves to ./dist via the package exports).
      - name: Build docs site
        if: matrix.node-version == 24
        run: pnpm --filter @smonn/ids-website build

      # Validate the published package shape against a packed tarball: attw
      # (esm-only profile) catches type-resolution regressions and publint
      # catches packaging errors. Runs after build since it inspects dist/.
      - run: pnpm pack:check
