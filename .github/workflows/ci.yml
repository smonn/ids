name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Monitor egress in audit mode (log-only, never blocks). This job is
      # read-only, but the dependency install runs untrusted postinstall
      # scripts, so logging unexpected outbound connections is cheap insurance.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      # Fail the build on a high/critical advisory against a *runtime* dependency.
      # --prod scopes the audit to production deps so dev-only advisories (e.g. the
      # esbuild/vite findings pinned in pnpm-workspace.yaml overrides) don't block,
      # while a real runtime high/critical does. Dependabot still surfaces the rest.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm lint

      - run: pnpm depcruise

      - run: pnpm knip

      - run: pnpm fmt:check

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build
