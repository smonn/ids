name: Scorecard supply-chain security

# OpenSSF Scorecard: a continuous, regression-proof guard on the repo's
# supply-chain posture. It re-checks the things we enforce by hand today
# (SHA-pinned actions, least-privilege token scopes, npm provenance) and
# flags the day one of them regresses — e.g. an action becomes unpinned or a
# token gains a `write` scope. Results are uploaded to GitHub code scanning so
# regressions surface as security alerts. (Some checks — notably branch
# protection — score higher once that is configured; tracked separately in the
# maintainer-settings issue.)

on:
  # Weekly so the score tracks the action ecosystem (advisories, new pins)
  # even when the repo is quiet.
  schedule:
    - cron: "20 7 * * 1"
  # On push to main so a regression is caught at merge, not a week later. PRs
  # are intentionally excluded: forks can't write code-scanning results and the
  # Scorecard token would be unavailable.
  push:
    branches: [main]

# Read-only by default; the analysis job opts into the minimal extra scopes.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed for the OIDC token Scorecard uses to publish results.
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API so the public Scorecard
          # badge / report stays current. Requires the id-token scope above.
          publish_results: true

      # Keep the raw SARIF as an artifact for debugging even if the upload below
      # is rejected (e.g. code scanning not yet enabled on a fork).
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
