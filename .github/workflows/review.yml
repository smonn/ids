name: Review agent PRs

# Posts an automated code review (inline comments, never an approval) on each agent
# PR when it opens. Scoped to agent/issue-* so it doesn't review human PRs, and runs
# once on open — not on every push — to bound cost. Re-review on demand via the
# `needs-review` label or workflow_dispatch.

on:
  pull_request:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.action != 'labeled' || github.event.label.name == 'needs-review') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'agent/issue-'))
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Clear prior review comment (re-reviews only)
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The code-review plugin skips a PR it has already reviewed. For an explicit
          # re-review, delete its prior "## Code review" comment so it runs fresh.
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "smonn[bot]" and (.body | startswith("## Code review"))) | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/$GH_REPO/issues/comments/$id" && echo "deleted prior review comment $id"
            done

      - name: Remove the needs-review label (so it can be re-applied)
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label needs-review || true

      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Review the PR
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The PR was opened by the App, so the pull_request actor is a bot.
          allowed_bots: "smonn[bot]"
          # The code-review plugin posts inline findings (--comment). It reviews, it
          # does not approve/merge — and GitHub blocks self-approval anyway.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ env.PR_NUMBER }} --comment

            Review the code itself: correctness and logic, design, architecture, API
            surface, naming, and adherence to CONTEXT.md and docs/adr/. CI already runs
            tests, typecheck, lint, depcruise, and build — do NOT run or re-verify those.

            Anchor every change request to a file. Post each finding as an inline review
            comment on a specific file and line, not as a top-level summary comment.
            GitHub only allows inline comments on lines inside this PR's diff: if a finding
            concerns a file or line NOT in the diff, attach the comment to the first
            changed file in the PR and open it with an explicit pointer to the real
            location, e.g. "⚠️ Re `CONTEXT.md:19` (not the file this comment is on): …".
          # Read-only inspection plus gh/git for reading the diff and posting comments.
          # Bash is scoped to gh and git so the reviewer cannot run the static-analysis
          # gate (pnpm test/lint/typecheck/build) — CI owns that; reviews stay fast and
          # focused on code/design. No Edit/Write; the reviewer never changes code.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,TodoWrite,Bash(gh:*),Bash(git:*)"
