name: Review agent PRs

# Posts an automated code review (a two-axis Standards + Spec report, never an
# approval) on each agent PR. Scoped to agent/issue-* so it doesn't review human PRs.
# It reviews on open and on every push (synchronize), deduped per commit so a single
# commit is reviewed once — this keeps the required `review` check fresh on the current
# head SHA instead of stranding it on the opened commit after later pushes.
#
# The job ALWAYS runs (there is no job-level `if`) and the agent/event/label scoping
# lives in the first `scope` step instead. This is deliberate: the `review` check is a
# required status check, and we want it to report a real, visible `success` on the head
# commit for every PR — including human and forked PRs — rather than leaning on GitHub's
# implicit "a job skipped by a conditional counts as success" rule. Out-of-scope PRs run
# only the `scope` step (which needs no secrets, so forks report a genuine success too)
# and then every later step no-ops, so the job finishes green without reviewing. In-scope
# agent PRs run the full review, and a genuine review failure still fails the check.
#
# Findings that anchor to a changed line are posted as INLINE review comments on the
# diff; a single STICKY top-level summary comment carries the overview plus any
# findings that don't map to a specific line. The summary is tagged with a stable
# marker (`<!-- code-review-summary -->`) and re-posted fresh on every review, so
# successive rounds REPLACE it instead of piling up — there is only ever one summary
# comment on the PR. It also records the reviewed commit's SHA (`<!-- code-review:SHA
# -->`); automatic triggers (opened/reopened/synchronize) skip when the sticky summary
# already covers the current commit. Inline comments keep only the per-SHA marker; a forced
# re-review (the `needs-review` label or workflow_dispatch) sweeps this commit's prior
# inline comments so the new pass replaces them, while earlier commits' inline comments
# stay as history.
#
# As its final step the agent applies `address-feedback` to the PR when it found one
# or more HARD findings, so address-review.yml picks the PR up automatically and the
# agent fixes them — no human has to relay a review that surfaced real defects. Reviews
# with only soft / judgment-call findings (or none) leave the label off, and a run the
# dedup gate skipped never reaches the agent, so neither applies the label.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      # Explicit re-review (manual dispatch or the needs-review label) forces a
      # fresh pass; automatic open/reopen events dedup on the reviewed commit.
      FORCED: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'labeled' }}
    steps:
      # Internal scope gate (replaces the old job-level `if`). The job always runs so the
      # required `review` check always reports a real status on the head commit; this step
      # decides whether the PR is actually in scope for a review. It uses ONLY the github
      # context (no secrets), so a forked PR — which gets no secrets — still runs it and
      # reports a genuine success instead of a skipped-but-required check. A PR is in scope
      # when it's a manual dispatch, or a same-repo agent/issue-* branch on an open/reopen
      # event (or a `needs-review` re-label). Everything else short-circuits to success.
      - name: Decide whether this PR is in scope for an automated review
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          THIS_REPO: ${{ github.repository }}
        run: |
          review=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            review=true
          elif { [ "$ACTION" != "labeled" ] || [ "$LABEL" = "needs-review" ]; } &&
               [ "$HEAD_REPO" = "$THIS_REPO" ] &&
               case "$HEAD_REF" in agent/issue-*) true ;; *) false ;; esac; then
            review=true
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if [ "$review" = "true" ]; then
            echo "In scope — running the automated review."
          else
            echo "Out of scope ($EVENT_NAME/$ACTION on $HEAD_REF) — reporting success without reviewing."
          fi

      - name: Generate GitHub App token
        if: steps.scope.outputs.review == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: review only reads the checked-out PR, posts review comments
          # (issues + pulls), and toggles the address-feedback label. It never pushes —
          # contents stays read-only.
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve PR head SHA
        if: steps.scope.outputs.review == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pull_request events carry the head SHA; workflow_dispatch must look it up.
          sha="$EVENT_SHA"
          [ -n "$sha" ] || sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Head SHA for #$PR_NUMBER: $sha"

      - name: Remove the needs-review label (so it can be re-applied)
        if: steps.scope.outputs.review == 'true' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label needs-review || true

      - name: Dedup and keep a single sticky summary
        if: steps.scope.outputs.review == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # The summary is a SINGLE sticky comment per PR, tagged with a stable marker
          # and re-posted fresh each review so rounds don't pile up. It also carries the
          # reviewed commit's SHA marker (a hex object id, safe to splice into jq) so we
          # can tell whether the current commit was already reviewed. Inline comments
          # keep only the per-SHA marker and are swept on a forced re-review.
          summary_marker="<!-- code-review-summary -->"
          sha_marker="<!-- code-review:${HEAD_SHA} -->"
          summary_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$summary_marker\")))][0].id // empty")
          if [ "$FORCED" != "true" ] && [ -n "$summary_id" ]; then
            # Non-forced (opened / reopened / redelivery): skip if the sticky summary
            # already covers THIS commit.
            if gh api "repos/$GH_REPO/issues/comments/$summary_id" --jq '.body' | grep -qF "$sha_marker"; then
              echo "Commit $HEAD_SHA already reviewed; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Proceeding: delete the stale sticky summary so the agent's fresh post is the
          # only summary on the PR (collapses N round-summaries into one).
          if [ -n "$summary_id" ]; then
            gh api -X DELETE "repos/$GH_REPO/issues/comments/$summary_id" && echo "removed prior sticky summary $summary_id"
          fi
          # On a forced re-review also drop this commit's prior inline comments so the new
          # pass replaces them (earlier commits' inline comments stay as history).
          if [ "$FORCED" = "true" ]; then
            inline=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$sha_marker\"))) | .id")
            for id in $inline; do
              gh api -X DELETE "repos/$GH_REPO/pulls/comments/$id" && echo "deleted prior inline comment $id for $HEAD_SHA"
            done
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch main as the review diff base
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        # The review skill diffs HEAD against a fixed point; make `origin/main`
        # resolvable (checkout only fetched the PR head ref).
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Review the PR
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The PR was opened by the App, so the pull_request actor is a bot.
          allowed_bots: "smonn[bot]"
          prompt: |
            /review origin/main

            Review PR #${{ env.PR_NUMBER }} of ${{ github.repository }} (`@smonn/ids`,
            a TypeScript library for sortable IDs) using the repo's `review` skill,
            invoked above with `origin/main` as the fixed point. The skill runs two
            parallel sub-agents and aggregates their findings:
            - Standards — conformance to this repo's documented standards: CONTRIBUTING.md,
              AGENTS.md, CONTEXT.md (domain glossary + CLOSED decisions), and docs/adr/.
            - Spec — faithfulness to the originating issue. Find it from `Closes #N` in
              the PR body (`gh pr view ${{ env.PR_NUMBER }} --json title,body`) and fetch
              it per docs/agents/issue-tracker.md.

            CI already runs tests, typecheck, lint, depcruise, and build — the review is
            about correctness, design, architecture, API surface, and naming; do NOT run
            or re-verify the static-analysis gate.

            SCOPE DISCIPLINE — a review HONES scope, it never grows it. Classify every
            finding before you post it:
              - IN-SCOPE: a defect in the lines/files THIS PR changes, or a missed,
                incorrect, or over-reached acceptance criterion from the originating
                issue. These are the only findings that may be "hard" (drive a fix).
              - FOLLOW-UP: anything that would EXTEND scope — a pre-existing problem in
                code this PR doesn't touch, an adjacent improvement, a new
                capability / rule / abstraction / test the acceptance criteria didn't
                ask for, or a broader refactor. NEVER raise these as hard findings no
                matter how valid; recommend filing a follow-up issue (or note an existing
                one) and move on. Do not push the PR to do this extra work.
            If the PR ITSELF has expanded beyond its acceptance criteria, that is an
            in-scope Spec finding: recommend the extra work be TRIMMED and moved to a
            follow-up issue, rather than ratifying the expansion. When unsure whether a
            finding is in-scope, treat it as a follow-up — bias the loop toward
            converging, never toward growing.

            You are headless: do NOT pause for input. Surface the findings in TWO
            places — inline on the diff where a finding maps to a changed line, and a
            single top-level summary comment for everything else.

            CRITICAL — how to author every comment body. GitHub renders raw markdown,
            and shell-quoting comment bodies inline is the #1 source of corrupted
            reviews. So for EVERY comment (inline and summary):
              - Author the body with the Write tool to a file (e.g. `body.md`). The
                Write tool writes bytes verbatim — use REAL newlines (press enter), not
                `\n`. Never construct a body inside a shell argument or heredoc.
              - Never emit backslash escapes (`\n`, `\t`, `\"`) and never escape markdown
                metacharacters (`<`, `>`, `[`, `]`, backtick) with a backslash — write
                them as plain characters; GitHub renders them correctly. A literal `\n`
                or `\<` in a posted comment is a bug.
              - Pass the file to `gh`; do not pass the prose as a string argument.

            FIRST, post inline review comments for every finding that anchors to a
            specific changed line — one API call per finding, pinned to the reviewed
            commit. Write the finding's body to a file, then build the payload with `jq`
            (so jq does all JSON escaping) and post via `--input`:

                # write the body to body.md with the Write tool first, then:
                jq -n \
                  --arg commit_id "${{ steps.sha.outputs.sha }}" \
                  --arg path "<file>" \
                  --argjson line <line-in-the-new-file> \
                  --arg body "$(cat body.md)" \
                  '{commit_id:$commit_id, path:$path, line:$line, side:"RIGHT", body:$body}' \
                  | gh api -X POST repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments --input -

            The body file must start with `**[Standards|Spec]** <the finding>` and END
            with the hidden marker line `<!-- code-review:${{ steps.sha.outputs.sha }} -->`
            (verbatim, full SHA) so forced re-reviews can clean it up.

            Only anchor to lines that are part of THIS PR's diff against origin/main — a
            line GitHub won't accept (not in the diff) returns 422; if a finding has no
            such line, leave it for the summary instead.

            THEN post the summary as ONE top-level comment. Write the full summary to a
            file with the Write tool (real newlines, no escapes — see the rules above),
            then post it with `gh pr comment ${{ env.PR_NUMBER }} --body-file <file>`.
            It MUST begin EXACTLY with, in order:

                ## Code review (commit `${{ steps.sha.outputs.short }}`)
                <!-- code-review-summary -->
                <!-- code-review:${{ steps.sha.outputs.sha }} -->

                > *This was generated by AI during review.*

            followed by the skill's `## Standards` and `## Spec` sections — but for any
            point you already posted inline, replace its full text with a one-line
            pointer (e.g. "See inline comment on `src/foo.ts`") so the detail lives with
            the code and isn't duplicated. Keep findings with no line anchor in full.
            The heading line and BOTH marker lines — the stable `<!-- code-review-summary
            -->` (which keeps this the single sticky summary) and the full-SHA `<!--
            code-review:... -->` (the reviewed commit) — must be kept verbatim and in
            this order; they are the summary comment's keys, and the post-run verify step
            fails the job if the summary is missing. (Inline comments keep ONLY the
            per-SHA marker, not the summary marker.)

            FINALLY, decide whether this review surfaced any HARD findings. A hard
            finding is a real defect that needs a fix before merge — a clear Standards
            violation or a missing / incorrect Spec requirement — that is ALSO IN-SCOPE
            (a flaw in what this PR changed, or a missed / incorrect acceptance
            criterion), as opposed to a soft suggestion, nice-to-have, judgment call, or
            anything classified FOLLOW-UP above. A finding about adjacent or pre-existing
            code, or about new capabilities beyond the acceptance criteria, is NEVER hard
            no matter how valid — it is a follow-up. If you posted ONE OR MORE in-scope
            hard findings (inline or in the summary), apply the `address-feedback` label
            as your last action so the fix loop (address-review.yml) picks the PR up
            automatically — this keeps the loop honing the PR instead of growing it:

                gh pr edit ${{ env.PR_NUMBER }} --add-label address-feedback

            Do NOT apply the label if every finding is soft / a judgment call, or if you
            found nothing — leave the PR for a human in that case. Applying this one
            label is the only mutation you may make; it is not an approval or a change
            request.

            This is a review only: never approve, request changes, merge, or edit code.
          # Read-only inspection plus gh/git for reading the diff and posting the
          # inline comments + summary, and Task so the skill can spawn its two parallel
          # sub-agents. Write + Bash(cat/jq) are required by the body-authoring procedure
          # in the prompt above: each comment body is written to a scratch file with the
          # Write tool, then posted via `jq -n … --arg body "$(cat body.md)" | gh api`.
          # Without them the agent burns turns retrying denied calls and can exhaust
          # --max-turns before posting (the original cause of this job timing out). No
          # Edit and no commit/push: the reviewer authors scratch files but never changes
          # tracked code, and Bash stays scoped so it cannot run the static-analysis gate
          # (CI owns that).
          claude_args: |
            --max-turns 60
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,Write,TodoWrite,Task,Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(cat:*)"

      # Catch the "hollow success" case: the agent can exit 0 without posting. Require
      # a review comment tagged with THIS commit's marker so a silent failure fails
      # loudly. Also guard against corrupted bodies: a body that still contains literal
      # escape sequences (\n, \<, \[) instead of rendered markdown means the agent
      # shell-quoted the prose — fail so the garbled review doesn't ship silently.
      - name: Verify the review comment was posted
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          marker="<!-- code-review:${HEAD_SHA} -->"
          # Collect every comment for this commit's marker, summary (issues) + inline
          # (pulls), as one JSON array of body strings. Each call emits a JSON array;
          # `jq -s add` concatenates them while keeping each body a discrete string.
          select="[.[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$marker\"))) | .body]"
          bodies=$(
            { gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq "$select"
              gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments"  --paginate --jq "$select"
            } | jq -s 'add'
          )
          found=$(echo "$bodies" | jq 'length')
          if [ "${found:-0}" -le 0 ]; then
            echo "::error::No review comment tagged $HEAD_SHA on PR #$PR_NUMBER — the review did not post (check the run log)."
            exit 1
          fi
          # A well-formed body has real newlines and unescaped markdown; a literal
          # backslash-escape (\n, \<, \[) means the prose was shell-quoted — corruption.
          corrupt=$(echo "$bodies" | jq '[.[] | select(test("\\\\n|\\\\<|\\\\\\["))] | length')
          if [ "${corrupt:-0}" -gt 0 ]; then
            echo "::error::A review comment for $HEAD_SHA contains literal escape sequences (\\n, \\<, \\[) instead of rendered markdown — the body was shell-quoted. Fix the body authoring and re-review."
            exit 1
          fi
          echo "✓ $found review comment(s) for $HEAD_SHA posted on PR #$PR_NUMBER, all well-formed."
