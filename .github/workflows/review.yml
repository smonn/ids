name: Review agent PRs

# Posts an automated code review (a two-axis Standards + Spec report, never an
# approval) on each agent PR when it opens. Scoped to agent/issue-* so it doesn't
# review human PRs, and runs once on open — not on every push — to bound cost.
#
# Findings that anchor to a changed line are posted as INLINE review comments on the
# diff; the top-level summary comment carries the overview plus any findings that
# don't map to a specific line. Both the summary comment and every inline comment are
# tagged with the reviewed commit SHA (`<!-- code-review:SHA -->`). Automatic triggers
# (opened/reopened) dedup on the summary comment's tag — a commit already reviewed is
# skipped, so reopens and redeliveries don't repost. Explicit re-review (the
# `needs-review` label or workflow_dispatch) forces a fresh pass, deleting only that
# same commit's prior summary AND inline comments so the new pass replaces them;
# comments on earlier commits are left in place as history.
#
# As its final step the agent applies `address-feedback` to the PR when it found one
# or more HARD findings, so address-review.yml picks the PR up automatically and the
# agent fixes them — no human has to relay a review that surfaced real defects. Reviews
# with only soft / judgment-call findings (or none) leave the label off, and a run the
# dedup gate skipped never reaches the agent, so neither applies the label.

on:
  pull_request:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.action != 'labeled' || github.event.label.name == 'needs-review') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'agent/issue-'))
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      # Explicit re-review (manual dispatch or the needs-review label) forces a
      # fresh pass; automatic open/reopen events dedup on the reviewed commit.
      FORCED: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'labeled' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve PR head SHA
        id: sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pull_request events carry the head SHA; workflow_dispatch must look it up.
          sha="$EVENT_SHA"
          [ -n "$sha" ] || sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Head SHA for #$PR_NUMBER: $sha"

      - name: Remove the needs-review label (so it can be re-applied)
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label needs-review || true

      - name: Dedup on reviewed commit
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # The summary comment and every inline comment carry a hidden marker for the
          # commit reviewed. HEAD_SHA is a hex object id, so it's safe to splice into jq.
          # Dedup keys on the top-level summary comment (issues/comments); the inline
          # comments (pulls/comments) are only swept on a forced re-review.
          marker="<!-- code-review:${HEAD_SHA} -->"
          existing=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$marker\"))) | .id")
          if [ "$FORCED" = "true" ]; then
            # Explicit re-review: drop only this commit's prior summary AND inline
            # comments so the fresh pass replaces them (other commits' comments are
            # left as history), then run.
            for id in $existing; do
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$id" && echo "deleted prior summary $id for $HEAD_SHA"
            done
            inline=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$marker\"))) | .id")
            for id in $inline; do
              gh api -X DELETE "repos/$GH_REPO/pulls/comments/$id" && echo "deleted prior inline comment $id for $HEAD_SHA"
            done
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$existing" ]; then
            echo "Commit $HEAD_SHA already reviewed; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch main as the review diff base
        if: steps.gate.outputs.skip != 'true'
        # The review skill diffs HEAD against a fixed point; make `origin/main`
        # resolvable (checkout only fetched the PR head ref).
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Review the PR
        if: steps.gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The PR was opened by the App, so the pull_request actor is a bot.
          allowed_bots: "smonn[bot]"
          prompt: |
            /review origin/main

            Review PR #${{ env.PR_NUMBER }} of ${{ github.repository }} (`@smonn/ids`,
            a TypeScript library for sortable IDs) using the repo's `review` skill,
            invoked above with `origin/main` as the fixed point. The skill runs two
            parallel sub-agents and aggregates their findings:
            - Standards — conformance to this repo's documented standards: CONTRIBUTING.md,
              AGENTS.md, CONTEXT.md (domain glossary + CLOSED decisions), and docs/adr/.
            - Spec — faithfulness to the originating issue. Find it from `Closes #N` in
              the PR body (`gh pr view ${{ env.PR_NUMBER }} --json title,body`) and fetch
              it per docs/agents/issue-tracker.md.

            CI already runs tests, typecheck, lint, depcruise, and build — the review is
            about correctness, design, architecture, API surface, and naming; do NOT run
            or re-verify the static-analysis gate.

            You are headless: do NOT pause for input. Surface the findings in TWO
            places — inline on the diff where a finding maps to a changed line, and a
            single top-level summary comment for everything else.

            CRITICAL — how to author every comment body. GitHub renders raw markdown,
            and shell-quoting comment bodies inline is the #1 source of corrupted
            reviews. So for EVERY comment (inline and summary):
              - Author the body with the Write tool to a file (e.g. `body.md`). The
                Write tool writes bytes verbatim — use REAL newlines (press enter), not
                `\n`. Never construct a body inside a shell argument or heredoc.
              - Never emit backslash escapes (`\n`, `\t`, `\"`) and never escape markdown
                metacharacters (`<`, `>`, `[`, `]`, backtick) with a backslash — write
                them as plain characters; GitHub renders them correctly. A literal `\n`
                or `\<` in a posted comment is a bug.
              - Pass the file to `gh`; do not pass the prose as a string argument.

            FIRST, post inline review comments for every finding that anchors to a
            specific changed line — one API call per finding, pinned to the reviewed
            commit. Write the finding's body to a file, then build the payload with `jq`
            (so jq does all JSON escaping) and post via `--input`:

                # write the body to body.md with the Write tool first, then:
                jq -n \
                  --arg commit_id "${{ steps.sha.outputs.sha }}" \
                  --arg path "<file>" \
                  --argjson line <line-in-the-new-file> \
                  --arg body "$(cat body.md)" \
                  '{commit_id:$commit_id, path:$path, line:$line, side:"RIGHT", body:$body}' \
                  | gh api -X POST repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments --input -

            The body file must start with `**[Standards|Spec]** <the finding>` and END
            with the hidden marker line `<!-- code-review:${{ steps.sha.outputs.sha }} -->`
            (verbatim, full SHA) so forced re-reviews can clean it up.

            Only anchor to lines that are part of THIS PR's diff against origin/main — a
            line GitHub won't accept (not in the diff) returns 422; if a finding has no
            such line, leave it for the summary instead.

            THEN post the summary as ONE top-level comment. Write the full summary to a
            file with the Write tool (real newlines, no escapes — see the rules above),
            then post it with `gh pr comment ${{ env.PR_NUMBER }} --body-file <file>`.
            It MUST begin EXACTLY with, in order:

                ## Code review (commit `${{ steps.sha.outputs.short }}`)
                <!-- code-review:${{ steps.sha.outputs.sha }} -->

                > *This was generated by AI during review.*

            followed by the skill's `## Standards` and `## Spec` sections — but for any
            point you already posted inline, replace its full text with a one-line
            pointer (e.g. "See inline comment on `src/foo.ts`") so the detail lives with
            the code and isn't duplicated. Keep findings with no line anchor in full.
            The heading line and the `<!-- code-review:... -->` marker (the full SHA,
            kept verbatim) are the summary comment's dedup key — never alter or omit
            them; the post-run verify step fails the job if the summary is missing.

            FINALLY, decide whether this review surfaced any HARD findings. A hard
            finding is a real defect that needs a fix before merge — a clear Standards
            violation or a missing / incorrect Spec requirement — as opposed to a soft
            suggestion, nice-to-have, or judgment call. If you posted ONE OR MORE hard
            findings (inline or in the summary), apply the `address-feedback` label as
            your last action so the fix loop (address-review.yml) picks the PR up
            automatically:

                gh pr edit ${{ env.PR_NUMBER }} --add-label address-feedback

            Do NOT apply the label if every finding is soft / a judgment call, or if you
            found nothing — leave the PR for a human in that case. Applying this one
            label is the only mutation you may make; it is not an approval or a change
            request.

            This is a review only: never approve, request changes, merge, or edit code.
          # Read-only inspection plus gh/git for reading the diff and posting the
          # inline comments + summary, and Task so the skill can spawn its two parallel
          # sub-agents. No Edit/Write; the reviewer never changes code, and Bash is scoped to gh/git
          # so it cannot run the static-analysis gate (CI owns that).
          claude_args: |
            --max-turns 40
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,TodoWrite,Task,Bash(gh:*),Bash(git:*)"

      # Catch the "hollow success" case: the agent can exit 0 without posting. Require
      # a review comment tagged with THIS commit's marker so a silent failure fails
      # loudly. Also guard against corrupted bodies: a body that still contains literal
      # escape sequences (\n, \<, \[) instead of rendered markdown means the agent
      # shell-quoted the prose — fail so the garbled review doesn't ship silently.
      - name: Verify the review comment was posted
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          marker="<!-- code-review:${HEAD_SHA} -->"
          # Collect every comment for this commit's marker, summary (issues) + inline
          # (pulls), as one JSON array of body strings. Each call emits a JSON array;
          # `jq -s add` concatenates them while keeping each body a discrete string.
          select="[.[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$marker\"))) | .body]"
          bodies=$(
            { gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate --jq "$select"
              gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments"  --paginate --jq "$select"
            } | jq -s 'add'
          )
          found=$(echo "$bodies" | jq 'length')
          if [ "${found:-0}" -le 0 ]; then
            echo "::error::No review comment tagged $HEAD_SHA on PR #$PR_NUMBER — the review did not post (check the run log)."
            exit 1
          fi
          # A well-formed body has real newlines and unescaped markdown; a literal
          # backslash-escape (\n, \<, \[) means the prose was shell-quoted — corruption.
          corrupt=$(echo "$bodies" | jq '[.[] | select(test("\\\\n|\\\\<|\\\\\\["))] | length')
          if [ "${corrupt:-0}" -gt 0 ]; then
            echo "::error::A review comment for $HEAD_SHA contains literal escape sequences (\\n, \\<, \\[) instead of rendered markdown — the body was shell-quoted. Fix the body authoring and re-review."
            exit 1
          fi
          echo "✓ $found review comment(s) for $HEAD_SHA posted on PR #$PR_NUMBER, all well-formed."
