name: Review agent PRs

# Posts an automated code review (a two-axis Standards + Spec report, never an
# approval) on each agent PR. Scoped to agent/issue-* so it doesn't review human PRs.
# It reviews on open and on every push (synchronize), deduped per commit so a single
# commit is reviewed once — this keeps the required `review` check fresh on the current
# head SHA instead of stranding it on the opened commit after later pushes.
#
# The job ALWAYS runs (there is no job-level `if`) and the agent/event/label scoping
# lives in the first `scope` step instead. This is deliberate: the `review` check is a
# required status check, and we want it to report a real, visible `success` on the head
# commit for every PR — including human and forked PRs — rather than leaning on GitHub's
# implicit "a job skipped by a conditional counts as success" rule. Out-of-scope PRs run
# only the `scope` step (which needs no secrets, so forks report a genuine success too)
# and then every later step no-ops, so the job finishes green without reviewing. In-scope
# agent PRs run the full review, and a genuine review failure still fails the check.
#
# PRODUCE / POST split. The Claude step is a pure PRODUCER: it writes findings to files
# under `.review/` and makes ZERO GitHub mutations. A separate deterministic `post` step
# reads those files and posts ONE pull-request review (a single `event: COMMENT` review
# bundling every inline finding plus a top-level summary body). Keeping the posting in a
# script — instead of having the agent shell-quote bodies into `gh api` — is what makes
# bodies reliable: the agent writes raw markdown with the Write tool (real newlines, no
# escapes) and `jq` does all JSON encoding at post time. The review is COMMENT-only by
# design: it never approves or requests changes (and GitHub would reject either anyway,
# since the App that posts the review also authored the PR — you can't approve your own).
#
# The review body and every inline comment carry a per-commit marker (`<!-- code-review:SHA
# -->`); the summary body also carries the stable `<!-- code-review-summary -->` marker.
# Automatic triggers (opened/reopened/synchronize) skip when a bot review already carries
# the current commit's marker. A forced re-review (the `needs-review` label or
# workflow_dispatch) sweeps this commit's prior inline review comments so the new pass
# replaces them, while earlier commits' inline comments stay as history. (A submitted
# COMMENT review object can't be deleted, so a forced re-review of the *same* commit leaves
# the prior review's summary in place and adds a fresh one — rare, and harmless.)
#
# As its final action the `post` step applies `address-feedback` to the PR when the
# producer flagged one or more HARD findings (manifest `hard_findings: true`), so
# address-review.yml picks the PR up automatically and the agent fixes them — no human has
# to relay a review that surfaced real defects. Reviews with only soft / judgment-call
# findings (or none) leave the label off, and a run the dedup gate skipped never reaches
# the producer, so neither applies the label.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      # Explicit re-review (manual dispatch or the needs-review label) forces a
      # fresh pass; automatic open/reopen events dedup on the reviewed commit.
      FORCED: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'labeled' }}
    steps:
      # Internal scope gate (replaces the old job-level `if`). The job always runs so the
      # required `review` check always reports a real status on the head commit; this step
      # decides whether the PR is actually in scope for a review. It uses ONLY the github
      # context (no secrets), so a forked PR — which gets no secrets — still runs it and
      # reports a genuine success instead of a skipped-but-required check. A PR is in scope
      # when it's a manual dispatch, or a same-repo agent/issue-* branch on an open/reopen
      # event (or a `needs-review` re-label). Everything else short-circuits to success.
      - name: Decide whether this PR is in scope for an automated review
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          THIS_REPO: ${{ github.repository }}
        run: |
          review=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            review=true
          elif { [ "$ACTION" != "labeled" ] || [ "$LABEL" = "needs-review" ]; } &&
               [ "$HEAD_REPO" = "$THIS_REPO" ] &&
               case "$HEAD_REF" in agent/issue-*) true ;; *) false ;; esac; then
            review=true
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if [ "$review" = "true" ]; then
            echo "In scope — running the automated review."
          else
            echo "Out of scope ($EVENT_NAME/$ACTION on $HEAD_REF) — reporting success without reviewing."
          fi

      - name: Generate GitHub App token
        if: steps.scope.outputs.review == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: review only reads the checked-out PR, posts a review
          # (issues + pulls), and toggles the address-feedback label. It never pushes —
          # contents stays read-only.
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve PR head SHA
        if: steps.scope.outputs.review == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pull_request events carry the head SHA; workflow_dispatch must look it up.
          sha="$EVENT_SHA"
          [ -n "$sha" ] || sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Head SHA for #$PR_NUMBER: $sha"

      - name: Remove the needs-review label (so it can be re-applied)
        if: steps.scope.outputs.review == 'true' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label needs-review || true

      - name: Dedup on the reviewed commit
        if: steps.scope.outputs.review == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # A review is one PR review object whose body carries the reviewed commit's SHA
          # marker (a hex object id, safe to splice into jq). We dedup by asking whether a
          # bot review already covers THIS commit. Inline review comments carry the same
          # per-SHA marker and are swept on a forced re-review.
          sha_marker="<!-- code-review:${HEAD_SHA} -->"
          reviewed=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$sha_marker\")))] | length")
          if [ "$FORCED" != "true" ] && [ "${reviewed:-0}" -gt 0 ]; then
            # Non-forced (opened / reopened / redelivery): skip if a bot review already
            # covers THIS commit.
            echo "Commit $HEAD_SHA already reviewed; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On a forced re-review drop this commit's prior inline review comments so the
          # new pass replaces them (earlier commits' inline comments stay as history). The
          # prior review object itself can't be deleted; its summary is simply superseded.
          if [ "$FORCED" = "true" ]; then
            inline=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$sha_marker\"))) | .id")
            for id in $inline; do
              gh api -X DELETE "repos/$GH_REPO/pulls/comments/$id" && echo "deleted prior inline comment $id for $HEAD_SHA"
            done
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch main as the review diff base
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        # The diff base is computed here (not by the agent); make `origin/main`
        # resolvable (checkout only fetched the PR head ref).
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Precompute every input the producer needs and write it under .review-context/, so
      # the agent itself runs NO git and NO gh — it reads files and writes files, nothing
      # else. This keeps the producer hermetic (it can't run the static-analysis gate or
      # mutate the PR) and lets later runs recall what earlier reviews already said.
      - name: Build review context (diff, issue, prior reviews)
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .review-context

          # The diff and its shape (commit list + changed files), against origin/main.
          git log origin/main..HEAD --oneline           > .review-context/commits.txt
          git diff --name-status origin/main...HEAD      > .review-context/changed-files.txt
          git diff origin/main...HEAD                    > .review-context/diff.patch

          # The PR body and the originating issue(s) it closes (Spec source). Parse
          # Closes/Fixes/Resolves #N from the body and fetch each; never fail the build if
          # an issue can't be read.
          pr_body=$(gh pr view "$PR_NUMBER" --json title,body --jq '.title + "\n\n" + (.body // "")')
          printf '%s\n' "$pr_body" > .review-context/pr.md
          issues=$(printf '%s' "$pr_body" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)
          {
            if [ -n "$issues" ]; then
              for n in $issues; do
                echo "## Issue #$n"; echo
                gh issue view "$n" --json title,body --jq '"**" + .title + "**\n\n" + (.body // "")' \
                  2>/dev/null || echo "(could not fetch issue #$n)"
                echo; echo "---"; echo
              done
            else
              echo "No originating issue found in the PR body (no Closes/Fixes/Resolves #N)."
            fi
          } > .review-context/issue.md

          # Recollection: prior bot reviews on this PR (summaries) and prior inline
          # comments, each tagged with the commit it covered, so this pass doesn't repeat
          # findings and can note ones still unaddressed.
          {
            echo "# Prior automated reviews on this PR"; echo
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" --paginate \
              --jq '.[] | select(.user.login=="smonn[bot]") | "## Review on commit " + (.commit_id[0:7]) + "\n\n" + (.body // "") + "\n"' || true
            echo; echo "## Prior inline comments"; echo
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.login=="smonn[bot]") | "- `" + .path + "` (commit " + ((.original_commit_id // .commit_id)[0:7]) + "): " + ((.body // "") | gsub("\n"; " "))' || true
          } > .review-context/prior-reviews.md

          echo "Context built:"; wc -l .review-context/* || true

      - name: Produce the review (write findings to .review/, post nothing)
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1.0.153
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The PR was opened by the App, so the pull_request actor is a bot.
          allowed_bots: "smonn[bot]"
          prompt: |
            /review origin/main

            Review PR #${{ env.PR_NUMBER }} of ${{ github.repository }} (`@smonn/ids`,
            a TypeScript library for sortable IDs) using the repo's `review` skill, with
            `origin/main` as the fixed point. The skill runs two parallel sub-agents and
            aggregates their findings:
            - Standards — conformance to this repo's documented standards: CONTRIBUTING.md,
              AGENTS.md, CONTEXT.md (domain glossary + CLOSED decisions), and docs/adr/.
              Read these from the checkout with Read/Grep/Glob.
            - Spec — faithfulness to the originating issue.

            EVERYTHING the skill would normally compute has been PRECOMPUTED for you under
            `.review-context/` — you have NO shell, NO git, and NO gh. Do not try to run
            them; read these files instead and pass their contents to the skill's
            sub-agents in place of any `git diff` / `gh` command the skill describes:
            - `.review-context/diff.patch`     — the full `git diff origin/main...HEAD`.
            - `.review-context/commits.txt`    — the commit list.
            - `.review-context/changed-files.txt` — name-status of changed files.
            - `.review-context/pr.md`          — the PR title + body.
            - `.review-context/issue.md`       — the originating issue(s) (the Spec). If it
              says no issue was found, the Spec axis reports "no spec available".
            - `.review-context/prior-reviews.md` — what earlier automated reviews already
              said on this PR. Use it: do NOT repeat a finding already raised on the same
              code; instead, if a prior finding is still unaddressed in the current diff,
              re-raise it briefly noting it was flagged before; skip ones now resolved.

            CI already runs tests, typecheck, lint, depcruise, and build — the review is
            about correctness, design, architecture, API surface, and naming; do NOT run
            or re-verify the static-analysis gate.

            SCOPE DISCIPLINE — a review HONES scope, it never grows it. Classify every
            finding before you record it:
              - IN-SCOPE: a defect in the lines/files THIS PR changes, or a missed,
                incorrect, or over-reached acceptance criterion from the originating
                issue. These are the only findings that may be "hard" (drive a fix).
              - FOLLOW-UP: anything that would EXTEND scope — a pre-existing problem in
                code this PR doesn't touch, an adjacent improvement, a new
                capability / rule / abstraction / test the acceptance criteria didn't
                ask for, or a broader refactor. NEVER raise these as hard findings no
                matter how valid; recommend filing a follow-up issue (or note an existing
                one) and move on. Do not push the PR to do this extra work.
            If the PR ITSELF has expanded beyond its acceptance criteria, that is an
            in-scope Spec finding: recommend the extra work be TRIMMED and moved to a
            follow-up issue, rather than ratifying the expansion. When unsure whether a
            finding is in-scope, treat it as a follow-up — bias the loop toward
            converging, never toward growing.

            You are headless and you are a PRODUCER ONLY: you have no shell and cannot
            touch GitHub at all. You do NOT post, approve, request changes, comment,
            label, merge, or edit code. Your entire job is to READ the precomputed context
            above and WRITE the review to files under a `.review/` directory; a later
            deterministic step reads those files and posts a single pull-request review.

            Author every file with the Write tool, which writes bytes verbatim: use REAL
            newlines (press enter), never the characters backslash-n. In prose bodies,
            never emit backslash escapes and never backslash-escape markdown
            metacharacters (`<`, `>`, `[`, `]`, backtick) — write them as plain
            characters; GitHub renders them correctly. A literal backslash-n or
            backslash-`<` in a body is a bug. You never touch JSON escaping or `gh` — the
            posting step does that.

            Write exactly these files:

            1. `.review/summary.md` — the top-level review summary. It MUST begin EXACTLY
               with, in order:

                   ## Code review (commit `${{ steps.sha.outputs.short }}`)
                   <!-- code-review-summary -->
                   <!-- code-review:${{ steps.sha.outputs.sha }} -->

                   > *This was generated by AI during review.*

               followed by the skill's `## Standards` and `## Spec` sections. For any
               finding you also recorded as an inline comment (below), replace its full
               text here with a one-line pointer (e.g. "See inline comment on
               `src/foo.ts`") so the detail lives with the code; keep findings with no
               line anchor in full. The heading line and BOTH marker lines must be kept
               verbatim and in this order.

            2. `.review/inline/<n>.md` — one file per finding that anchors to a specific
               changed line (number them 1, 2, 3, …). Each body MUST start with
               `**[Standards|Spec]** ` followed by the finding, and MUST END with the
               marker line `<!-- code-review:${{ steps.sha.outputs.sha }} -->` (verbatim,
               full SHA). Only anchor to lines that are part of THIS PR's diff against
               origin/main; if a finding has no such line, put it in the summary instead.

            3. `.review/manifest.json` — a JSON object describing what to post. It carries
               ONLY scalars (paths, line numbers, the side, file names, a boolean) — never
               prose, so there is nothing to escape. Shape:

                   {
                     "summary_file": "summary.md",
                     "hard_findings": <true|false>,
                     "inline": [
                       { "body_file": "inline/1.md", "path": "<file>", "line": <line-in-new-file>, "side": "RIGHT" },
                       { "body_file": "inline/2.md", "path": "<file>", "start_line": <first-line>, "line": <last-line>, "side": "RIGHT" }
                     ]
                   }

               - `path` is the file path as it appears in the diff (new side).
               - `line` is a line number in the NEW file (use `side: "RIGHT"`). For a
                 multi-line finding add `start_line` (the first line); omit it otherwise.
               - `hard_findings` is true if and ONLY if you recorded one or more IN-SCOPE
                 HARD findings — a real defect that needs a fix before merge (a clear
                 Standards violation, or a missing / incorrect / over-reached acceptance
                 criterion), as opposed to a soft suggestion, judgment call, or anything
                 classified FOLLOW-UP above. A finding about adjacent or pre-existing
                 code, or about new capabilities beyond the acceptance criteria, is NEVER
                 hard. Set it false if every finding is soft or there are none.
               - If there are no inline findings, write `"inline": []`.

            Write `.review/summary.md` and `.review/manifest.json` even when you found
            nothing (an empty `inline`, a summary that says so, `hard_findings: false`).
            That is your only deliverable — the posting step takes it from here.
          # Hermetic producer: Read/Grep/Glob to read the precomputed .review-context/
          # files and the repo's standards docs, Task so the skill can spawn its two
          # parallel sub-agents, and Write to author the .review/ files. NO Bash, NO git,
          # NO gh — every input is precomputed and the deterministic `post` step below
          # owns all GitHub writes. No Edit and no commit/push.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,Write,TodoWrite,Task"

      # Deterministic poster: read the producer's .review/ files and post ONE COMMENT
      # review bundling the summary (as the review body) and every inline finding. jq does
      # all JSON encoding from raw body files, so bodies can't be corrupted by shell
      # quoting. Inline anchors are validated against the diff first: the reviews API is
      # atomic (one off-diff anchor 422s the whole review), so any finding whose anchor
      # isn't on a RIGHT-side diff line is DEMOTED into the summary body instead of
      # dropped. Finally applies address-feedback when the producer flagged hard findings.
      - name: Post the review
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          test -f .review/manifest.json || { echo "::error::producer wrote no .review/manifest.json"; exit 1; }
          jq empty .review/manifest.json || { echo "::error::.review/manifest.json is not valid JSON"; exit 1; }
          summary_file=$(jq -r '.summary_file // "summary.md"' .review/manifest.json)
          test -f ".review/$summary_file" || { echo "::error::summary file .review/$summary_file missing"; exit 1; }

          # Valid RIGHT-side anchor set: every NEW-file line present in the PR diff
          # (added "+" lines and context " " lines advance the new-file counter; "-"
          # deletions do not). Emitted as "<path>\t<line>" lines for exact lookup. Reuse
          # the diff the producer saw (.review-context/diff.patch) so anchors match.
          awk '
            /^\+\+\+ /        { f=$2; sub(/^b\//,"",f); next }
            /^@@ /            { match($0, /\+[0-9]+/); n=substr($0, RSTART+1, RLENGTH-1)+0; next }
            /^-/              { next }
            /^\\/             { next }
            f != ""           { print f "\t" n; n++ }
          ' .review-context/diff.patch > valid-lines.txt

          comments=comments.ndjson
          : > "$comments"
          demoted=demoted.md
          : > "$demoted"

          # Build one JSON object per inline finding. jq -n with --arg/--argjson does all
          # escaping; the body is read verbatim from its file. Anchors not in valid-lines
          # are demoted into the summary so they survive the atomic post.
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            bf=$(printf '%s' "$entry" | jq -r '.body_file')
            path=$(printf '%s' "$entry" | jq -r '.path')
            line=$(printf '%s' "$entry" | jq -r '.line')
            side=$(printf '%s' "$entry" | jq -r '.side // "RIGHT"')
            start_line=$(printf '%s' "$entry" | jq -r '.start_line // empty')
            if [ ! -f ".review/$bf" ]; then
              echo "::warning::manifest references missing body file $bf — skipping"
              continue
            fi
            body=$(cat ".review/$bf")
            if grep -qxF "$path	$line" valid-lines.txt; then
              if [ -n "$start_line" ]; then
                jq -n --arg path "$path" --argjson line "$line" --argjson start_line "$start_line" \
                      --arg side "$side" --arg body "$body" \
                      '{path:$path, line:$line, start_line:$start_line, side:$side, body:$body}' >> "$comments"
              else
                jq -n --arg path "$path" --argjson line "$line" --arg side "$side" --arg body "$body" \
                      '{path:$path, line:$line, side:$side, body:$body}' >> "$comments"
              fi
            else
              echo "::warning::anchor $path:$line is not on the diff — demoting finding into the summary"
              { printf '\n\n---\n\n*(could not anchor to `%s:%s`)*\n\n' "$path" "$line"; printf '%s\n' "$body"; } >> "$demoted"
            fi
          done < <(jq -c '.inline[]?' .review/manifest.json)

          comments_json=$(jq -s '.' "$comments")
          summary_body=$(cat ".review/$summary_file"; [ -s "$demoted" ] && cat "$demoted"; true)

          jq -n --arg commit "$HEAD_SHA" --arg body "$summary_body" --argjson comments "$comments_json" \
            '{commit_id:$commit, event:"COMMENT", body:$body, comments:$comments}' \
            | gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" --input - > /dev/null
          echo "Posted a COMMENT review for $HEAD_SHA with $(echo "$comments_json" | jq 'length') inline comment(s)."

          # Hand off to the fix loop only when the producer flagged in-scope hard findings.
          if [ "$(jq -r '.hard_findings // false' .review/manifest.json)" = "true" ]; then
            gh pr edit "$PR_NUMBER" --add-label address-feedback
            echo "Applied address-feedback (hard findings present)."
          else
            echo "No hard findings — leaving the PR for a human."
          fi

      # Catch the "hollow success" case: the post step can be reached without a review
      # landing. Require a bot review carrying THIS commit's marker, and guard against
      # corrupted bodies — a body that still contains literal escape sequences (\n, \<,
      # \[) means a body was shell-quoted somewhere instead of written verbatim.
      - name: Verify the review was posted
        if: steps.scope.outputs.review == 'true' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          marker="<!-- code-review:${HEAD_SHA} -->"
          # Collect every body for this commit's marker: the review summary bodies
          # (pulls/reviews) plus inline review comments (pulls/comments). Each call emits
          # a JSON array; `jq -s add` concatenates them keeping each body discrete.
          select="[.[] | select(.user.login == \"smonn[bot]\" and (.body | contains(\"$marker\"))) | .body]"
          bodies=$(
            { gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews"  --paginate --jq "$select"
              gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate --jq "$select"
            } | jq -s 'add'
          )
          found=$(echo "$bodies" | jq 'length')
          if [ "${found:-0}" -le 0 ]; then
            echo "::error::No review tagged $HEAD_SHA on PR #$PR_NUMBER — the review did not post (check the run log)."
            exit 1
          fi
          # A well-formed body has real newlines and unescaped markdown; a literal
          # backslash-escape (\n, \<, \[) means a body was shell-quoted — corruption.
          corrupt=$(echo "$bodies" | jq '[.[] | select(test("\\\\n|\\\\<|\\\\\\["))] | length')
          if [ "${corrupt:-0}" -gt 0 ]; then
            echo "::error::A review body for $HEAD_SHA contains literal escape sequences (\\n, \\<, \\[) instead of rendered markdown — a body was shell-quoted. Fix body authoring and re-review."
            exit 1
          fi
          echo "✓ $found review body/bodies for $HEAD_SHA posted on PR #$PR_NUMBER, all well-formed."
