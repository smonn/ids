name: Sync labels

# Single source of truth for the repository's pipeline labels. The triage,
# implement, review, rebase, address-review, autofix, and unblock workflows assume
# these labels already exist rather than each re-creating them. This runs on demand, whenever
# this file changes (so edits here are applied on merge), and weekly to self-heal
# if a label is deleted or hand-edited.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/labels.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: sync-labels
  cancel-in-progress: false

# All mutations go through the App token below, so the default GITHUB_TOKEN needs no
# permissions at all.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: automation
    steps:
      # This job otherwise needs no checkout, but the app-token step below uses the
      # LOCAL composite action under .github/actions/app-token, which must be on disk
      # first. This checkout needs no token and persists none.
      - name: Checkout (provision local actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: managing repository labels needs only issues:write.
          permission-issues: write

      - name: Ensure all pipeline labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --force creates the label or updates its color/description in place.
          ensure() { gh label create "$1" --color "$2" --description "$3" --force >/dev/null 2>&1 || true; }

          # Issue state (triage → implementation)
          ensure needs-triage    FBCA04 "Maintainer needs to evaluate this issue"
          ensure needs-info      D93F0B "Waiting on reporter for more information"
          ensure ready-for-agent 0E8A16 "Fully specified, ready for an AFK agent"
          ensure ready-for-human 1D76DB "Requires human implementation"
          ensure in-progress     5319E7 "An agent is implementing this issue"
          ensure blocked         B60205 "Waiting on another issue to close first"
          ensure wontfix         FFFFFF "Will not be actioned"

          # Maintainer-applied PR action labels
          ensure needs-review     006B75 "Re-run the agent code review on this PR"
          ensure needs-rebase     FBCA04 "Merge latest main into this agent PR and resolve conflicts"
          ensure address-feedback 5319E7 "Have the agent address the review feedback on this PR"

          # Automation marker (applied by conflicts.yml, removed by rebase.yml / self-heal):
          # a PR that conflicts with main has an automatic rebase dispatched, and while the
          # marker is present every PR-triggered run of our workflows pauses (ci/bench
          # self-cancel; review/address-review/autofix no-op) so nothing works on the
          # soon-to-be-superseded commit. It is an automation-in-progress flag, not a
          # standing "this PR conflicts" status — see conflicts.yml.
          ensure conflicting      D93F0B "PR conflicts with main; runs paused while an automatic rebase is dispatched"

          # Escalation
          ensure needs-human     B60205 "Automated handling gave up; needs a human"

          # Auto-address loop counter (set by address-review.yml; remove a label to reset).
          # One auto-round-N is present at a time; keep this range in step with that
          # workflow's MAX_AUTO_ROUNDS.
          ensure auto-round-1    C5DEF5 "Auto-address loop: 1 consecutive bot-driven round"
          ensure auto-round-2    C5DEF5 "Auto-address loop: 2 consecutive bot-driven rounds"
          ensure auto-round-3    C5DEF5 "Auto-address loop: 3 consecutive bot-driven rounds"
