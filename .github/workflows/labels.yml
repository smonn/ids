name: Sync labels

# Single source of truth for the repository's pipeline labels. The triage,
# implement, review, rebase, address-review, autofix, and unblock workflows assume
# these labels already exist rather than each re-creating them. This runs on demand, whenever
# this file changes (so edits here are applied on merge), and weekly to self-heal
# if a label is deleted or hand-edited.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/labels.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: sync-labels
  cancel-in-progress: false

# All mutations go through the App token below, so the default GITHUB_TOKEN needs no
# permissions at all.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: automation
    steps:
      # This job otherwise needs no checkout, but the app-token step below uses the
      # LOCAL composite action under .github/actions/app-token, which must be on disk
      # first. This checkout needs no token and persists none.
      - name: Checkout (provision local actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: managing repository labels needs only issues:write.
          permission-issues: write

      - name: Ensure all pipeline labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --force creates the label or updates its color/description in place.
          ensure() { gh label create "$1" --color "$2" --description "$3" --force >/dev/null 2>&1 || true; }

          # Escalation. The lone surviving flat label: `needs-human` is a
          # cross-cutting "all automation gave up" signal fired from five
          # workflows on both issues and PRs, so it stays un-namespaced
          # (ADR-0029). Every other former flat label has been retired in favour
          # of its namespaced successor below and is deleted in the step after this.
          ensure needs-human     B60205 "Automated handling gave up; needs a human"

          # ---------------------------------------------------------------------
          # Namespaced taxonomy (ADR-0029). Phase 4 of the migration has retired
          # the flat lifecycle/trigger labels: the namespaced set below is now the
          # authoritative vocabulary the workflows read and write.
          #
          # Colour scheme (ADR-0029 §Colours): saturated hues carry URGENCY on the
          # state labels — red = needs attention, green = good/go, yellow = waiting,
          # purple/blue = active. The descriptive auto-derived namespaces below get a
          # QUIET per-namespace tint instead of flat grey: one low-saturation hue per
          # namespace, drawn from hues the urgency set does not use, so a soft
          # descriptive label is namespace-distinguishable at a list-scan glance yet
          # never reads as an actionable state label. `size:` additionally ramps
          # light→dark to encode magnitude. `auto-round:` stays grey (ephemeral,
          # no triage value).

          # type: (single, issue + PR) — rides the Conventional-Commit vocabulary
          # enforced by pr-title.yml. Quiet slate-blue tint.
          ensure type:feat       D0DAEA "New feature (Conventional Commit: feat)"
          ensure type:fix        D0DAEA "Bug fix (Conventional Commit: fix)"
          ensure type:docs       D0DAEA "Documentation only (Conventional Commit: docs)"
          ensure type:refactor   D0DAEA "Neither fixes a bug nor adds a feature (Conventional Commit: refactor)"
          ensure type:perf       D0DAEA "Performance improvement (Conventional Commit: perf)"
          ensure type:test       D0DAEA "Adds or corrects tests (Conventional Commit: test)"
          ensure type:build      D0DAEA "Build system or dependency change (Conventional Commit: build)"
          ensure type:ci         D0DAEA "CI configuration change (Conventional Commit: ci)"
          ensure type:chore      D0DAEA "Maintenance task (Conventional Commit: chore)"
          ensure type:revert     D0DAEA "Reverts a previous commit (Conventional Commit: revert)"

          # issue: (single, issue) — object lifecycle. Mirrors the flat issue states.
          ensure issue:triage      FBCA04 "Maintainer needs to evaluate this issue"
          ensure issue:ready-agent  0E8A16 "Fully specified, ready for an AFK agent"
          ensure issue:ready-human  1D76DB "Requires human implementation"
          ensure issue:in-progress  5319E7 "An agent is implementing this issue"
          ensure issue:blocked      B60205 "Waiting on another issue to close first"
          ensure issue:needs-info   FBCA04 "Waiting on reporter for more information"
          ensure issue:wontfix      FFFFFF "Will not be actioned"

          # pr: (single, PR) — object lifecycle, absorbs the review↔address cycle.
          ensure pr:reviewing           5319E7 "Agent code review in progress"
          ensure pr:changes-requested   B60205 "Review left change requests to address"
          ensure pr:addressing-feedback 5319E7 "Agent is addressing review feedback"
          ensure pr:ready               0E8A16 "Reviewed and ready to merge"
          ensure pr:outdated            FBCA04 "A push post-dates the last review"

          # automation: (single mutex, PR) — orthogonal pause-mutex. Other
          # workflows pause while any automation:* is present (generalises the
          # flat `conflicting` marker).
          ensure automation:rebasing D93F0B "Automatic rebase in progress; other workflows pause while present"

          # size: (single, PR) — calibrated absolute diff churn, excluding
          # generated/vendored files. Light→dark warm-grey ramp encodes magnitude.
          ensure size:xs EDEDED "Diff churn ≤10 lines"
          ensure size:s  E1D8CE "Diff churn ≤50 lines"
          ensure size:m  D8C7B3 "Diff churn ≤150 lines"
          ensure size:l  CDB295 "Diff churn ≤400 lines"
          ensure size:xl C19D78 "Diff churn >400 lines"

          # changeset: (single, PR) — sourced from .changeset/*.md frontmatter.
          # Quiet lavender tint. (Not an amber ramp: amber collides with yellow=waiting.)
          ensure changeset:patch E6DBF2 "Changeset declares a patch release"
          ensure changeset:minor E6DBF2 "Changeset declares a minor release"
          ensure changeset:major E6DBF2 "Changeset declares a major release"
          ensure changeset:none  E6DBF2 "No changeset / no release"

          # codec: (multi, issue + PR) — which codec slice (ADR-0018) is touched.
          # Quiet teal tint.
          ensure codec:timestamp C6E8E1 "Touches the timestamp codec"
          ensure codec:opaque    C6E8E1 "Touches the opaque codec"
          ensure codec:reverse   C6E8E1 "Touches the reverse codec"
          ensure codec:signed    C6E8E1 "Touches the signed codec"
          ensure codec:wrapped   C6E8E1 "Touches the wrapped codec"
          ensure codec:digest    C6E8E1 "Touches the digest codec"

          # area: (multi, issue + PR) — which part of the system is touched.
          # Quiet clay/rose tint.
          ensure area:wire     F3D3CB "Touches the wire format / encoding surface"
          ensure area:cli      F3D3CB "Touches the CLI"
          ensure area:adapters F3D3CB "Touches adapter integrations"
          ensure area:docs     F3D3CB "Touches documentation"
          ensure area:core     F3D3CB "Touches core library code"
          ensure area:build    F3D3CB "Touches build / tooling"

          # released: (multi, issue + PR) — keyed on the major version LINE, not
          # the semver version. Stamped by release.yml when v1 cuts. Good/go → green.
          ensure released:v1 0E8A16 "Shipped in a published v1 release"

          # auto-round: (single, PR) — auto-address loop counter. Keep this range
          # in step with address-review.yml's MAX_AUTO_ROUNDS.
          ensure auto-round:1 EDEDED "Auto-address loop: 1 consecutive bot-driven round"
          ensure auto-round:2 EDEDED "Auto-address loop: 2 consecutive bot-driven rounds"
          ensure auto-round:3 EDEDED "Auto-address loop: 3 consecutive bot-driven rounds"

          # do: (trigger, issue + PR) — imperative; removed by the workflow it
          # starts (ADR-0030). The only labels that start a workflow. Active → purple.
          ensure do:implement 5319E7 "Trigger: implement this issue"
          ensure do:review    5319E7 "Trigger: run the agent code review on this PR"
          ensure do:rebase    5319E7 "Trigger: rebase this PR onto main"
          ensure do:address   5319E7 "Trigger: address the review feedback on this PR"
          ensure do:triage    5319E7 "Trigger: triage this issue"

      - name: Delete retired flat labels (Phase 4)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Phase 4 of the namespaced taxonomy (ADR-0029): the flat lifecycle and
          # trigger labels are retired in favour of their namespaced successors,
          # which the workflows now read and write exclusively. The weekly
          # self-heal only ever creates/updates labels (the `ensure` step above) —
          # it never deletes — so retirement is an explicit, auditable step here.
          #
          # Each former label and the namespaced label that replaced it:
          #   needs-triage     → do:triage (trigger) / issue:triage (status)
          #   needs-info       → issue:needs-info
          #   ready-for-agent  → do:implement (trigger) / issue:ready-agent (status)
          #   ready-for-human  → issue:ready-human
          #   in-progress      → issue:in-progress
          #   blocked          → issue:blocked
          #   wontfix          → issue:wontfix
          #   needs-review     → do:review
          #   needs-rebase     → do:rebase
          #   address-feedback → do:address
          #   conflicting      → automation:rebasing
          #   auto-round-{1,2,3} → auto-round:{1,2,3}
          # `needs-human` is intentionally NOT deleted — it stays flat (ADR-0029).
          #
          # Deleting a label strips it from every issue/PR that still carries it;
          # the Phase 5 backfill stamps the namespaced equivalents. `|| true` keeps
          # the step idempotent: a second run finds the labels already gone.
          retired=(
            needs-triage needs-info ready-for-agent ready-for-human in-progress
            blocked wontfix needs-review needs-rebase address-feedback conflicting
            auto-round-1 auto-round-2 auto-round-3
          )
          for label in "${retired[@]}"; do
            gh label delete "$label" --yes >/dev/null 2>&1 || true
          done
          echo "Retired flat labels deleted (or already absent)."
