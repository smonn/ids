name: Sync labels

# Single source of truth for the repository's pipeline labels. The triage,
# implement, review, rebase, address-review, autofix, and unblock workflows assume
# these labels already exist rather than each re-creating them. This runs on demand, whenever
# this file changes (so edits here are applied on merge), and weekly to self-heal
# if a label is deleted or hand-edited.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/labels.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: sync-labels
  cancel-in-progress: false

# All mutations go through the App token below, so the default GITHUB_TOKEN needs no
# permissions at all.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: automation
    steps:
      # This job otherwise needs no checkout, but the app-token step below uses the
      # LOCAL composite action under .github/actions/app-token, which must be on disk
      # first. This checkout needs no token and persists none.
      - name: Checkout (provision local actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: managing repository labels needs only issues:write.
          permission-issues: write

      - name: Ensure all pipeline labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --force creates the label or updates its color/description in place.
          ensure() { gh label create "$1" --color "$2" --description "$3" --force >/dev/null 2>&1 || true; }

          # Issue state (triage → implementation)
          ensure needs-triage    FBCA04 "Maintainer needs to evaluate this issue"
          ensure needs-info      D93F0B "Waiting on reporter for more information"
          ensure ready-for-agent 0E8A16 "Fully specified, ready for an AFK agent"
          ensure ready-for-human 1D76DB "Requires human implementation"
          ensure in-progress     5319E7 "An agent is implementing this issue"
          ensure blocked         B60205 "Waiting on another issue to close first"
          ensure wontfix         FFFFFF "Will not be actioned"

          # Maintainer-applied PR action labels
          ensure needs-review     006B75 "Re-run the agent code review on this PR"
          ensure needs-rebase     FBCA04 "Merge latest main into this agent PR and resolve conflicts"
          ensure address-feedback 5319E7 "Have the agent address the review feedback on this PR"

          # Automation marker (applied by conflicts.yml, removed by rebase.yml / self-heal):
          # a PR that conflicts with main has an automatic rebase dispatched, and while the
          # marker is present every PR-triggered run of our workflows pauses (ci/bench
          # self-cancel; review/address-review/autofix no-op) so nothing works on the
          # soon-to-be-superseded commit. It is an automation-in-progress flag, not a
          # standing "this PR conflicts" status — see conflicts.yml.
          ensure conflicting      D93F0B "PR conflicts with main; runs paused while an automatic rebase is dispatched"

          # Escalation
          ensure needs-human     B60205 "Automated handling gave up; needs a human"

          # Auto-address loop counter (set by address-review.yml; remove a label to reset).
          # One auto-round-N is present at a time; keep this range in step with that
          # workflow's MAX_AUTO_ROUNDS.
          ensure auto-round-1    C5DEF5 "Auto-address loop: 1 consecutive bot-driven round"
          ensure auto-round-2    C5DEF5 "Auto-address loop: 2 consecutive bot-driven rounds"
          ensure auto-round-3    C5DEF5 "Auto-address loop: 3 consecutive bot-driven rounds"

          # ---------------------------------------------------------------------
          # Namespaced taxonomy (ADR-0029). Phase 0 of the migration adds these
          # ALONGSIDE the flat labels above; nothing reads them yet. The flat set
          # is retired in Phase 4.
          #
          # Colour scheme (ADR-0029 §Colours): saturated hues carry URGENCY on the
          # state labels — red = needs attention, green = good/go, yellow = waiting,
          # purple/blue = active. The descriptive auto-derived namespaces below get a
          # QUIET per-namespace tint instead of flat grey: one low-saturation hue per
          # namespace, drawn from hues the urgency set does not use, so a soft
          # descriptive label is namespace-distinguishable at a list-scan glance yet
          # never reads as an actionable state label. `size:` additionally ramps
          # light→dark to encode magnitude. `auto-round:` stays grey (ephemeral,
          # no triage value).

          # type: (single, issue + PR) — rides the Conventional-Commit vocabulary
          # enforced by pr-title.yml. Quiet slate-blue tint.
          ensure type:feat       D2DAE8 "New feature (Conventional Commit: feat)"
          ensure type:fix        D2DAE8 "Bug fix (Conventional Commit: fix)"
          ensure type:docs       D2DAE8 "Documentation only (Conventional Commit: docs)"
          ensure type:refactor   D2DAE8 "Neither fixes a bug nor adds a feature (Conventional Commit: refactor)"
          ensure type:perf       D2DAE8 "Performance improvement (Conventional Commit: perf)"
          ensure type:test       D2DAE8 "Adds or corrects tests (Conventional Commit: test)"
          ensure type:build      D2DAE8 "Build system or dependency change (Conventional Commit: build)"
          ensure type:ci         D2DAE8 "CI configuration change (Conventional Commit: ci)"
          ensure type:chore      D2DAE8 "Maintenance task (Conventional Commit: chore)"
          ensure type:revert     D2DAE8 "Reverts a previous commit (Conventional Commit: revert)"

          # issue: (single, issue) — object lifecycle. Mirrors the flat issue states.
          ensure issue:triage      FBCA04 "Maintainer needs to evaluate this issue"
          ensure issue:ready-agent  0E8A16 "Fully specified, ready for an AFK agent"
          ensure issue:ready-human  1D76DB "Requires human implementation"
          ensure issue:in-progress  5319E7 "An agent is implementing this issue"
          ensure issue:blocked      B60205 "Waiting on another issue to close first"
          ensure issue:needs-info   FBCA04 "Waiting on reporter for more information"
          ensure issue:wontfix      FFFFFF "Will not be actioned"

          # pr: (single, PR) — object lifecycle, absorbs the review↔address cycle.
          ensure pr:reviewing           5319E7 "Agent code review in progress"
          ensure pr:changes-requested   B60205 "Review left change requests to address"
          ensure pr:addressing-feedback 5319E7 "Agent is addressing review feedback"
          ensure pr:ready               0E8A16 "Reviewed and ready to merge"
          ensure pr:outdated            FBCA04 "A push post-dates the last review"

          # automation: (single mutex, PR) — orthogonal pause-mutex. Other
          # workflows pause while any automation:* is present (generalises the
          # flat `conflicting` marker).
          ensure automation:rebasing D93F0B "Automatic rebase in progress; other workflows pause while present"

          # size: (single, PR) — calibrated absolute diff churn, excluding
          # generated/vendored files. Light→dark warm-grey ramp encodes magnitude.
          ensure size:xs EDEDED "Diff churn ≤10 lines"
          ensure size:s  E0D8CF "Diff churn ≤50 lines"
          ensure size:m  D6C7B5 "Diff churn ≤150 lines"
          ensure size:l  C9B299 "Diff churn ≤400 lines"
          ensure size:xl BC9D7D "Diff churn >400 lines"

          # changeset: (single, PR) — sourced from .changeset/*.md frontmatter.
          # Quiet lavender tint. (Not an amber ramp: amber collides with yellow=waiting.)
          ensure changeset:patch E6DCF0 "Changeset declares a patch release"
          ensure changeset:minor E6DCF0 "Changeset declares a minor release"
          ensure changeset:major E6DCF0 "Changeset declares a major release"
          ensure changeset:none  E6DCF0 "No changeset / no release"

          # codec: (multi, issue + PR) — which codec slice (ADR-0018) is touched.
          # Quiet teal tint.
          ensure codec:timestamp C8E6E0 "Touches the timestamp codec"
          ensure codec:opaque    C8E6E0 "Touches the opaque codec"
          ensure codec:reverse   C8E6E0 "Touches the reverse codec"
          ensure codec:signed    C8E6E0 "Touches the signed codec"
          ensure codec:wrapped   C8E6E0 "Touches the wrapped codec"
          ensure codec:digest    C8E6E0 "Touches the digest codec"

          # area: (multi, issue + PR) — which part of the system is touched.
          # Quiet clay/rose tint.
          ensure area:wire     F0D5CE "Touches the wire format / encoding surface"
          ensure area:cli      F0D5CE "Touches the CLI"
          ensure area:adapters F0D5CE "Touches adapter integrations"
          ensure area:docs     F0D5CE "Touches documentation"
          ensure area:core     F0D5CE "Touches core library code"
          ensure area:build    F0D5CE "Touches build / tooling"

          # released: (multi, issue + PR) — keyed on the major version LINE, not
          # the semver version. Stamped by release.yml when v1 cuts. Good/go → green.
          ensure released:v1 0E8A16 "Shipped in a published v1 release"

          # auto-round: (single, PR) — namespaced successor to auto-round-N.
          # Keep this range in step with address-review.yml's MAX_AUTO_ROUNDS.
          ensure auto-round:1 EDEDED "Auto-address loop: 1 consecutive bot-driven round"
          ensure auto-round:2 EDEDED "Auto-address loop: 2 consecutive bot-driven rounds"
          ensure auto-round:3 EDEDED "Auto-address loop: 3 consecutive bot-driven rounds"

          # do: (trigger, issue + PR) — imperative; removed by the workflow it
          # starts (ADR-0030). The only labels that start a workflow. Active → purple.
          ensure do:implement 5319E7 "Trigger: implement this issue"
          ensure do:review    5319E7 "Trigger: run the agent code review on this PR"
          ensure do:rebase    5319E7 "Trigger: rebase this PR onto main"
          ensure do:address   5319E7 "Trigger: address the review feedback on this PR"
          ensure do:triage    5319E7 "Trigger: triage this issue"
