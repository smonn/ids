name: Autofix agent PR CI

# When CI fails on an agent PR, have Claude diagnose and fix it. Triggered only by
# the `CI` workflow (so the noisy `bench` workflow never triggers an autofix), and
# only for `agent/issue-*` branches. A per-branch attempt cap prevents an autofix →
# CI → autofix loop: after MAX_ATTEMPTS the PR is escalated to `needs-human`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Agent branch to autofix (e.g. agent/issue-42)
        required: true
        type: string

concurrency:
  group: autofix-${{ github.event.workflow_run.head_branch || github.event.inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'agent/issue-'))
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.event.inputs.branch }}
      MAX_ATTEMPTS: 2
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: scope the token to what this job does — read the failed CI
          # run's logs (actions:read), push the fix (contents), and comment/label the PR
          # (issues + pulls) — instead of the App's full installation grant.
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout the agent branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve PR and guard against autofix loops
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH; nothing to fix."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          git fetch -q origin main
          attempts=$(git log origin/main..HEAD --grep='ci-autofix' --oneline | wc -l | tr -d ' ')
          echo "PR #$pr — prior autofix attempts on this branch: $attempts (cap $MAX_ATTEMPTS)."
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            echo "Attempt cap reached — escalating instead of looping."
            gh pr comment "$pr" --body "CI is still failing after $attempts automated fix attempt(s). Escalating for human review."
            gh pr edit "$pr" --add-label needs-human
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "smonn[bot]"
          git config user.email "110314539+smonn[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.proceed == 'true'

      - name: Fix CI with Claude
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # CI runs that failed on an agent branch were pushed by the App, so the
          # workflow_run actor is a bot. Allow only our own App (never '*').
          allowed_bots: "smonn[bot]"
          claude_args: |
            --max-turns 60
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite"
          prompt: |
            You are fixing failing CI on pull request #${{ steps.gate.outputs.pr }}
            (branch `${{ env.BRANCH }}`) of ${{ github.repository }}. The branch is
            checked out, `gh` is authenticated, and git can push.

            1. Diagnose the failure. Inspect the most recent failed CI run for this
               branch:
               `gh run list --branch "${{ env.BRANCH }}" --workflow CI --limit 1 --json databaseId --jq '.[0].databaseId'`,
               then `gh run view <id> --log-failed`. Reproduce locally by running the
               same gate ci.yml uses: `pnpm lint`, `pnpm depcruise`, `pnpm fmt:check`,
               `pnpm typecheck`, `pnpm test:coverage`, `pnpm build`.
            2. Fix the ROOT CAUSE. Use `pnpm lint:fix` / `pnpm fmt` for formatting and
               lint. For failing tests, fix the implementation or the test faithfully.
               NEVER weaken, skip, or delete tests just to go green, and NEVER touch a
               CLOSED design decision (see CONTEXT.md and docs/adr/).
            3. Re-run the full gate; everything must pass.
            4. Commit with a message that starts `fix(ci): ` and contains the marker
               `[ci-autofix]`, then push to `${{ env.BRANCH }}`.
            5. If you cannot fix it safely — flaky infrastructure, it needs human
               judgment, or the only fix would reopen a CLOSED decision — do NOT push:
               comment on the PR explaining why, then run
               `gh pr edit ${{ steps.gate.outputs.pr }} --add-label needs-human`.

            Do not modify other branches and do not push to main.
