name: Autofix agent PR CI

# When CI fails on an agent PR, have Claude diagnose and fix it. Triggered only by
# the `CI` workflow (so the noisy `bench` workflow never triggers an autofix), and
# only for `agent/issue-*` branches. A per-branch attempt cap prevents an autofix →
# CI → autofix loop: after MAX_ATTEMPTS the PR is escalated to `needs-human`.
#
# PRECOMPUTE / PRODUCE / POST split (see .github/workflows/README.md "Producer / poster
# split" and "App token & the read/write security split"). The failing CI logs are
# PRECOMPUTED into `.autofix-context/ci-failed.log` so the agent diagnoses by reading a
# file. The producer gets a READ-ONLY token and a `persist-credentials: false` checkout, so
# it can commit LOCALLY (keeping the `[ci-autofix]` marker the cap gate counts) but cannot
# push or mutate GitHub; it records its outcome in `.autofix/manifest.json` and, when
# escalating, writes the comment body to `.autofix/escalation.md`. The deterministic POSTER
# is the ONLY place with push credentials: it pushes the local fix commits (plain, never
# force), or posts the escalation comment + `needs-human`, or no-ops — one outcome each.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Agent branch to autofix (e.g. agent/issue-42)
        required: true
        type: string

concurrency:
  group: autofix-${{ github.event.workflow_run.head_branch || github.event.inputs.branch }}
  cancel-in-progress: false

# The built-in GITHUB_TOKEN is only used implicitly by actions/checkout to
# fetch the repo (both checkouts set persist-credentials: false, so it never
# lands in the workspace). Every GitHub mutation — comments, labels, pushes —
# goes through the least-privilege App tokens minted in-job, so the workflow
# token needs nothing beyond read.
permissions:
  contents: read

jobs:
  autofix:
    # Same-repo guard (mirrors rebase.yml / address-review.yml): a `workflow_run` event
    # fires in the BASE repo even when the triggering CI ran on a FORK PR, with
    # `head_repository` set to the fork. Without this check a third party could open a
    # fork PR on a branch named `agent/issue-*`, let its CI fail, and trip this `if` —
    # triggering autofix runs (burning compute and the per-branch attempt cap). The
    # producer's read-only token and `persist-credentials: false` already prevent a
    # fork-push, but gating on `head_repository.full_name == github.repository` stops the
    # trigger itself, keeping autofix scoped to our own agent branches like its siblings.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'agent/issue-'))
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.event.inputs.branch }}
      MAX_ATTEMPTS: 2
    steps:
      # First step: monitor egress from this privileged job. It mints an App
      # token with `contents: write` / `pull-requests: write` and runs the full
      # CI gate (untrusted postinstall scripts), so logging unexpected outbound
      # connections is worth it. Audit mode logs only — it never blocks.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Provision the LOCAL composite action (.github/actions/app-token) from the
      # DEFAULT branch before the mints use it — the working checkout below pulls the
      # agent branch (which may predate this action), so provision from main here. This
      # checkout needs no token, and MUST NOT persist one: the job's built-in token
      # carries write scopes, and a persisted credential here would survive into the
      # producer's workspace and defeat the working checkout's persist-credentials:
      # false (the no-push boundary). The agent-branch checkout overwrites the tree after.
      - name: Checkout (provision local actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: scope the token to what this job does — read the failed CI
          # run's logs (actions:read), push the fix (contents), and comment/label the PR
          # (issues + pulls) — instead of the App's full installation grant.
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Kept as a SEPARATE mint from the write token above — the write/read-only
      # split is the security boundary, never merged into one token.
      - name: Generate a READ-ONLY GitHub App token for the producer
        id: app-token-ro
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # The producer (claude-code-action) wires whatever token it has into the agent's
          # git/gh auth, and `github_token` falls back to the write-capable built-in
          # `github.token` when omitted — so persist-credentials: false alone does NOT
          # guarantee no-push. Hand the producer a strictly READ-ONLY token instead: even
          # if the action sets up the agent's git/gh, it cannot push, comment, or label.
          # actions:read lets it read run logs; everything else is read-only.
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Checkout the agent branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # The agent commits LOCALLY but must not push: keep the checkout's git
          # credentials OUT of the local config so a stray `git push` from the producer
          # has no auth. The deterministic poster sets up push creds explicitly.
          persist-credentials: false

      - name: Resolve PR and guard against autofix loops
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH; nothing to fix."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # Defer while the PR is mid-conflict-rebase (an `automation:*` mutex is present —
          # see .github/workflows/README.md "The automation:* rebase pause-mutex"). The CI
          # failure that triggered us is likely the doomed pre-rebase commit; fixing it now
          # would waste compute AND burn an attempt from the cap below. Check before the cap.
          if gh pr view "$pr" --json labels --jq '.labels[].name' 2>/dev/null | grep -qE '^automation:'; then
            echo "PR #$pr has an automation:* mutex — deferring autofix until the rebase lands."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin main
          attempts=$(git log origin/main..HEAD --grep='ci-autofix' --oneline | wc -l | tr -d ' ')
          echo "PR #$pr — prior autofix attempts on this branch: $attempts (cap $MAX_ATTEMPTS)."
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            echo "Attempt cap reached — escalating instead of looping."
            gh pr comment "$pr" --body "CI is still failing after $attempts automated fix attempt(s). Escalating for human review."
            gh pr edit "$pr" --add-label needs-human
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Precompute the failed CI logs so the producer diagnoses from a file and runs no
      # `gh` at all. The failing run id comes straight from the event (workflow_run.id);
      # a manual dispatch has no triggering run, so resolve the branch's most recent
      # failed CI run instead. Never fail the job if logs can't be fetched — the agent
      # can still reproduce locally with the gate commands.
      - name: Precompute failed CI logs
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p .autofix-context
          run_id="$RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --branch "$BRANCH" --workflow CI --status failure \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "No failed CI run id resolved for $BRANCH." | tee .autofix-context/ci-failed.log
          else
            echo "Fetching failed-step logs for CI run $run_id."
            gh run view "$run_id" --log-failed > .autofix-context/ci-failed.log 2>&1 \
              || echo "(could not fetch logs for run $run_id)" > .autofix-context/ci-failed.log
          fi
          echo "Failed-CI log size:"; wc -l .autofix-context/ci-failed.log || true

      - name: Provision workflow helpers from main if absent
        if: steps.gate.outputs.proceed == 'true'
        # Provision local actions/scripts from main when this branch predates them (kept
        # UNTRACKED, so they never enter the agent's commits) — see
        # .github/workflows/README.md "Provisioning workflow helpers from main".
        env:
          GH_TOKEN: ${{ steps.app-token-ro.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f .github/actions/setup-node-pnpm/action.yml ] \
             || [ ! -f .github/scripts/poster-lib.sh ] \
             || [ ! -f .github/scripts/git-identity.sh ] \
             || [ ! -f .github/scripts/fetch-closing-issues.sh ]; then
            echo "Provisioning workflow helpers from main (this branch predates them)."
            git fetch --no-tags --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main >/dev/null 2>&1
            git archive FETCH_HEAD .github/actions .github/scripts | tar -x
            printf '.github/actions/\n.github/scripts/\n' >> .git/info/exclude
          fi

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        run: bash .github/scripts/git-identity.sh

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.gate.outputs.proceed == 'true'

      # Hermetic PRODUCER. It gets the READ-ONLY token (app-token-ro) and there is NO
      # GH_TOKEN in this step's env; the checkout used persist-credentials: false. Even
      # though the action wires its token into the agent's git/gh, that token can only
      # READ — the agent physically cannot push or mutate GitHub. It diagnoses from the
      # precomputed log + the code, fixes, runs the gate, and commits LOCALLY with the
      # `[ci-autofix]` marker (a local commit needs no token); the deterministic poster
      # below holds the WRITE token and does all GitHub I/O.
      - name: Fix CI with Claude
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token-ro.outputs.token }}
          # CI runs that failed on an agent branch were pushed by the App, so the
          # workflow_run actor is a bot. Allow only our own App (never '*').
          allowed_bots: "smonn[bot]"
          claude_args: |
            --max-turns 60
            --model claude-sonnet-5
            --effort high
            --fallback-model claude-sonnet-4-6
            --allowedTools "Bash(pnpm:*),Bash(git:*),Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite"
            --disallowedTools "Bash(git push:*)"
          prompt: |
            You are fixing failing CI on pull request #${{ steps.gate.outputs.pr }}
            (branch `${{ env.BRANCH }}`) of ${{ github.repository }}. The branch is
            checked out and git can commit LOCALLY.

            You are a PRODUCER ONLY. You have NO GitHub access: your `gh` is
            unauthenticated and git has no push credentials. Do NOT run any `gh` command,
            do NOT push, and do NOT try to comment, label, or otherwise touch GitHub — a
            later deterministic step does all of that. Your job is to fix the code, commit
            locally, and write your outcome to files under `.autofix/`.

            1. Diagnose the failure. The failed CI logs are PRECOMPUTED for you at
               `.autofix-context/ci-failed.log` — read that file (do NOT run `gh run list`
               or `gh run view`). Reproduce locally by running the same gate ci.yml uses:
               `pnpm lint`, `pnpm depcruise`, `pnpm fmt:check`, `pnpm typecheck`,
               `pnpm test:coverage`, `pnpm build`.
            2. Fix the ROOT CAUSE. Use `pnpm lint:fix` / `pnpm fmt` for formatting and
               lint. For failing tests, fix the implementation or the test faithfully.
               NEVER weaken, skip, or delete tests just to go green, and NEVER touch a
               CLOSED design decision (see CONTEXT.md and docs/adr/). NEVER create or
               modify a GitHub Actions workflow file under `.github/workflows/`: the
               poster's token lacks the `workflows` permission, so a push that touches one
               is rejected and the fix can never land. If the only safe fix would edit a
               `.github/workflows/*` file, do NOT commit it — take the escalation path
               (step 5) so a human can make the workflow change.
               FROZEN WIRE ORACLE: `spec/vectors.json` and `SPEC.md` are the frozen wire
               oracle. A failing vector assertion means the CODE drifted from the frozen
               wire format — fix the code; NEVER edit `spec/vectors.json` or `SPEC.md` to
               match the implementation's output (that silently un-freezes the contract
               over a wire break). If the only way to clear a vector failure would be to
               change `spec/vectors.json` or `SPEC.md`, do NOT commit it — take the
               escalation path (step 5) so a human can decide.
            3. Re-run the full gate; everything must pass.
            4. If you fixed it: commit LOCALLY (do NOT push) with a message that starts
               `fix(ci): ` and contains the marker `[ci-autofix]`. Then write
               `.autofix/manifest.json` containing exactly:
                   { "fixed": true, "escalate": false }
            5. If you CANNOT fix it safely — flaky infrastructure, it needs human
               judgment, or the only fix would reopen a CLOSED decision — do NOT commit.
               Write the escalation comment body (raw markdown, real newlines, no shell
               quoting, no backslash escapes) to `.autofix/escalation.md`, then write
               `.autofix/manifest.json` containing exactly:
                   { "fixed": false, "escalate": true, "escalate_reason": "<one short line>" }
            6. If there was nothing to fix (the gate already passes), write
               `.autofix/manifest.json` containing exactly:
                   { "fixed": false, "escalate": false }

            STYLE — an escalation comment is read by a busy maintainer: state what
            failed, why you can't fix it safely, and what a human needs to decide, in
            a few short sentences. No log dumps (link or name the failing gate
            instead), no narration of what you tried, no closing recap.

            `.autofix/manifest.json` MUST contain ONLY the scalar fields above — no prose,
            nothing to escape. Author `.autofix/escalation.md` with the Write tool, which
            writes bytes verbatim: use REAL newlines (press enter), never the characters
            backslash-n, and never backslash-escape markdown. Writing the manifest is your
            only required deliverable on every path. Do not modify other branches.

      # Deterministic POSTER: the ONLY step with a GitHub token and push credentials. It
      # reads the producer's scalar manifest and takes exactly one of three actions —
      # escalate (comment + label, no push), push the local [ci-autofix] fix commits
      # (plain, never force), or no-op — and logs which one. `--body-file` keeps the
      # escalation body verbatim (no shell quoting), `jq` parses the manifest.
      - name: Post outcome (push fix, escalate, or no-op)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr }}
        run: |
          set -euo pipefail
          source .github/scripts/poster-lib.sh
          require_manifest .autofix
          fixed=$(jq -r '.fixed // false' .autofix/manifest.json)
          escalate=$(jq -r '.escalate // false' .autofix/manifest.json)
          reason=$(jq -r '.escalate_reason // ""' .autofix/manifest.json)

          if [ "$escalate" = "true" ]; then
            echo "Producer escalated${reason:+: $reason}. Posting comment + needs-human label (no push)."
            if [ -f .autofix/escalation.md ] && [ -s .autofix/escalation.md ]; then
              gh pr comment "$PR_NUMBER" --body-file .autofix/escalation.md
            else
              echo "::warning::escalate=true but no escalation body — posting a generic comment."
              gh pr comment "$PR_NUMBER" --body "Autofix could not safely fix CI${reason:+: $reason}. Escalating for human review."
            fi
            gh pr edit "$PR_NUMBER" --add-label needs-human
            echo "Escalation posted for PR #$PR_NUMBER."
            exit 0
          fi

          if [ "$fixed" = "true" ]; then
            new=$(git log origin/main..HEAD --grep='ci-autofix' --oneline | wc -l | tr -d ' ')
            if [ "$new" -eq 0 ]; then
              echo "::error::manifest says fixed=true but there are no [ci-autofix] commits to push."
              exit 1
            fi
            # WORKFLOW-FILE GUARD: the token lacks the `workflows` permission, so GitHub
            # rejects any push touching .github/workflows/. The producer is told to
            # escalate rather than edit one, but enforce it here too: if the fix commits
            # touch a workflow file, escalate to a human instead of the doomed push.
            wf_changes=$(git diff --name-only "origin/main..HEAD" -- '.github/workflows/')
            if [ -n "$wf_changes" ]; then
              {
                printf 'Autofix produced a fix that modifies GitHub Actions workflow files:\n\n'
                printf '%s\n' "$wf_changes" | sed 's/^/- `/; s/$/`/'
                printf '\nThe automation App token intentionally lacks the `workflows` '
                printf 'permission (least-privilege), so GitHub rejects any push that '
                printf 'touches `.github/workflows/`. I did not push. A maintainer needs '
                printf 'to apply the workflow fix by hand. Escalating to `needs-human`.\n'
              } > .autofix/workflow-escalation.md
              echo "Escalating PR #$PR_NUMBER: fix commits touch .github/workflows/ (token lacks workflows permission)."
              gh pr comment "$PR_NUMBER" --body-file .autofix/workflow-escalation.md
              gh pr edit "$PR_NUMBER" --add-label needs-human
              exit 0
            fi
            echo "Pushing $new local fix commit(s) to $BRANCH (plain, never force)."
            # Set up push credentials HERE (the producer's checkout had none). Never log
            # the token: the URL with the token is passed directly to git, not echoed.
            push_branch "$BRANCH"
            echo "Pushed fix to $BRANCH — this re-fires CI/review as usual."
            exit 0
          fi

          echo "No fix and no escalation — nothing to do for PR #$PR_NUMBER (gate already green or no safe change)."
