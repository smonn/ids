name: Triage issues

on:
  issues:
    # `labeled` lets the unblock workflow re-triage by re-adding `needs-triage`
    # (filtered in the job `if` below so other label changes are no-ops).
    types: [opened, reopened, labeled]
  # Manual re-triage, e.g. for testing against an existing issue.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re)triage
        required: true
        type: string

concurrency:
  group: triage-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    # Loop guard: skip bot-authored issues, and on `labeled` events only act when
    # `needs-triage` was added (so triage/implement applying their own labels are no-ops).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.type != 'Bot' &&
       (github.event.action != 'labeled' || github.event.label.name == 'needs-triage')) }}
    runs-on: ubuntu-latest
    # Agent secrets (APP_ID / APP_PRIVATE_KEY / CLAUDE_CODE_OAUTH_TOKEN) live in
    # the `automation` environment, kept separate from the `npm` publish env.
    environment: automation
    timeout-minutes: 20
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Triage the issue
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          # Fallback path for Claude's Bash; the App's built-in GitHub tools (via
          # github_token) are the primary way it comments and labels.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Triage can be re-dispatched by the App when an issue becomes unblocked,
          # making the actor a bot. Allow only our own App (never '*').
          allowed_bots: "smonn[bot]"
          # The methodology lives in the project `triage` skill (.claude/skills/triage),
          # invoked via the `/triage` slash command below; this prompt only supplies
          # repo identity, the CI (non-interactive) overrides, and the repo-specific
          # guardrails the skill doesn't carry. Sonnet keeps subscription usage modest;
          # bump to opus if triage quality needs it. allowedTools must cover the skill's
          # repro test + pnpm test + gh labeling.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob,TodoWrite"
          prompt: |
            /triage #${{ github.event.issue.number || github.event.inputs.issue_number }}

            Run the repo's `triage` skill (invoked above) to triage this issue in
            ${{ github.repository }} — `@smonn/ids`, a TypeScript library for encoding
            and decoding sortable IDs. The skill owns the methodology: classification,
            reproduction, acceptance criteria, scoping, and the label/state model (the
            label vocabulary is in docs/agents/triage-labels.md). Apply these repo and
            CI overrides on top of it:

            - NON-INTERACTIVE: you are running headless in CI — there is NO maintainer
              to converse with. Skip the skill's interactive steps (recommend-and-wait,
              the `/grilling` and `/domain-modeling` sessions). Make the call yourself
              and apply exactly ONE state label. `gh` is the ONLY way you read or write
              the issue (GH_TOKEN / GH_REPO are set, already authenticated); read with
              `gh issue view <n> --json title,body,labels,comments`.
            - GROUND your judgment first in: CONTEXT.md (domain glossary + CLOSED design
              decisions), docs/adr/, docs/agents/triage-labels.md, and the issue itself.
            - IDEMPOTENCY (check FIRST): if the issue already carries any of
              `ready-for-agent`, `ready-for-human`, `wontfix`, `needs-info`, or
              `blocked`, it has already been triaged — do nothing and stop.
            - BLOCKERS (check NEXT): scan the body and comments for `Blocked by #N`,
              `Depends on #N`, or `Requires #N`. For each, `gh issue view <N> --json
              state,title`. If ANY is still OPEN, post ONE comment listing the open
              blockers, run `gh issue edit <n> --add-label blocked --remove-label
              needs-triage`, and STOP. (unblock.yml re-triages when the blocker closes.)
            - CLOSED DECISIONS: if the request reopens a CLOSED decision (brand format,
              payload byte layout, canonical `is()`, monotonicity, custom epoch, Opaque
              key behavior, or wire-indistinguishable codec variants) with no compelling
              new argument → `wontfix`; if it has genuine merit → `ready-for-human`.
            - For bugs, reproduce with a minimal failing test and `pnpm test`, then
              DELETE the temp test — commit nothing, leave no repro files. Triage ONLY:
              do not modify code, open PRs, or push.

            DELIVERABLE — the job is not done until these land on the issue (verify with
            `gh issue view <n> --json labels,comments`):
            - ONE issue comment (heredoc body) with the reproduction result, acceptance
              criteria, scope/impact summary, and the chosen label + one-line rationale.
            - `gh issue edit <n> --add-label "<label>" --remove-label "needs-triage"`.

      # Catch the "hollow success" case: the agent step can exit 0 without actually
      # writing to the issue (e.g. a 403 on the comment/label). Assert the decision
      # label is present so such runs fail loudly instead of passing silently. The
      # invariant also holds for already-triaged issues (the label persists).
      - name: Verify triage landed on the issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          echo "Labels on #$ISSUE_NUMBER:"
          echo "$labels"
          if echo "$labels" | grep -qxE 'ready-for-agent|ready-for-human|needs-info|wontfix|blocked'; then
            echo "✓ Triage decision label present."
          else
            echo "::error::Triage produced no decision label on #$ISSUE_NUMBER (agent likely failed to write — check App permissions and the run log)."
            exit 1
          fi
