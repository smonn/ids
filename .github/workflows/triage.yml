name: Triage issues

on:
  issues:
    # `labeled` lets the unblock workflow re-triage by adding `do:triage`
    # (filtered in the job `if` below so other label changes are no-ops).
    types: [opened, reopened, labeled]
  # Manual re-triage, e.g. for testing against an existing issue.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re)triage
        required: true
        type: string

concurrency:
  group: triage-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

# PRODUCE / POST split (see .github/workflows/README.md "Producer / poster split"). The
# producer reads `.triage-context/`, makes the triage judgment, and writes its decision
# under `.triage/` (a raw-markdown `comment.md` plus a scalars-only `manifest.json`); the
# deterministic `post` step does all the commenting + labeling. Two purely mechanical
# decisions short-circuit BEFORE the agent is ever invoked:
#   - IDEMPOTENCY: if the issue already carries a decision label it was triaged.
#   - BLOCKERS: if any declared blocker is still OPEN, the gate posts the "blocked"
#     comment + label deterministically and stops (unblock.yml re-triages later).
jobs:
  triage:
    # Who is allowed to set this pipeline in motion. Two independent guards:
    #
    # 1. LOOP GUARD (bot authors): skip third-party bot-authored issues, but allow our
    #    own trusted App (`smonn[bot]`) through — it files follow-up issues from
    #    address-review.yml and re-triage from unblock.yml, which must still be triaged
    #    (mirrors the `allowed_bots: "smonn[bot]"` pattern in the claude-code-action step
    #    below). Loop-safe: triage creates no issues, and on `labeled` events we only act
    #    when `do:triage` was added, so triage/implement applying their own labels are
    #    no-ops.
    #
    # 2. THIRD-PARTY GUARD (human authors): an issue opened/reopened by an outside party
    #    must NOT auto-trigger the agent pipeline (triage -> issue:ready-agent, then a
    #    maintainer's `do:implement` -> implement writes code + opens a PR). So on
    #    `opened`/`reopened` we only auto-triage when the
    #    author is trusted — OWNER / MEMBER / COLLABORATOR — or is our own `smonn[bot]`
    #    (whose `author_association` is not a repo role, so it is named explicitly to keep
    #    the follow-up / re-triage chains alive). An outside issue is left untouched until
    #    a maintainer opts it in by adding `do:triage`; that arrives as a `labeled`
    #    event, which is gated by GitHub's own permission model (adding a label requires
    #    triage/write access, which `author_association` alone — e.g. a returning
    #    CONTRIBUTOR — does NOT grant). The `labeled` branch therefore needs no author
    #    check: only a trusted actor (or the App) can reach it. This matches the issue
    #    templates, which already tell reporters that "a maintainer applies triage labels".
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      ((github.event.issue.user.type != 'Bot' || github.event.issue.user.login == 'smonn[bot]') &&
       (
         (github.event.action == 'labeled' && github.event.label.name == 'do:triage') ||
         (github.event.action != 'labeled' &&
          (github.event.issue.user.login == 'smonn[bot]' ||
           github.event.issue.author_association == 'OWNER' ||
           github.event.issue.author_association == 'MEMBER' ||
           github.event.issue.author_association == 'COLLABORATOR'))
       )) }}
    runs-on: ubuntu-latest
    # Agent secrets (APP_ID / APP_PRIVATE_KEY / CLAUDE_CODE_OAUTH_TOKEN) live in
    # the `automation` environment, kept separate from the `npm` publish env.
    environment: automation
    timeout-minutes: 20
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      # First step: monitor egress from this privileged job. It mints an App
      # token with `issues: write`, so an unexpected outbound connection (e.g. a
      # malicious postinstall trying to exfiltrate it) is worth detecting. Audit
      # mode logs only — it never blocks — so it cannot break triage.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Checkout first: the app-token steps below use the LOCAL composite action
      # under .github/actions/app-token, which must be on disk before it runs. This
      # checkout needs no token, so it is safe to run before the mints.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: triage only reads the repo and writes to the issue
          # (comment + exactly one decision label); it never pushes or opens PRs. Scope
          # the token so a prompt-injection via a malicious new issue can't reach for the
          # App's full installation grant.
          permission-contents: read
          permission-issues: write

      # A SECOND, strictly READ-ONLY App token handed to the producer (the agent). The
      # write token above is used only by the deterministic mutating steps (the gate's
      # blocked path and the poster). claude-code-action wires its `github_token` into the
      # agent's git/gh auth, and the producer's Bash is scoped to `pnpm` — but `pnpm exec`
      # can run arbitrary binaries (e.g. `pnpm exec gh issue edit`), so a write token here
      # would let the agent mutate the issue despite the "producer posts nothing" design.
      # Minting a read-only token makes the producer mutation-free at the token level, not
      # just by convention: even an injected `gh` call cannot edit or comment on the issue.
      # Kept as a SEPARATE mint from the write token above — the write/read-only split is
      # the security boundary; do not merge them.
      - name: Generate read-only GitHub App token (for the producer)
        id: app-token-ro
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      # Precompute every input the producer needs and write it under .triage-context/, so
      # the agent runs NO gh and NO git — it reads files and writes files, nothing else.
      # This is the issue itself (title/body/comments), the current labels, and the parsed
      # blocker list with EACH blocker's open/closed state (the parser is reused verbatim
      # from unblock.yml). The deterministic gate below reads these same files to make the
      # idempotency / blockers decisions BEFORE the agent is ever invoked.
      - name: Build triage context (issue, labels, blockers)
        id: context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .triage-context

          # The issue title/body/comments (the producer's primary input) and its labels.
          gh issue view "$ISSUE_NUMBER" --json title,body,comments,labels > .triage-context/issue.json
          jq -r '"# " + .title + "\n\n" + (.body // "") + "\n\n## Comments\n\n"
                 + ([.comments[] | "### @" + .author.login + "\n\n" + (.body // "")] | join("\n\n---\n\n"))' \
            .triage-context/issue.json > .triage-context/issue.md
          jq -r '.labels[].name' .triage-context/issue.json > .triage-context/labels.txt

          # Parse declared blockers and resolve each one's state. The text→numbers
          # extraction is shared verbatim with unblock.yml (two declaration forms: an
          # inline "Depends on #N" phrase, and a "## Blocked by"/Depends on/Requires
          # heading followed by a markdown bullet list of "- #N" items). The bullet pass
          # reads only the LEADING #N of each bullet under the heading, so a
          # self-reference resolves correctly.
          text=$(jq -r '.body + "\n" + ([.comments[].body] | join("\n"))' .triage-context/issue.json)
          deps=$(printf '%s' "$text" | bash .github/scripts/parse-blockers.sh)

          # For each blocker resolve its state via `gh issue view` (works for PR numbers
          # too). Record one "<n> <STATE>" line per blocker for the producer context, and
          # collect {number,state} pairs to classify. The resolution rule (CLOSED/MERGED
          # ⇒ resolved; everything else still open) and the open-list formatting live in
          # the unit-tested .github/scripts/blocker-status.mjs, shared with unblock.yml.
          : > .triage-context/blockers.txt
          pairs='[]'
          if [ -n "$deps" ]; then
            for d in $deps; do
              state=$(gh issue view "$d" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              echo "$d $state" >> .triage-context/blockers.txt
              pairs=$(jq -c --argjson n "$d" --arg s "$state" '. += [{number:$n, state:$s}]' <<<"$pairs")
            done
          fi
          status=$(jq -nc --argjson b "$pairs" '{blockers:$b}' | node .github/scripts/blocker-status.mjs)
          echo "any_open=$(jq -r '.anyOpen' <<<"$status")" >> "$GITHUB_OUTPUT"
          echo "open_list=$(jq -r '.openList' <<<"$status")" >> "$GITHUB_OUTPUT"
          echo "Context built:"; wc -l .triage-context/* || true
          echo "Blockers:"; cat .triage-context/blockers.txt || true

      # Deterministic gate (mirrors autofix.yml / address-review.yml): decide whether the
      # agent should run at all, moving the two purely-mechanical decisions OUT of the
      # prompt. proceed=false short-circuits the producer + poster.
      #   - IDEMPOTENCY: if the issue already carries any decision status
      #     (issue:ready-agent / issue:ready-human / issue:wontfix / issue:needs-info /
      #     issue:blocked) it has already been triaged — do nothing.
      #   - BLOCKERS: if ANY declared blocker is still OPEN, post ONE "blocked" comment
      #     and set `issue:blocked` right here, then stop.
      #     unblock.yml re-triages when the blocker closes.
      - name: Gate — idempotency and blockers
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ANY_OPEN: ${{ steps.context.outputs.any_open }}
          OPEN_LIST: ${{ steps.context.outputs.open_list }}
        run: |
          set -euo pipefail
          # Namespaced issue: status helpers (ADR-0029); authoritative since Phase 4.
          source .github/scripts/lifecycle-status.sh

          # Consume the do:triage trigger up front so it can be re-applied to re-kick.
          # Best-effort and harmless on the non-do:triage paths (opened/reopened/dispatch).
          gh issue edit "$ISSUE_NUMBER" --remove-label do:triage >/dev/null 2>&1 || true

          # IDEMPOTENCY: any decision status already present means triage is done.
          if grep -qxE 'issue:ready-agent|issue:ready-human|issue:wontfix|issue:needs-info|issue:blocked' .triage-context/labels.txt; then
            echo "#$ISSUE_NUMBER already carries a decision label — already triaged, nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # BLOCKERS: if any blocker is still open, park as blocked deterministically.
          if [ "$ANY_OPEN" = "true" ]; then
            # open_list (e.g. "#1, #2") is precomputed by blocker-status.mjs.
            open_list="$OPEN_LIST"
            {
              printf '> *This was generated by AI during triage.*\n\n'
              printf 'This issue is **blocked** by open dependencies: %s.\n\n' "$open_list"
              printf 'Parking it as `blocked`; it will be re-triaged automatically once '
              printf 'every blocker is closed.\n'
            } > blocked-comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file blocked-comment.md
            set_issue_status "$ISSUE_NUMBER" blocked
            echo "#$ISSUE_NUMBER parked as blocked (open blockers: $open_list)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No decision label yet and no open blockers — running the producer."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.gate.outputs.proceed == 'true'

      # Producer: the agent makes the triage judgment and writes it to files. It posts
      # nothing and mutates nothing — note GH_TOKEN is deliberately NOT in this step's
      # env, so the agent's fallback `gh` is unauthenticated and cannot touch the issue.
      - name: Produce the triage decision (write to .triage/, post nothing)
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # READ-ONLY token: claude-code-action wires this into the agent's git/gh auth,
          # so a write token here would let a `pnpm exec gh issue edit` mutate the issue.
          # The read-only token makes the producer mutation-free at the token level; the
          # deterministic poster below mutates with the write token instead.
          github_token: ${{ steps.app-token-ro.outputs.token }}
          # Triage can be re-dispatched by the App when an issue becomes unblocked,
          # making the actor a bot. Allow only our own App (never '*').
          allowed_bots: "smonn[bot]"
          # Hermetic producer: Read/Grep/Glob to read the precomputed .triage-context/
          # files and the repo's docs; Write to author the .triage/ files; Bash scoped to
          # ONLY `pnpm` so the bug-repro can run `pnpm test`. NO gh, NO git, NO general
          # shell — every issue input is precomputed and the deterministic `post` step
          # below owns all GitHub writes. Sonnet keeps subscription usage modest; bump to
          # opus if triage quality needs it.
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools "Bash(pnpm:*),Read,Grep,Glob,Write,TodoWrite,Task"
          prompt: |
            /triage #${{ env.ISSUE_NUMBER }}

            Run the repo's `triage` skill (invoked above) to triage this issue in
            ${{ github.repository }} — `@smonn/ids`, a TypeScript library for encoding
            and decoding sortable IDs. The skill owns the methodology: classification,
            reproduction, acceptance criteria, scoping, and the label/state model (the
            label vocabulary is in docs/agents/triage-labels.md). Apply these repo and
            CI overrides on top of it:

            - NON-INTERACTIVE: you are running headless in CI — there is NO maintainer
              to converse with. Skip the skill's interactive steps (recommend-and-wait,
              the `/grilling` and `/domain-modeling` sessions). Make the call yourself
              and choose exactly ONE state label.
            - PRODUCER ONLY: you have NO gh and NO git, and you make ZERO GitHub changes.
              You do NOT comment, label, edit the issue, push, or open PRs. Everything
              the issue carries has been PRECOMPUTED for you — read these files instead of
              running any `gh`/`git`:
                - `.triage-context/issue.md`  — the issue title, body, and all comments.
                - `.triage-context/labels.txt` — the issue's current labels (one per line).
                - `.triage-context/blockers.txt` — declared blockers as "<n> <STATE>"
                  lines (may be empty). The idempotency and blocker decisions have ALREADY
                  been made deterministically before you were invoked — every blocker here
                  is resolved (CLOSED/MERGED) and the issue carries no decision label yet,
                  so just triage it normally; do NOT re-park it as `blocked`.
            - GROUND your judgment first in: CONTEXT.md (domain glossary + CLOSED design
              decisions), docs/adr/, docs/agents/triage-labels.md, and the issue text in
              `.triage-context/issue.md`. Read these from the checkout with Read/Grep/Glob.
            - SCOPE FENCE: when you write the acceptance criteria, include an explicit
              `Non-goals / Out of scope` list. For any issue in a `Blocked by` / split
              chain, name the sibling issue that owns each deferred piece, and ensure
              every docs criterion covers ONLY behavior this issue itself ships — never
              pre-documenting a follow-up's work (e.g. don't ask a foundation issue to
              add an error-code table its sibling conversion will ship). If the body
              lacks this fence and scope is ambiguous, add the fence in your comment.
            - CLOSED DECISIONS: if the request reopens a CLOSED decision (brand format,
              payload byte layout, canonical `is()`, monotonicity, custom epoch, Opaque
              key behavior, or wire-indistinguishable codec variants) with no compelling
              new argument → `wontfix`; if it has genuine merit → `ready-for-human`.
            - CI / WORKFLOW CHANGES: the implementation agent's App token deliberately
              lacks the `workflows` permission (least-privilege — a prompt-injected agent
              must not be able to rewrite CI, which runs with secrets), so GitHub rejects
              any push that creates or modifies a file under `.github/workflows/`. If
              satisfying this issue would require adding or editing ANY
              `.github/workflows/*` file, choose `ready-for-human` (a maintainer must make
              the workflow change by hand) — even when the issue is otherwise a clean,
              well-scoped `ready-for-agent` candidate. Note this in your rationale. An
              issue that only touches non-workflow files (src/, docs, other config) is
              unaffected by this rule.
            - For bugs, reproduce with a minimal failing test and `pnpm test` (Bash is
              scoped to `pnpm` only for exactly this), then DELETE the temp test — leave
              no repro files. Triage ONLY: do not modify source code, commit, or push.

            STYLE — the comment is read by a busy maintainer: lead with the decision,
            use short plain sentences, and include only what changes what the reader
            does next. No preamble, no restating the issue text, no closing recap.
            Acceptance criteria stay a tight bullet list; everything else is a few
            sentences, never padded to look thorough.

            DELIVERABLE — write exactly these two files under a `.triage/` directory; a
            later deterministic step reads them and does all the commenting + labeling:

            1. `.triage/comment.md` — the issue comment body as RAW markdown: the
               reproduction result, acceptance criteria, scope/impact summary, and the
               chosen label + a one-line rationale. It MUST begin with the skill's
               disclaimer line, verbatim:

                   > *This was generated by AI during triage.*

               Author it with the Write tool, which writes bytes verbatim: use REAL
               newlines (press enter), never the characters backslash-n. Never emit
               backslash escapes and never backslash-escape markdown metacharacters
               (`<`, `>`, `[`, `]`, backtick) — write them as plain characters; GitHub
               renders them correctly. A literal backslash-n or backslash-`<` in the body
               is a bug. You never touch JSON encoding or `gh` — the posting step does.

            2. `.triage/manifest.json` — a scalars-only JSON object carrying ONLY the
               chosen label, so there is nothing to escape:

                   { "label": "<one of: ready-for-agent, ready-for-human, wontfix, needs-info>" }

               `label` MUST be exactly one of those four strings (the blocker case is
               handled before you run, so never emit `blocked`). Write both files even
               if your decision is `needs-info`.

      # Deterministic poster: read the producer's .triage/ files and do ALL GitHub
      # mutation. Validate the manifest parses and that .label is one of the allowed
      # decision values (fail loudly otherwise), post the comment via --body-file
      # (never a --body string, so the body can't be corrupted by shell quoting), then
      # set the namespaced issue: status for that decision. The four decision tokens
      # below are the producer's stable vocabulary; set_issue_status maps each to its
      # `issue:*` status label (ADR-0029) and clears any sibling status.
      - name: Post the triage decision
        id: post
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/scripts/poster-lib.sh
          # Namespaced issue: status helpers (ADR-0029); authoritative since Phase 4.
          source .github/scripts/lifecycle-status.sh
          require_manifest .triage
          test -f .triage/comment.md   || { echo "::error::producer wrote no .triage/comment.md"; exit 1; }

          label=$(jq -r '.label // empty' .triage/manifest.json)
          case "$label" in
            ready-for-agent | ready-for-human | wontfix | needs-info) ;;
            *) echo "::error::manifest .label is '$label' — must be one of ready-for-agent, ready-for-human, wontfix, needs-info"; exit 1 ;;
          esac

          gh issue comment "$ISSUE_NUMBER" --body-file .triage/comment.md
          set_issue_status "$ISSUE_NUMBER" "$label"
          echo "Triaged #$ISSUE_NUMBER as '$label'."

      # Catch the "hollow success" backstop: when the producer ran, the poster must have
      # landed a decision label. (The gate's blocked / idempotency branches set
      # proceed=false and handle their own state, so this only guards the produce → post
      # path.) Assert a decision label is present so a poster that silently failed — or
      # never ran — fails the job loudly instead of passing green.
      - name: Verify triage landed on the issue
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          echo "Labels on #$ISSUE_NUMBER:"
          echo "$labels"
          if echo "$labels" | grep -qxE 'issue:ready-agent|issue:ready-human|issue:needs-info|issue:wontfix|issue:blocked'; then
            echo "✓ Triage decision label present."
          else
            echo "::error::Triage produced no decision label on #$ISSUE_NUMBER (poster likely failed to write — check App permissions and the run log)."
            exit 1
          fi
