name: Docs

# Deploy the documentation site (ids.smonn.se) on three triggers:
#   1. push to main touching website/** or src/** — deploys docs and site fixes
#      immediately on merge, without waiting for an npm release. Note: changes
#      to src/** may temporarily expose API-reference docs for unreleased main;
#      this is the accepted trade-off.
#   2. release: published — ensures the live site reflects every npm release.
#   3. workflow_dispatch — allows a manual redeploy at any time.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
  release:
    types: [published]
  workflow_dispatch:

# Allow one concurrent deployment; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      # Build the library first: the playground imports @smonn/ids via the
      # workspace link, which resolves to ./dist through the package exports.
      - run: pnpm build

      - run: pnpm --filter @smonn/ids-website build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
