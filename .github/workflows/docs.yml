name: Docs

# Deploy the documentation site (ids.smonn.se) on four triggers:
#   1. push to main touching website/** — deploys site fixes immediately on
#      merge. src/** is deliberately NOT a push trigger: automated merges land
#      every few minutes in bursts, and deploying on each one tripped GitHub
#      Pages' deployment throttle (~10 builds/hour), failing the deploy job
#      with a generic "Deployment failed, try again later" (#216, #217, #224,
#      #229, #231, #233, #239, #241, #242).
#   2. schedule (hourly) — picks up src/** changes so API-reference docs for
#      main lag at most an hour. The `changes` job skips the deploy when no
#      src/** commit landed since the previous tick. Note: this may expose
#      API-reference docs for unreleased main; this is the accepted trade-off.
#   3. release: published — ensures the live site reflects every npm release.
#   4. workflow_dispatch — allows a manual redeploy at any time.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
  schedule:
    # Offset from the top of the hour to dodge GitHub's peak-load window.
    - cron: "17 * * * *"
  release:
    types: [published]
  workflow_dispatch:

# Allow one concurrent deployment; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  # Debounce for scheduled runs: deploy only if src/** changed since the
  # previous hourly tick. Every other trigger always deploys.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need commit timestamps beyond the tip

      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='65 minutes ago' --oneline -- src/)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-pnpm

      # Build the library first: the playground imports @smonn/ids via the
      # workspace link, which resolves to ./dist through the package exports.
      - run: pnpm build

      - run: pnpm --filter @smonn/ids-website build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    # Pages intermittently rejects deployments server-side ("Deployment
    # failed, try again later") ~5s after creation, usually when deploys
    # arrive in bursts. Each attempt below creates a fresh deployment, so
    # back off and retry twice before failing the run.
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: retry1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 180

      - id: retry2
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
