name: Bench

on:
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bench PR head
        run: pnpm bench > /tmp/pr.json

      - name: Add base worktree
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}

      - name: Install base deps
        working-directory: ../base
        run: pnpm install --frozen-lockfile

      - name: Bench base
        working-directory: ../base
        run: |
          if grep -q '"bench"' package.json; then
            pnpm bench > /tmp/base.json
          else
            echo "" > /tmp/base.json
          fi

      - name: Compare
        id: compare
        run: |
          set +e
          pnpm -s bench:compare /tmp/base.json /tmp/pr.json > /tmp/comment.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            /tmp/base.json
            /tmp/pr.json
            /tmp/comment.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/comment.md", "utf8");
            const marker = "<!-- bench-comment -->";
            const fullBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }

      - name: Fail on regression
        if: steps.compare.outputs.exit_code != '0'
        run: |
          echo "Benchmark regression detected. See PR comment for details."
          exit 1
