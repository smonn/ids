name: Bench

# Informational benchmark check (non-blocking). Runs only on PRs that touch
# bench-affecting files. This previously used an always-on `changes` gate job to
# avoid stranding a *required* check on unrelated PRs (a `paths:` filter would
# leave a required check stuck "Expected" and block merge forever). The check is
# no longer required, so a plain `paths:` filter is correct and far simpler — PRs
# that touch none of these files just don't run it.
on:
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsdown.bench.config.ts"
      - ".github/workflows/bench.yml"

concurrency:
  # Supersede stale runs of the same PR: a new push cancels the previous run on
  # this ref so the bench comment tracks the latest commit instead of queueing
  # behind outdated runs.
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # Same-repo guard: fork PRs skip the bench. This job is write-scoped and runs
    # no untrusted code on forks; a skipped job is harmless now that the check is
    # not required.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      # The conflict guard below cancels the run when the PR is mid-rebase.
      actions: write
    steps:
      # Pause the bench while this PR is mid-conflict-rebase (same rationale as
      # ci.yml's guard). Self-cancel rather than fail: a cancelled run is neutral
      # and the rebase merge commit runs a fresh bench. Fail-open on a read error.
      - name: Pause while an automation mutex is present on this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qE '^automation:'; then
            echo "PR #$PR_NUMBER carries an automation:* mutex — cancelling; the rebase merge commit will run a fresh bench."
            gh run cancel "$GITHUB_RUN_ID" || true
            sleep 30  # let the cancellation land so later steps don't run
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Bench PR head
        run: pnpm bench > /tmp/pr.json

      - name: Restore base bench cache
        id: base-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/base.json
          key: bench-base-${{ github.event.pull_request.base.sha }}

      - name: Add base worktree
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}

      - name: Install base deps
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ../base
        run: pnpm install --frozen-lockfile

      - name: Bench base
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ../base
        run: |
          if grep -q '"bench"' package.json; then
            pnpm bench > /tmp/base.json
          else
            echo "" > /tmp/base.json
          fi

      # Informational only: bench:compare never exits non-zero on a regression, so
      # the comparison itself can't fail the job. Severe sync-bench regressions are
      # surfaced in the PR comment for a human to review. A non-zero exit here means
      # a genuine error (e.g. an unreadable PR report), which should fail the job.
      - name: Compare
        run: pnpm -s bench:compare /tmp/base.json /tmp/pr.json > /tmp/comment.md

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            /tmp/base.json
            /tmp/pr.json
            /tmp/comment.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/comment.md", "utf8");
            const marker = "<!-- bench-comment -->";
            const fullBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }
