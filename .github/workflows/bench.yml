name: Bench

# Informational benchmark check (non-blocking). Runs only on PRs that touch
# bench-affecting files. This previously used an always-on `changes` gate job to
# avoid stranding a *required* check on unrelated PRs (a `paths:` filter would
# leave a required check stuck "Expected" and block merge forever). The check is
# no longer required, so a plain `paths:` filter is correct and far simpler — PRs
# that touch none of these files just don't run it.
#
# The push trigger runs only the `baseline` job: it warms the bench-base cache
# for each main commit so PR runs restore their base numbers instead of
# re-benching the base branch. The cache key includes the runner's CPU model
# (see the "Compute CPU model cache key" steps), so a PR run only ever restores
# a baseline benched on its own processor model — cross-model p50 comparisons
# (10–30% spread on GitHub's heterogeneous fleet) are structurally impossible,
# preserving the paired-measurement rationale behind bench/compare.ts's
# thresholds (#1046). No paths filter on push — any main commit can be a PR's
# base sha, so a filtered warmer would leave gaps for merges that don't touch
# bench-affecting files.
on:
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsdown.bench.config.ts"
      - ".github/workflows/bench.yml"
  push:
    branches:
      - main

concurrency:
  # Supersede stale runs of the same PR: a new push cancels the previous run on
  # this ref so the bench comment tracks the latest commit instead of queueing
  # behind outdated runs. Baseline warmers group by sha instead — each main
  # commit needs its own cache entry, so a newer push must not cancel the
  # previous commit's warmer.
  group: bench-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

# No workflow-level permissions: the jobs below declare their own grants, so a
# future job added without a permissions: block inherits nothing instead of the repo
# default. Every other workflow sets a top-level block.
permissions: {}

jobs:
  # Skip the bench while this PR is mid-conflict-rebase (same rationale as
  # ci.yml's guard). A separate read-only job instead of a self-cancel step so
  # the bench job never needs `actions: write` (Scorecard Token-Permissions);
  # a skipped bench job is neutral, same as the cancelled run used to be, and
  # the rebase merge commit runs a fresh bench. Fail-open on a read error.
  mutex:
    # Same-repo guard: fork PRs skip the bench. The bench job below is
    # write-scoped and runs no untrusted code on forks; a skipped job is
    # harmless now that the check is not required. Push events (baseline
    # warming) skip this job and the bench job behind it.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      locked: ${{ steps.check.outputs.locked }}
    steps:
      - name: Check for an automation mutex on this PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qE '^automation:'; then
            echo "PR #$PR_NUMBER carries an automation:* mutex — skipping; the rebase merge commit will run a fresh bench."
            echo "locked=true" >> "$GITHUB_OUTPUT"
          fi

  bench:
    needs: mutex
    if: needs.mutex.outputs.locked != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Bench PR head
        run: pnpm bench > /tmp/pr.json

      # Same computation as the baseline job's step below — the two must stay
      # in lockstep or PR runs never hit the warmed cache. Hashing the model
      # string keeps the key free of spaces/commas actions/cache can't take.
      - name: Compute CPU model cache key
        id: cpu
        run: |
          model=$(node -p "require('node:os').cpus()[0]?.model ?? 'unknown'")
          hash=$(printf '%s' "$model" | sha256sum | cut -c1-12)
          echo "CPU model: $model (key fragment: $hash)"
          echo "model-hash=$hash" >> "$GITHUB_OUTPUT"

      # Strict key match only — no restore-keys prefix fallback. Restoring a
      # different model's baseline would reintroduce the cross-model comparison
      # the model-keyed cache exists to prevent; a miss takes the on-runner
      # fallback below instead. On a miss, the post step saves the fallback's
      # base.json under this runner's own (sha, model) key, so per-model
      # coverage accretes as PRs run.
      - name: Restore base bench cache
        id: base-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/base.json
          key: bench-base-${{ github.event.pull_request.base.sha }}-${{ steps.cpu.outputs.model-hash }}

      - name: Add base worktree
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}

      - name: Install base deps
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ../base
        run: pnpm install --frozen-lockfile

      - name: Bench base
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ../base
        run: |
          if grep -q '"bench"' package.json; then
            pnpm bench > /tmp/base.json
          else
            echo "" > /tmp/base.json
          fi

      # Informational only: bench:compare never exits non-zero on a regression, so
      # the comparison itself can't fail the job. Severe sync-bench regressions are
      # surfaced in the PR comment for a human to review. A non-zero exit here means
      # a genuine error (e.g. an unreadable PR report), which should fail the job.
      - name: Compare
        run: pnpm -s bench:compare /tmp/base.json /tmp/pr.json > /tmp/comment.md

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            /tmp/base.json
            /tmp/pr.json
            /tmp/comment.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/comment.md", "utf8");
            const marker = "<!-- bench-comment -->";
            const fullBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }

  # Warm the bench-base-<sha>-<cpu-model-hash> cache on every push to main so
  # PR runs restore their base numbers instead of re-benching the base branch
  # (halves the PR bench job). The key must stay in sync with the bench job's
  # restore key above — that contract is why this job lives in the same file.
  #
  # The CPU-model suffix is what keeps the cached baseline statistically valid
  # (#1046): sync p50s differ 10–30% across GitHub's heterogeneous processor
  # fleet, wider than compare.ts's ±15%/+30% thresholds, so a baseline is only
  # comparable on the model that produced it. The warmer therefore warms one
  # model per push — whichever runner it lands on — and PR runs on other models
  # miss the cache and bench base on-runner (paired measurement, the pre-warmer
  # path), saving under their own model key for later PRs. The trade-off is a
  # partial hit rate instead of a statistically silent cross-model comparison.
  baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Runs before setup-node-pnpm: the runner's preinstalled system node is
      # enough here, and the cache restore must know the key first.
      - name: Compute CPU model cache key
        id: cpu
        run: |
          model=$(node -p "require('node:os').cpus()[0]?.model ?? 'unknown'")
          hash=$(printf '%s' "$model" | sha256sum | cut -c1-12)
          echo "CPU model: $model (key fragment: $hash)"
          echo "model-hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore existing baseline cache
        id: base-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/base.json
          key: bench-base-${{ github.sha }}-${{ steps.cpu.outputs.model-hash }}

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.base-cache.outputs.cache-hit != 'true'

      - name: Bench baseline
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: pnpm bench > /tmp/base.json
