name: Bench

on:
  pull_request:

concurrency:
  # Supersede stale runs of the same PR: a new push cancels the previous run on this
  # ref, so the (required) bench check tracks the latest commit instead of queueing
  # behind outdated runs. Cross-PR load is kept down by the `changes` gate below,
  # which skips the suite entirely on PRs that touch no bench-affecting files — a
  # global serialize-and-queue group would instead block each PR's latest commit
  # behind unrelated and superseded runs.
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate the expensive bench without a workflow-level `paths:` filter. Because `bench`
  # is a *required* check, a path filter on `on:` would leave it stuck "Expected" on
  # PRs that touch no bench files and block merge forever. A skipped *job*, by
  # contrast, reports its required check as success — so we always run this cheap gate
  # and let it skip `bench` for unrelated PRs. The same-repo guard lives here too: on
  # fork PRs this job is skipped, which skips `bench` (no untrusted code, and none of
  # the write-scoped steps below run to 403).
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # The conflict guard below reads the PR's labels and self-cancels when the PR is
      # mid-rebase. Cancelling this gate cancels the whole run (the `bench` job needs it).
      pull-requests: read
      actions: write
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # Pause the bench while this PR is mid-conflict-rebase (same rationale as ci.yml's
      # guard). Self-cancel rather than skip: a cancelled run is neutral and won't strand
      # the required `bench` check; the rebase merge commit runs a fresh bench. Placed
      # before checkout so we cancel ahead of any expensive work. Fail-open on a read
      # error. bench is pull_request-only, so no event guard is needed.
      - name: Pause while this PR conflicts with main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
          if echo "$labels" | grep -qx conflicting; then
            echo "PR #$PR_NUMBER is marked conflicting — cancelling; the rebase merge commit will run a fresh bench."
            gh run cancel "$GITHUB_RUN_ID" || true
            sleep 30  # let the cancellation land so later steps don't run
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect bench-affecting changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail safe: if the diff can't be computed, run the bench rather than
          # silently skip a required regression check.
          run=true
          if changed=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            if printf '%s\n' "$changed" | grep -qE '^(src/|bench/|package\.json|pnpm-lock\.yaml|tsconfig\.json|tsdown\.bench\.config\.ts|\.github/workflows/bench\.yml)'; then
              run=true
            else
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "bench-affecting changes: $run"

  bench:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      - name: Bench PR head
        run: pnpm bench > /tmp/pr.json

      - name: Restore base bench cache
        id: base-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/base.json
          key: bench-base-${{ github.event.pull_request.base.sha }}

      - name: Add base worktree
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}

      - name: Install base deps
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ../base
        run: pnpm install --frozen-lockfile

      - name: Bench base
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ../base
        run: |
          if grep -q '"bench"' package.json; then
            pnpm bench > /tmp/base.json
          else
            echo "" > /tmp/base.json
          fi

      # Informational only: bench:compare never exits non-zero on a regression, so
      # the comparison itself can't fail the job. Severe sync-bench regressions are
      # surfaced in the PR comment for a human to review. A non-zero exit here means
      # a genuine error (e.g. an unreadable PR report), which should fail the job.
      - name: Compare
        run: pnpm -s bench:compare /tmp/base.json /tmp/pr.json > /tmp/comment.md

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            /tmp/base.json
            /tmp/pr.json
            /tmp/comment.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/comment.md", "utf8");
            const marker = "<!-- bench-comment -->";
            const fullBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }
