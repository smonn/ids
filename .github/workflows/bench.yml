name: Bench

on:
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # Same-repo PRs only. A fork PR runs with a read-only GITHUB_TOKEN, so the
    # comment / artifact-upload / regression-fail steps below would 403 and surface a
    # spurious red check that isn't a real regression. (It also keeps untrusted fork
    # code from running here at all.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bench PR head
        run: pnpm bench > /tmp/pr.json

      - name: Add base worktree
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}

      - name: Install base deps
        working-directory: ../base
        run: pnpm install --frozen-lockfile

      - name: Bench base
        working-directory: ../base
        run: |
          if grep -q '"bench"' package.json; then
            pnpm bench > /tmp/base.json
          else
            echo "" > /tmp/base.json
          fi

      - name: Compare
        id: compare
        run: |
          set +e
          pnpm -s bench:compare /tmp/base.json /tmp/pr.json > /tmp/comment.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            /tmp/base.json
            /tmp/pr.json
            /tmp/comment.md

      - name: Comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/comment.md", "utf8");
            const marker = "<!-- bench-comment -->";
            const fullBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }

      - name: Fail on regression
        if: steps.compare.outputs.exit_code != '0'
        run: |
          echo "Benchmark regression detected. See PR comment for details."
          exit 1
