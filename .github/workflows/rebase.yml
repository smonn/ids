name: Rebase agent PRs on demand

# Rebase is opt-in per PR, never automatic. Apply the `needs-rebase` label to an
# open agent PR and this merges the latest `main` into its branch — resolving any
# conflicts with Claude — then pushes, which re-runs the branch's CI.
#
# There is deliberately NO rebase on every push to `main`, and NO plain
# `gh pr update-branch` auto-merge of behind-but-clean branches: a maintainer
# decides when to refresh a branch by applying the label. The label is removed at
# the start of the run so it can be re-applied to trigger again.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: rebase-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    # Only the `needs-rebase` label, on an OPEN same-repo agent branch. This job
    # checks out and executes the branch's code (install + the CI gate), so it must
    # never run on a fork's code with our secrets — hence the same-repo head check.
    # Labels can only be applied by users with write access, so the trigger is
    # implicitly maintainer-gated.
    if: >-
      github.event.label.name == 'needs-rebase' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # head.ref is PR-author-controlled; only ever used through this env var in
      # run: steps (never interpolated into a shell) so a crafted branch name can't
      # inject. The startsWith gate above also constrains it to agent/issue-*.
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # Pin the checkout to the commit that carried the label, not the moving branch
      # ref, to close the TOCTOU window (mirrors address-review.yml).
      EVENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: scope the token to what this job does — push the merge and
          # toggle the review/escalation labels — instead of the App's full grant.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Remove the needs-rebase label (so it can be re-applied)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label needs-rebase || true

      - name: Checkout the labelled commit (pinned SHA, not the branch ref)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.EVENT_SHA }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity and working branch
        run: |
          git config user.name "smonn[bot]"
          git config user.email "110314539+smonn[bot]@users.noreply.github.com"
          # We checked out a detached SHA; recreate the branch at it so we can push.
          git checkout -B "$BRANCH"

      - name: Check whether a merge is actually needed
        # Snapshot BEFORE the resolve step merges anything. If `main` is already an
        # ancestor of the branch tip there is nothing to merge, so the resolve step
        # will STOP without pushing and we must NOT re-trigger review. `merge-tree`
        # in the verify step below passes in both the "did merge" and "skipped"
        # cases, so this pre-merge snapshot is the only reliable signal.
        id: check-merge
        run: |
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "merge_needed=false" >> "$GITHUB_OUTPUT"
            echo "main is already an ancestor — no merge needed."
          else
            echo "merge_needed=true" >> "$GITHUB_OUTPUT"
            echo "main is ahead — a merge is needed."
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve conflicts with Claude
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The label may be applied by a maintainer (human) or our App.
          allowed_bots: "smonn[bot]"
          # The conflict-resolution methodology lives in the project
          # `resolving-merge-conflicts` skill (.claude/skills/resolving-merge-conflicts),
          # invoked via `/resolving-merge-conflicts`; this prompt supplies only the
          # merge command, the repo's exact CI gate, and the escalation guardrails.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite"
          prompt: |
            /resolving-merge-conflicts

            You are bringing PR #${{ env.PR_NUMBER }} of ${{ github.repository }} up to
            date with `main`. The PR branch `${{ env.BRANCH }}` is checked out; an
            authenticated `gh` CLI and a push-capable git remote are available. Use the
            `resolving-merge-conflicts` skill (invoked above) for the methodology —
            preserve both intents faithfully, never `--abort`, never weaken or delete
            tests — with these repo specifics:

            - START the merge: read the PR intent (`gh pr view ${{ env.PR_NUMBER }}
              --json title,body`), then `git fetch origin main` and `git merge
              origin/main`. If `main` is already an ancestor (nothing to merge), there
              is nothing to do — say so and STOP without pushing.
            - The skill's "automated checks" step IS the full CI gate, run exactly as
              ci.yml does (use `pnpm lint:fix` / `pnpm fmt` to auto-resolve): `pnpm
              lint` && `pnpm depcruise` && `pnpm fmt:check` && `pnpm typecheck` &&
              `pnpm test:coverage` && `pnpm build`. All must pass.
            - FINISH by committing the merge (keep the merge commit; do NOT force-push
              or rebase history) and pushing to `${{ env.BRANCH }}` with a plain `git
              push`. The branch is checked out at the commit that carried the label, so
              if the push is rejected because the branch has since advanced, do NOT
              force — post a PR comment saying the branch moved and the rebase needs a
              re-run (re-apply the label), then STOP. Do NOT modify any other branch,
              and do NOT push to main.
            - ESCALATE instead of forcing it: if the conflict cannot be resolved safely
              — main changed the feature out from under this PR, or resolving would
              require reopening a CLOSED design decision — do NOT push; post a PR
              comment explaining the situation and run `gh pr edit
              ${{ env.PR_NUMBER }} --add-label needs-human`.

      - name: Verify the branch is no longer conflicting
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx 'needs-human'; then
            echo "✓ PR #$PR_NUMBER escalated to a human; no automated resolution expected."
            exit 0
          fi
          git fetch -q origin main "$BRANCH"
          if git merge-tree --write-tree origin/main "origin/$BRANCH" >/dev/null 2>&1; then
            echo "✓ PR #$PR_NUMBER now merges cleanly with main."
          else
            echo "::error::PR #$PR_NUMBER still conflicts after the rebase attempt — check the run log."
            exit 1
          fi

      - name: Apply needs-review after a successful merge push
        # Close the review loop: a merge with `main` creates a new commit SHA that
        # bypasses the review dedup mechanism, and conflict resolution could silently
        # change code semantics, so the updated branch genuinely needs re-review.
        # Skipped automatically when no merge was needed (the outer `if`) or when the
        # resolve step escalated to a human (the `needs-human` guard inside).
        if: steps.check-merge.outputs.merge_needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx 'needs-human'; then
            echo "PR #$PR_NUMBER escalated to a human — skipping needs-review."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --add-label needs-review
          echo "✓ Applied needs-review to PR #$PR_NUMBER"
