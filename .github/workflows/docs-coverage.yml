name: Docs coverage

# Blocking gate: when a PR changes source whose hand-written website page
# (website/src/content/docs/**) was NOT updated in the same diff, post a sticky
# comment listing the pages and FAIL the check. The slice architecture gives a
# near 1:1 source↔docs mapping (see check-docs-coverage.sh); the TypeDoc API
# reference regenerates itself, so only the narrative pages are mapped.
#
# It exists because automation implementations tend to update README/CONTEXT.md
# and forget the website — errors.md alone drifted twice across the 2026-07-04
# audit rounds while this check was advisory. Because the mapping is
# file-level (it can't tell a behavior change from an internal refactor), a
# waiver line in the PR body starting `No docs update needed:` (with the
# reason) passes the check with a notice. `edited` is in the trigger so adding
# the waiver re-runs the check on the head SHA.
#
# Fork PRs run the gate too: the mapping and enforcement steps are read-only,
# so only the sticky-comment step is skipped on forks (their token can't
# write). Fork contributors get the gap report in the job summary instead,
# and the PR-body waiver line works for them the same way (issue #983).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # post / update the advisory comment

jobs:
  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Map changed source to website docs
        id: map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_FILE: ${{ runner.temp }}/docs-coverage.md
        run: |
          set -euo pipefail
          CHANGED=$(gh pr diff "$PR_NUMBER" --repo "$GH_REPO" --name-only)
          export CHANGED REPORT_FILE
          bash .github/scripts/check-docs-coverage.sh
          # The report is more than the bare marker line only when gaps exist.
          # Surface it on the run's summary page: fork PRs never receive the
          # sticky comment (read-only token), so this is their copy of the list.
          if [ "$(wc -l <"$REPORT_FILE")" -gt 1 ]; then
            cat "$REPORT_FILE" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Post or update advisory comment
        # Fork PRs get a read-only token, so this is the one step they skip;
        # the gap report still reaches them via the job summary below.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_FILE: ${{ runner.temp }}/docs-coverage.md
          GAPS: ${{ steps.map.outputs.gaps }}
        run: |
          set -euo pipefail
          marker='<!-- docs-coverage -->'
          # Find a prior advisory comment by its hidden marker so we update in
          # place instead of posting a fresh comment on every push.
          existing=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id" 2>/dev/null || true)

          if [ "${GAPS:-0}" -gt 0 ]; then
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@"$REPORT_FILE" >/dev/null
              echo "Updated advisory comment $existing ($GAPS gap(s))."
            else
              gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$REPORT_FILE"
              echo "Posted advisory comment ($GAPS gap(s))."
            fi
          elif [ -n "$existing" ] && [ "$existing" != "null" ]; then
            # Gaps were resolved: collapse the stale advisory rather than leave it
            # showing a list that no longer applies.
            printf '%s\n\n✅ Website docs coverage looks complete for the current diff.\n' "$marker" \
              | gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@- >/dev/null
            echo "Cleared resolved advisory comment $existing."
          else
            echo "No gaps and no prior comment; nothing to post."
          fi

      - name: Enforce coverage (waivable)
        env:
          GAPS: ${{ steps.map.outputs.gaps }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "${GAPS:-0}" -eq 0 ]; then
            echo "No docs-coverage gaps."
            exit 0
          fi
          if printf '%s\n' "$PR_BODY" | grep -qiE '^[[:space:]]*No docs update needed:'; then
            echo "::notice::$GAPS docs-coverage gap(s) waived by PR body ('No docs update needed:')."
            exit 0
          fi
          echo "::error::$GAPS mapped docs page(s) not updated for changed source (see the docs-coverage PR comment)."
          echo "Update the page(s), or add a line starting 'No docs update needed: <reason>' to the PR body."
          echo "See CONTRIBUTING.md > Style for the source↔docs mapping."
          exit 1
