name: Implement ready-for-agent issues

# Implements a triaged `ready-for-agent` issue test-first and opens its PR.
#
# PRODUCE / POST split. The Claude step is a PRODUCER: it grounds itself in the
# repo, implements the acceptance criteria via the `/tdd` skill, commits LOCALLY
# on the implementation branch, and runs the full CI gate — but it makes ZERO
# GitHub mutations and NEVER pushes. It cannot: the checkout sets
# `persist-credentials: false` (no pushable git remote) and the producer step is
# NOT given GH_TOKEN (its `gh` is unauthenticated). The agent's entire GitHub
# output is files under `.impl/`: the raw PR body (`pr-body.md`, written with the
# Write tool as verbatim bytes — real newlines, no backslash escapes) and a
# scalars-only `manifest.json`. If it must escalate (a CLOSED decision, blocked,
# out of scope) it writes the escalation comment body to a file and flags it in
# the manifest, committing nothing it can't stand behind.
#
# A separate deterministic POSTER step owns ALL GitHub mutation. It reads the
# manifest and: on escalation, posts the comment + flips the issue to
# ready-for-human (no push); otherwise it pushes the branch (plain, never force,
# never to main), creates the PR from the raw body file (`--body-file`, so the
# body can't be corrupted by shell quoting), then transitions the issue
# (in-progress / -ready-for-agent) and comments the new PR URL. The ordering —
# push -> create PR -> transition issue — is forced by the data: the PR needs the
# pushed branch, and the issue comment needs the created PR's URL.
#
# Mechanical work (push, PR creation, issue state, JSON/body encoding) leaves the
# agent; only judgment (what to build, how to slice it, the commits, the body
# prose) stays with it.

on:
  issues:
    types: [labeled]
  # Manual trigger, e.g. for testing against an existing ready-for-agent issue.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
        type: string

concurrency:
  group: implement-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    # Only when the `do:implement` kickoff trigger lands (or a manual dispatch).
    # The old `ready-for-agent` status-trigger has been retired (Phase 4): the
    # split is complete — `issue:ready-agent` is pure backlog status that never
    # triggers anything, and `do:implement` is the explicit kickoff (ADR-0030).
    # Marking issues `issue:ready-agent` no longer spawns agents; a maintainer
    # kicks the ones they want with `do:implement`. We intentionally do NOT filter
    # by actor here (label-add requires write access, which gates the trigger).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'do:implement')
    runs-on: ubuntu-latest
    # Same isolated secrets env as triage (APP_ID / APP_PRIVATE_KEY / CLAUDE_CODE_OAUTH_TOKEN).
    environment: automation
    timeout-minutes: 45
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
      BRANCH: agent/issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      # First step: monitor egress from this privileged job. It mints an App
      # token with `contents: write` / `pull-requests: write` and runs the full
      # CI gate (untrusted postinstall scripts), so logging unexpected outbound
      # connections is worth it. Audit mode logs only — it never blocks.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Provision the LOCAL composite action (.github/actions/app-token) on disk
      # before the mints below use it. This default-ref checkout needs no token, and
      # MUST NOT persist one: the job's built-in token carries write scopes, and a
      # persisted credential here would survive into the producer's workspace and
      # defeat the working checkout's persist-credentials: false (the no-push boundary).
      - name: Checkout (provision local actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: scope the token to what this job does — push the branch,
          # comment/label the issue, open the PR — so a prompt-injection via untrusted
          # issue content can't wield the App's full installation grant. Only the
          # deterministic poster step is given this token; the producer never sees it.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Kept as a SEPARATE mint from the write token above — the write/read-only
      # split is the security boundary, never merged into one token.
      - name: Generate a READ-ONLY GitHub App token for the producer
        id: app-token-ro
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # The producer (claude-code-action) gets THIS token, not the write one.
          # claude-code-action's `github_token` is optional and, if omitted, falls
          # back to the workflow's built-in `github.token` — which carries this job's
          # contents/pull-requests WRITE scopes — and wires it into the agent's
          # git/gh auth, which can override `persist-credentials: false`. So we hand
          # the agent an explicitly READ-ONLY App token: even if the action sets up
          # git/gh for it, it cannot push, open PRs, or mutate anything. The write
          # token stays with the deterministic poster step only.
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Check if implementation already started
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Namespaced issue: status helpers (ADR-0029) — lifecycle-status.sh is on
          # disk from the actions-provisioning checkout above.
          source .github/scripts/lifecycle-status.sh
          # Consume the do:implement trigger up front: it fired this job, so remove it
          # now (like triage consumes do:triage and rebase consumes its trigger when the
          # job runs) so it can be re-applied to re-kick.
          gh issue edit "$ISSUE_NUMBER" --remove-label do:implement >/dev/null 2>&1 || true
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          prs=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')
          if echo "$labels" | grep -qx 'issue:in-progress' || [ "${prs:-0}" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Implementation already in progress for #$ISSUE_NUMBER (in-progress label or open PR on $BRANCH); skipping."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            # ADR-0030 start/stop labelling contract: ON START, set the in-progress
            # status (and clear issue:ready-agent). Until now this flip lived only in
            # the poster step at the very end, so for the entire 30–45 min implement
            # run the issue still read issue:ready-agent — and a run that died before
            # the poster (agent crash, local CI never green, poster error) never set
            # it at all. Set it here, where work actually begins; the poster's final
            # set_issue_status reasserts it once the PR is open.
            set_issue_status "$ISSUE_NUMBER" in-progress
            echo "Marked #$ISSUE_NUMBER issue:in-progress (work started)."
          fi

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # ENFORCED no-push: do NOT persist any credentials in the local git
          # config. The agent can commit locally but has no authenticated remote
          # to push to — pushing is exclusively the deterministic poster's job,
          # which sets up a one-shot push credential from GH_TOKEN.
          persist-credentials: false
          fetch-depth: 0

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        run: bash .github/scripts/git-identity.sh

      - name: Create the implementation branch
        if: steps.gate.outputs.proceed == 'true'
        # Create the branch deterministically (off the checked-out main) so the
        # agent commits onto a correctly-named branch without running git
        # plumbing or needing to know the convention.
        run: git checkout -B "$BRANCH"

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.gate.outputs.proceed == 'true'

      # Precompute every GitHub input the producer needs and write it under
      # .impl-context/, so the agent runs NO gh — it reads files and writes files.
      # The acceptance criteria live in the triage comment, so we fetch title,
      # body, AND comments. This step has GH_TOKEN; the producer step deliberately
      # does not.
      - name: Build implementation context (issue title, body, comments)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .impl-context
          {
            gh issue view "$ISSUE_NUMBER" --json title,body,comments --jq '
              "# " + .title + "\n\n" + (.body // "") + "\n\n" +
              "## Comments (the triage comment holds the acceptance criteria)\n\n" +
              ([.comments[] | "### @" + .author.login + "\n\n" + (.body // "")] | join("\n\n---\n\n"))
            '
          } > .impl-context/issue.md
          echo "Context built:"; wc -l .impl-context/issue.md || true

      - name: Implement the issue (produce files, push nothing, mutate nothing)
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@428971d2ecd6e3a7cb0ee0da2a3a8b33fdb3678d # v1.0.157
        # Deliberately NO GH_TOKEN in this step's env: the agent's `gh` is
        # unauthenticated and cannot mutate GitHub, and the checkout persisted no
        # push credential, so it cannot push either. The poster owns both.
        env:
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Hand the agent the READ-ONLY App token explicitly. `github_token` is
          # optional and omitting it falls back to the WRITE-capable built-in
          # `github.token` — which the action would wire into the agent's git/gh
          # auth, defeating the no-push intent. With a read-only token, any auth the
          # action sets up for the agent cannot push or mutate.
          github_token: ${{ steps.app-token-ro.outputs.token }}
          # This workflow is triggered by the `do:implement` label (applied by a
          # maintainer or, on a chained kickoff, the App), so the labeling actor may
          # be a bot. claude-code-action blocks bot actors by default; allow
          # only our own App (never '*' — on a public repo that lets external Apps
          # invoke Claude with prompts they control).
          allowed_bots: "smonn[bot]"
          # The red/green methodology lives in the project `tdd` skill
          # (.claude/skills/tdd), invoked via `/tdd` in the prompt; `Skill` is in
          # allowedTools so it can chain to `/codebase-design`. This prompt keeps only
          # the repo-specific scaffolding the skill doesn't carry (the full CI gate,
          # changesets, the .impl/ producer output, escalation). PR creation, the
          # push, and the issue-state transition are NOT here — the poster owns them.
          # Implementation is turn-heavy; Sonnet keeps subscription usage in check,
          # bump to opus if quality needs it. The /tdd skill spends several turns
          # per red→green→refactor cycle, so a multi-slice issue needs generous
          # headroom — keep issues small AND give the loop room to finish.
          claude_args: |
            --max-turns 150
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite,Skill"
          prompt: |
            You are the implementation agent for `@smonn/ids`, a TypeScript library
            for encoding and decoding sortable IDs, running headless in CI. Implement
            the work specified by issue #${{ env.ISSUE_NUMBER }} in
            ${{ github.repository }}, which has been triaged `issue:ready-agent`.

            You are a PRODUCER ONLY. You have NO authenticated GitHub access and you
            CANNOT push: `gh` is unauthenticated (do not call it) and the checkout
            persisted no push credential. Do NOT run `git push`, do NOT open a PR, do
            NOT label or comment on the issue. A later deterministic step reads the
            files you write under `.impl/` and performs every GitHub mutation (push,
            PR creation, issue-state transition). Your job is to implement, commit
            LOCALLY, and write those files.

            The branch `agent/issue-${{ env.ISSUE_NUMBER }}` has already been created
            and checked out for you off the current `main`; commit onto it. Do not
            rename it or create another branch.

            1. Read the issue and its triage comment from the precomputed file
               `.impl-context/issue.md` — it contains the issue title, body, and all
               comments. The triage comment holds the acceptance criteria you must
               satisfy. Do NOT call `gh` to fetch the issue; read this file.
            2. Ground yourself in the codebase before changing anything: CONTEXT.md
               (domain glossary + CLOSED design decisions), docs/adr/, AGENTS.md,
               CONTRIBUTING.md, and the relevant files under src/.
            3. Implement the acceptance criteria using the repo's `tdd` skill — invoke
               it with `/tdd`. It owns the red→green→refactor loop (vertical slices,
               one failing test → minimal code → repeat) and the testing standards.
               Because you are headless, do NOT pause for the skill's interactive
               approval steps — proceed on the acceptance criteria as the agreed spec.
               Run the suite with `pnpm test`. Hard rules that override anything:
               - NEVER weaken, delete, or skip tests just to get green.
               - Limit doc edits (README / CONTEXT.md / ADR) to what the acceptance
                 criteria require AND to behavior THIS PR actually implements. Do NOT
                 copy tables, examples, or sections out of an ADR or CONTEXT.md that
                 describe behavior a sibling/blocked issue will ship — pre-documenting
                 unshipped behavior is a scope violation. Adding a new export to the
                 README API-surface list is fine; documenting how it behaves is not,
                 until the PR that ships that behavior. Respect any `Out of scope`
                 fence in the issue.
               - NEVER touch a CLOSED design decision (brand format, payload byte
                 layout, canonical `is()`, monotonicity, custom epoch, Opaque key
                 behavior, or wire-indistinguishable codec variants). If the task
                 genuinely requires reopening one, take the ESCALATION path below
                 instead of implementing — do NOT commit a change, and do NOT write a
                 PR body.
               - NEVER create or modify a GitHub Actions workflow file under
                 `.github/workflows/`. The poster's token deliberately lacks the
                 `workflows` permission (least-privilege), so a push that touches one is
                 rejected by GitHub and the PR can never open. If the acceptance criteria
                 require adding or editing a `.github/workflows/*` file, take the
                 ESCALATION path below instead of implementing — do NOT commit the change
                 and do NOT write a PR body; a human must make the workflow edit. (Other
                 files under `.github/`, e.g. actions or scripts, are fine.)
               - FROZEN WIRE ORACLE: `spec/vectors.json` and `SPEC.md` are the frozen wire
                 oracle. A failing vector assertion means the CODE drifted from the frozen
                 wire format — fix the code; NEVER edit `spec/vectors.json` or `SPEC.md` to
                 match the implementation's output (that silently un-freezes the contract
                 over a wire break). If the acceptance criteria would require changing
                 `spec/vectors.json` or `SPEC.md`, take the ESCALATION path below instead
                 of implementing — do NOT commit the change and do NOT write a PR body; a
                 human owns spec edits.
            4. Make the FULL CI gate pass locally before finishing, exactly as
               ci.yml runs it (use `pnpm lint:fix` / `pnpm fmt` to auto-resolve):
               `pnpm lint` && `pnpm depcruise` && `pnpm fmt:check` && `pnpm typecheck`
               && `pnpm test:coverage` && `pnpm build`. All must pass.
            5. If the change is user-visible (public API, CLI behavior, wire format, or
               otherwise release-note-worthy), add a changeset at
               `.changeset/<slug>.md`:

                   ---
                   "@smonn/ids": patch
                   ---

                   One-line summary of the change.

               Use `minor` for additive API; `patch` for fixes. Docs-only or
               purely-internal changes need NO changeset.
            6. Commit your work LOCALLY with a clear conventional-commit message
               (`git add` + `git commit`). Make as many commits as the slices
               warrant. Do NOT push — you cannot, and the poster does it.

            7. Write the PRODUCER OUTPUT under a `.impl/` directory. Author every
               body file with the Write tool, which writes bytes verbatim: use REAL
               newlines (press enter), never the characters backslash-n, and never
               backslash-escape markdown metacharacters (`<`, `>`, `[`, `]`,
               backtick) — write them as plain characters; GitHub renders them. A
               literal backslash-n or backslash-`<` in a body is a bug. You never
               touch JSON escaping or `gh`; the poster does.

               On the NORMAL (implemented) path, write:
               - `.impl/pr-body.md` — the raw PR description. Fill in the repository
                 PR template (.github/pull_request_template.md). The body MUST contain
                 `Closes #${{ env.ISSUE_NUMBER }}`, the test-plan checklist with the
                 commands you actually ran checked, and the impact checklist. Do NOT
                 request reviewers, approve, or merge — a human does that.
               - `.impl/manifest.json` — scalars ONLY (no prose; nothing to escape):

                     {
                       "issue_number": ${{ env.ISSUE_NUMBER }},
                       "branch": "agent/issue-${{ env.ISSUE_NUMBER }}",
                       "escalate": false,
                       "pr_title": "<conventional-commit-style PR title, e.g. 'feat: …'>"
                     }

                 Derive `pr_title` as a single concise conventional-commit subject
                 line summarizing the change (the poster uses it verbatim as the PR
                 title).

               On the ESCALATION path (a CLOSED decision must be reopened, the issue
               is blocked, or it cannot be implemented in scope), do NOT commit an
               implementation and do NOT write `pr-body.md`. Instead write:
               - `.impl/escalation.md` — the issue comment body explaining, for a
                 human, exactly why you are stopping (which CLOSED decision / blocker /
                 scope problem, and what is needed to proceed). Raw markdown, verbatim.
               - `.impl/manifest.json` — scalars ONLY:

                     {
                       "issue_number": ${{ env.ISSUE_NUMBER }},
                       "branch": "agent/issue-${{ env.ISSUE_NUMBER }}",
                       "escalate": true,
                       "escalate_reason": "<one-line reason>",
                       "escalate_body_file": "escalation.md"
                     }

                 The poster will post `escalation.md` as an issue comment and flip the
                 issue to `ready-for-human`; it will NOT push and will NOT open a PR.

            Always write `.impl/manifest.json` — it is how the poster knows what you
            did. Keep the change minimal and scoped strictly to the acceptance
            criteria. If you spot an adjacent improvement, a pre-existing bug, or a
            tempting refactor that the acceptance criteria did not ask for, do NOT
            fold it into this PR — file a follow-up issue for it. You cannot call
            `gh`, so record any such follow-up as a short section at the END of
            `.impl/pr-body.md` (titled "Follow-ups") naming what should be filed; a
            human files it. Keep this PR honed to its scope.

      # Deterministic poster: read the producer's .impl/ files and perform every
      # GitHub mutation. It alone gets GH_TOKEN and sets up a one-shot push
      # credential. Ordering is forced by the data: push (the PR needs the branch)
      # -> create PR (the issue comment needs its URL) -> transition the issue.
      # The PR body is posted with --body-file so shell quoting can't corrupt it.
      - name: Post results (push, open PR, transition issue — or escalate)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/scripts/poster-lib.sh
          # Namespaced issue: status helpers (ADR-0029); authoritative since Phase 4.
          source .github/scripts/lifecycle-status.sh
          require_manifest .impl

          issue=$(jq -r '.issue_number' .impl/manifest.json)
          branch=$(jq -r '.branch' .impl/manifest.json)
          escalate=$(jq -r '.escalate // false' .impl/manifest.json)
          : "${issue:?missing issue_number}" "${branch:?missing branch}"

          # ESCALATION: post the comment, flip to ready-for-human, push nothing, stop.
          if [ "$escalate" = "true" ]; then
            body_file=$(jq -r '.escalate_body_file // "escalation.md"' .impl/manifest.json)
            test -f ".impl/$body_file" || { echo "::error::escalation flagged but .impl/$body_file is missing"; exit 1; }
            echo "Escalating #$issue to a human (reason: $(jq -r '.escalate_reason // "unspecified"' .impl/manifest.json))."
            gh issue comment "$issue" --body-file ".impl/$body_file"
            set_issue_status "$issue" ready-for-human
            echo "✓ Posted escalation comment and flipped #$issue to issue:ready-human; no PR opened."
            exit 0
          fi

          # NORMAL path. Require the producer's PR body and a non-empty local branch.
          test -f .impl/pr-body.md || { echo "::error::no escalation, but .impl/pr-body.md is missing — nothing to open a PR from"; exit 1; }
          title=$(jq -r '.pr_title // empty' .impl/manifest.json)
          [ -n "$title" ] || { echo "::error::manifest.json has no pr_title"; exit 1; }
          # The branch must carry commits ahead of origin/main; an empty branch means
          # the producer implemented nothing.
          if [ "$(git rev-list --count "origin/main..$branch" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "::error::branch $branch has no commits ahead of origin/main — the producer committed nothing."
            exit 1
          fi

          # WORKFLOW-FILE GUARD: the token deliberately lacks the `workflows` permission
          # (least-privilege — a prompt-injected agent must not rewrite CI), so GitHub
          # rejects any push that creates or modifies a .github/workflows/ file. The
          # producer is told to escalate rather than touch one, but enforce it
          # deterministically here too: if the commits touch a workflow file, escalate to
          # a human instead of attempting the (doomed) push, so the issue lands as
          # ready-for-human rather than failing the job opaquely.
          wf_changes=$(git diff --name-only "origin/main..$branch" -- '.github/workflows/')
          if [ -n "$wf_changes" ]; then
            {
              printf '> *This was generated by AI during implementation.*\n\n'
              printf 'I implemented this issue but the change modifies GitHub Actions '
              printf 'workflow files:\n\n'
              printf '%s\n' "$wf_changes" | sed 's/^/- `/; s/$/`/'
              printf '\nThe automation App token intentionally lacks the `workflows` '
              printf 'permission (least-privilege), so GitHub rejects any push that '
              printf 'touches `.github/workflows/`. I did not push and opened no PR. A '
              printf 'maintainer needs to apply the workflow change by hand. Flipping '
              printf 'this to `ready-for-human`.\n'
            } > .impl/workflow-escalation.md
            echo "Escalating #$issue: commits touch .github/workflows/ (token lacks workflows permission)."
            gh issue comment "$issue" --body-file .impl/workflow-escalation.md
            set_issue_status "$issue" ready-for-human
            echo "✓ Posted workflow-escalation comment and flipped #$issue to issue:ready-human; no push, no PR."
            exit 0
          fi

          # 1) Push the branch with a one-shot credential built from GH_TOKEN. Plain
          #    push (NEVER --force), to the implementation branch (NEVER main). The
          #    URL embeds the token; redirect output so it never reaches the log.
          echo "Pushing $branch…"
          push_branch "$branch"
          echo "✓ Pushed $branch."

          # 2) Create the PR from the raw body file (no shell-quoted body).
          pr_url=$(gh pr create --base main --head "$branch" --title "$title" --body-file .impl/pr-body.md)
          echo "✓ Opened PR: $pr_url"

          # 3) Reassert in-progress (set on start by the gate) and link the PR
          #    (URL now known). The reassert defends the final state against any
          #    intermediate label edit; it is a no-op on the normal path.
          set_issue_status "$issue" in-progress
          gh issue comment "$issue" --body "Implementation opened as $pr_url"
          echo "✓ Issue #$issue is issue:in-progress and the PR is linked."

      # Backstop against a "hollow success": the poster either creates the PR (or
      # escalates) or fails loudly, so this only re-checks the end state. Require an
      # open PR on the branch, or a legitimate escalation (ready-for-human /
      # needs-info). Otherwise fail.
      - name: Verify a PR was opened (or the agent escalated)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qxE 'issue:ready-human|issue:needs-info'; then
            echo "✓ Agent escalated #$ISSUE_NUMBER to a human / needs-info; no PR expected."
            exit 0
          fi
          count=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')
          if [ "${count:-0}" -gt 0 ]; then
            echo "✓ PR opened for #$ISSUE_NUMBER:"
            gh pr list --state open --head "$BRANCH" --json url --jq '.[].url'
          else
            echo "::error::No open PR on $BRANCH and no escalation label — implementation did not complete. Check the run log."
            exit 1
          fi
