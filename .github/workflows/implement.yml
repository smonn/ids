name: Implement ready-for-agent issues

on:
  issues:
    types: [labeled]
  # Manual trigger, e.g. for testing against an existing ready-for-agent issue.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
        type: string

concurrency:
  group: implement-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    # Only when the `ready-for-agent` label is added (or a manual dispatch). The
    # triage workflow applies that label as the App, which is what chains into
    # this workflow. We intentionally do NOT filter by actor here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ready-for-agent')
    runs-on: ubuntu-latest
    # Same isolated secrets env as triage (APP_ID / APP_PRIVATE_KEY / CLAUDE_CODE_OAUTH_TOKEN).
    environment: automation
    timeout-minutes: 45
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
      BRANCH: agent/issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check if implementation already started
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          prs=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')
          if echo "$labels" | grep -qx 'in-progress' || [ "${prs:-0}" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Implementation already in progress for #$ISSUE_NUMBER (in-progress label or open PR on $BRANCH); skipping."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Persist the App token so the agent can push the implementation branch.
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "smonn[bot]"
          git config user.email "110314539+smonn[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.proceed == 'true'

      - name: Implement the issue
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # This workflow is triggered by the App applying `ready-for-agent`, so the
          # actor is a bot. claude-code-action blocks bot actors by default; allow
          # only our own App (never '*' — on a public repo that lets external Apps
          # invoke Claude with prompts they control).
          allowed_bots: "smonn[bot]"
          # The red/green methodology lives in the project `tdd` skill
          # (.claude/skills/tdd), invoked via `/tdd` in the prompt; `Skill` is in
          # allowedTools so it can chain to `/codebase-design`. This prompt keeps only
          # the repo-specific scaffolding the skill doesn't carry (branch naming, the
          # full CI gate, changesets, PR creation, issue-state transition, escalation).
          # Implementation is turn-heavy; Sonnet keeps subscription usage in check,
          # bump to opus if quality needs it. The /tdd skill spends several turns
          # per red→green→refactor cycle, so a multi-slice issue needs generous
          # headroom — keep issues small AND give the loop room to finish.
          claude_args: |
            --max-turns 150
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite,Skill"
          prompt: |
            You are the implementation agent for `@smonn/ids`, a TypeScript library
            for encoding and decoding sortable IDs, running headless in CI. Implement
            the work specified by issue #${{ env.ISSUE_NUMBER }} in
            ${{ github.repository }}, which has been triaged `ready-for-agent`.

            An authenticated `gh` CLI is available (GH_TOKEN / GH_REPO are set), and
            git is authenticated to push to this repository. The default branch `main`
            is checked out.

            1. Read the issue and its triage comment — the triage comment holds the
               acceptance criteria you must satisfy:
               `gh issue view ${{ env.ISSUE_NUMBER }} --json title,body,comments`.
            2. Ground yourself in the codebase before changing anything: CONTEXT.md
               (domain glossary + CLOSED design decisions), docs/adr/, AGENTS.md,
               CONTRIBUTING.md, and the relevant files under src/.
            3. Create a branch named EXACTLY `agent/issue-${{ env.ISSUE_NUMBER }}` off
               the current main.
            4. Implement the acceptance criteria using the repo's `tdd` skill — invoke
               it with `/tdd`. It owns the red→green→refactor loop (vertical slices,
               one failing test → minimal code → repeat) and the testing standards.
               Because you are headless, do NOT pause for the skill's interactive
               approval steps — proceed on the acceptance criteria as the agreed spec.
               Run the suite with `pnpm test`. Hard rules that override anything:
               - NEVER weaken, delete, or skip tests just to get green.
               - Limit doc edits (README / CONTEXT.md / ADR) to what the acceptance
                 criteria require AND to behavior THIS PR actually implements. Do NOT
                 copy tables, examples, or sections out of an ADR or CONTEXT.md that
                 describe behavior a sibling/blocked issue will ship — pre-documenting
                 unshipped behavior is a scope violation. Adding a new export to the
                 README API-surface list is fine; documenting how it behaves is not,
                 until the PR that ships that behavior. Respect any `Out of scope`
                 fence in the issue.
               - NEVER touch a CLOSED design decision (brand format, payload byte
                 layout, canonical `is()`, monotonicity, custom epoch, Opaque key
                 behavior, or wire-indistinguishable codec variants). If the task
                 genuinely requires reopening one, STOP: comment on the issue
                 explaining why, run `gh issue edit ${{ env.ISSUE_NUMBER }} --add-label
                 ready-for-human --remove-label ready-for-agent`, and do NOT open a PR.
            5. Make the FULL CI gate pass locally before opening a PR, exactly as
               ci.yml runs it (use `pnpm lint:fix` / `pnpm fmt` to auto-resolve):
               `pnpm lint` && `pnpm depcruise` && `pnpm fmt:check` && `pnpm typecheck`
               && `pnpm test:coverage` && `pnpm build`. All must pass.
            6. If the change is user-visible (public API, CLI behavior, wire format, or
               otherwise release-note-worthy), add a changeset at
               `.changeset/<slug>.md`:

                   ---
                   "@smonn/ids": patch
                   ---

                   One-line summary of the change.

               Use `minor` for additive API; `patch` for fixes. Docs-only or
               purely-internal changes need NO changeset.
            7. Commit with a clear conventional-commit message, then push:
               `git push -u origin agent/issue-${{ env.ISSUE_NUMBER }}`.
            8. Open a pull request. Author the PR body with the Write tool to a file
               (e.g. `pr-body.md`) — real newlines, plain characters, never backslash
               escapes (`\n`, `\<`, `\[`) or escaped markdown metacharacters — then pass
               that file: `gh pr create --base main --head agent/issue-${{ env.ISSUE_NUMBER }} --body-file pr-body.md`.
               Do not build the body as a `--body "..."` string argument. Fill in the
               repository PR template (.github/pull_request_template.md). The body MUST
               contain `Closes #${{ env.ISSUE_NUMBER }}`, the test-plan checklist with the
               commands you actually ran checked, and the impact checklist. Do NOT request
               reviewers, approve, or merge — a human does that.
            9. Finally, transition the issue state and link the PR:
               `gh issue edit ${{ env.ISSUE_NUMBER }} --add-label in-progress
               --remove-label ready-for-agent`, then post a brief issue comment with
               the PR URL.

            Keep the change minimal and scoped strictly to the acceptance criteria.
            Do NOT push to main directly. A human reviews and merges the PR.

      # Catch the "hollow success" case: the agent can exit 0 without opening a PR.
      # Require either an open PR on the branch, or a legitimate escalation
      # (ready-for-human / needs-info). Otherwise fail loudly.
      - name: Verify a PR was opened (or the agent escalated)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qxE 'ready-for-human|needs-info'; then
            echo "✓ Agent escalated #$ISSUE_NUMBER to a human / needs-info; no PR expected."
            exit 0
          fi
          count=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')
          if [ "${count:-0}" -gt 0 ]; then
            echo "✓ PR opened for #$ISSUE_NUMBER:"
            gh pr list --state open --head "$BRANCH" --json url --jq '.[].url'
          else
            echo "::error::No open PR on $BRANCH and no escalation label — implementation did not complete. Check the run log."
            exit 1
          fi
