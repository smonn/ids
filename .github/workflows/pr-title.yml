name: PR title

on:
  pull_request:
    # `synchronize` re-runs the check on every pushed commit so the result is
    # present on the head SHA — required for this to work as a branch-protection
    # required check.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title is Conventional Commits
        env:
          # PR title becomes the squash-merge commit subject on main.
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Changesets opens its release PR from this branch with the fixed
          # title "Version Packages", which is intentionally not Conventional
          # Commits. The release workflow squash-merges it, so exempt it here.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == "changeset-release/main" ]]; then
            echo "Changesets release PR ($HEAD_REF); skipping title check."
            exit 0
          fi
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title is not a valid Conventional Commits subject: \"$PR_TITLE\""
            echo "Expected: <type>(<optional scope>): <what changed>"
            echo "  e.g. 'feat(id): tighten is() to canonical-only'"
            echo "Allowed types: feat, fix, docs, refactor, perf, test, build, ci, chore, revert"
            echo "See CONTRIBUTING.md > Style."
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
