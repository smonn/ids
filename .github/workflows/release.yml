name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # First step: monitor egress from this privileged job. It publishes to npm
      # and holds an id-token, so an unexpected outbound connection (e.g. a
      # malicious postinstall) is worth detecting. Audit mode logs only — it
      # never blocks — so it cannot break the release.
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org
          install: "false"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Round out supply-chain transparency alongside npm provenance: on every
      # publish (not on release-PR-only runs), generate a CycloneDX SBOM and
      # attach it to each published package's GitHub release. Uploaded with the
      # runner's gh CLI, so no new SHA-pinned action is introduced.
      - name: Generate and attach CycloneDX SBOM
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          # cdxgen reads pnpm-lock.yaml directly, so the SBOM is built natively
          # from the pnpm workspace — no throwaway npm lockfile to derive (npm's
          # --package-lock-only chokes on pnpm's symlinked node_modules). Run via
          # `pnpm dlx` to keep the whole step on the pnpm toolchain.
          echo "$PUBLISHED_PACKAGES" | jq -c '.[]' | while read -r pkg; do
            name=$(echo "$pkg" | jq -r '.name')
            version=$(echo "$pkg" | jq -r '.version')
            slug=$(echo "${name}" | tr '/@' '--' | sed 's/^-//')
            sbom="${slug}-${version}.cdx.json"
            pnpm dlx @cyclonedx/cdxgen@^11 \
              --type pnpm \
              --spec-version 1.6 \
              --output "$sbom" \
              .
            gh release upload "${name}@${version}" "$sbom" --clobber --repo "${{ github.repository }}"
          done
