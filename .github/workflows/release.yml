name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Default the workflow's GITHUB_TOKEN to no permissions; the release job below
# declares exactly what it needs, and a future job added without a permissions:
# block inherits nothing instead of the repo default.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      # First step: monitor egress from this privileged job. It publishes to npm
      # and holds an id-token, so an unexpected outbound connection (e.g. a
      # malicious postinstall) is worth detecting. Audit mode logs only — it
      # never blocks — so it cannot break the release.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org
          install: "false"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Round out supply-chain transparency alongside npm provenance: on every
      # publish (not on release-PR-only runs), generate a CycloneDX SBOM for the
      # workspace and bind it to the published package as a signed SBOM
      # attestation. Attestations (not release assets) are used because the
      # repo's releases are immutable and reject post-publish asset uploads.
      - name: Generate CycloneDX SBOM
        id: sbom
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          # cdxgen reads pnpm-lock.yaml directly, so the SBOM is built natively
          # from the pnpm workspace — no throwaway npm lockfile to derive (npm's
          # --package-lock-only chokes on pnpm's symlinked node_modules). cdxgen is
          # an exact-version devDependency (lockfile-pinned, cooldown-covered), so
          # this runs the already-installed binary via the `sbom:generate`
          # script — no floating, network-fetched tool in this privileged job.
          # The cdxgen invocation lives in package.json so it's runnable and
          # pinned in one place. (Named `sbom:generate`, not `sbom`, to avoid
          # pnpm v11's built-in `pnpm sbom` subcommand shadowing the script.)
          pnpm sbom:generate
          # Pack the published package as the attestation subject. pnpm pack is
          # deterministic from the built dist/, so this tarball matches the one
          # published to npm and its digest lines up with the provenance subject.
          # pnpm prints the tarball path on the last line of stdout.
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.sbom.outputs.tarball }}
          sbom-path: sbom.cdx.json
