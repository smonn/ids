name: Address PR review feedback

# Apply the `address-feedback` label to an agent PR and the agent reads the human
# review feedback (reviews + inline review threads) and addresses it. Triggering on
# a label — like rebase.yml and review.yml — means a maintainer reviews in the normal
# way (inline comments, a summary review) and then applies one label to say "go act
# on this", with no special @-mention comment required. The label is removed at the
# start of the run so it can be re-applied to trigger again.
#
# Labels can only be applied by users with write access, so the trigger is implicitly
# maintainer-gated. The job still checks out and executes the PR branch's code, so it
# is restricted to same-repo agent/issue-* branches — a forked PR can never run
# attacker-controlled code with our secrets.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: address-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  address:
    # Only the `address-feedback` label, on an OPEN same-repo agent branch.
    if: >-
      github.event.label.name == 'address-feedback' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # head.ref is PR-author-controlled; only ever used through this env var in
      # run: steps (never interpolated into a shell) so a crafted branch name can't
      # inject. The startsWith gate above also constrains it to agent/issue-*.
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # Pin the checkout to the commit that carried the label, not the moving branch
      # ref, to close the TOCTOU window.
      EVENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: scope the minted token to exactly what this job does —
          # push fixes, reply on review threads, file follow-up issues, toggle labels —
          # so a prompt-injection via untrusted PR/review content can't wield the App's
          # full installation grant.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Cost guard: the review → address-feedback → address-review → push → review
      # cycle is entirely bot-driven once started (review.yml auto-applies
      # address-feedback on hard findings; the fix push re-fires review.yml via its
      # synchronize trigger). Cap the consecutive BOT-driven rounds so a reviewer that keeps
      # flagging the same point can't loop forever — mirrors autofix.yml's MAX_ATTEMPTS.
      # A human applying the label breaks the cycle and resets the counter, and an
      # already-escalated PR is skipped.
      #
      # The round count lives in an `auto-round-N` label on the PR (defined in labels.yml),
      # NOT a hidden comment — a body-only `<!-- ... -->` comment still renders as a blank
      # bubble in the timeline. A label keeps the conversation clean and lets a maintainer
      # RESET the counter by simply removing the `auto-round-N` label in the PR sidebar.
      - name: Guard against runaway auto-address loops
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          # Keep in step with the auto-round-* labels defined in labels.yml.
          MAX_AUTO_ROUNDS: "3"
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx 'needs-human'; then
            echo "PR #$PR_NUMBER already escalated to needs-human; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Read the current round from the lone auto-round-N label (0 if none present).
          round_label=$(echo "$labels" | grep -oE '^auto-round-[0-9]+$' | head -n1)
          count=0
          [ -n "$round_label" ] && count=${round_label#auto-round-}
          if [ "$SENDER" != "smonn[bot]" ]; then
            # A human applied the label — a fresh, human-driven request the cap must not
            # interfere with. Clear any stale round label from a prior auto-loop and proceed.
            echo "Human ($SENDER) applied address-feedback; resetting the round counter."
            [ -n "$round_label" ] && gh pr edit "$PR_NUMBER" --remove-label "$round_label" || true
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bot-driven round (review.yml re-applied the label): enforce the cap.
          if [ "$count" -ge "$MAX_AUTO_ROUNDS" ]; then
            echo "Auto-address round cap reached ($count/$MAX_AUTO_ROUNDS) — escalating instead of looping."
            gh pr comment "$PR_NUMBER" --body "The automated review-fix loop ran $count round(s) without converging. Escalating for human review."
            gh pr edit "$PR_NUMBER" --add-label needs-human
            [ -n "$round_label" ] && gh pr edit "$PR_NUMBER" --remove-label "$round_label" || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Advance the round: drop the old auto-round label (if any) and apply the next one.
          # The count is surfaced to humans via the label itself and the escalation comment.
          next=$((count + 1))
          [ -n "$round_label" ] && gh pr edit "$PR_NUMBER" --remove-label "$round_label" || true
          gh pr edit "$PR_NUMBER" --add-label "auto-round-$next"
          echo "Auto-address round $next of $MAX_AUTO_ROUNDS; proceeding."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Remove the address-feedback label (so it can be re-applied)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label address-feedback || true

      - name: Checkout the labelled commit (pinned SHA, not the branch ref)
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EVENT_SHA }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity and working branch
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "smonn[bot]"
          git config user.email "110314539+smonn[bot]@users.noreply.github.com"
          # We checked out a detached SHA; recreate the branch at it so we can push.
          git checkout -B "$BRANCH"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.proceed == 'true'

      - name: Address the feedback
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1.0.153
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The label may be applied by a maintainer (human) or our App.
          allowed_bots: "smonn[bot]"
          # Code/test changes go through the project `tdd` skill (.claude/skills/tdd),
          # invoked via `/tdd` in the prompt, so review fixes follow red→green→refactor
          # and the testing standards rather than ad-hoc edits; `Skill` is in allowedTools
          # so it can run (and chain to `/codebase-design`). The skill spends several
          # turns per cycle, and a review can carry many threads, so this needs the same
          # generous budget as implement.yml — keep --max-turns and timeout-minutes in
          # step with each other.
          claude_args: |
            --max-turns 150
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite,Skill"
          prompt: |
            A human applied the `address-feedback` label to pull request
            #${{ env.PR_NUMBER }} (branch `${{ env.BRANCH }}`) of ${{ github.repository }}
            to ask you to address their review feedback. The branch is checked out, `gh`
            is authenticated, and git can push.

            1. Read all the feedback: the PR's reviews and review threads
               (`gh pr view ${{ env.PR_NUMBER }} --json reviews,comments,title,body`,
               and `gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments`
               for inline review comments — record each comment's `id`, `path`, and
               `line`). Focus on the most recent human review.
            2. SCOPE RULE (applies to every point): a fix HONES this PR, it never
               extends it. Implement ONLY (a) defects in the lines/files this PR already
               changed and (b) missed or incorrect acceptance criteria from the
               originating issue. If addressing a point would GROW the diff beyond the
               issue's scope — a new file, a new capability, a new rule / abstraction,
               tests for code this PR didn't touch, or a broader refactor — do NOT
               implement it: file a follow-up issue and link it on the thread (per the
               OUT OF SCOPE path below). When in doubt, prefer a follow-up over expanding
               the diff. Honing changes (tightening, simplifying, removing, fixing this
               PR's own new code) are always fine.

               Address each in-scope actionable point as ITS OWN commit: make the change,
               then `git commit` it alone with a clear, scoped message (one fix per
               commit, so each maps to a single hash). Make the changes faithfully. For
               any point that changes behavior or needs new/changed tests, use the repo's `tdd`
               skill — invoke it with `/tdd` — so the fix follows red→green→refactor and
               the testing standards; you are headless, so do NOT pause for the skill's
               interactive approval steps, proceed on the review comment as the agreed
               spec. Trivial, non-behavioral edits (typos, comments, renames already
               covered by tests) do not need the skill. NEVER weaken,
               skip, or delete tests to satisfy a comment, and NEVER touch a CLOSED design
               decision (CONTEXT.md, docs/adr/). You do not have to implement every
               point — for each one you don't, pick the honest resolution:
                 - DISAGREE / unsafe / conflicts with a CLOSED decision: don't implement;
                   you'll explain your reasoning on the thread in step 5.
                 - OUT OF SCOPE but a legitimate improvement: file a follow-up issue with
                   `gh issue create` and capture its number. Structure the body to match the
                   matching repo issue form under `.github/ISSUE_TEMPLATE/`
                   (`feature_request.yml` for an enhancement/refactor, `bug_report.yml` for a
                   bug), filling each of its fields under the same headings — `gh issue
                   create` bypasses the web form, so a freeform body would not match what a
                   human submission produces and triage expects. Give it a clear,
                   conventional-commit-style title, link this PR #${{ env.PR_NUMBER }} and the
                   review thread in the body, and label it `needs-triage`. Don't file for
                   points you merely disagree with, or that are already covered by an existing
                   issue.
               Keep a map of {review comment id → commit sha | "declined: reason" |
               "follow-up: #N"}.
            3. With every fix committed, re-run the full CI gate exactly as ci.yml does:
               `pnpm lint`, `pnpm depcruise`, `pnpm fmt:check`, `pnpm typecheck`,
               `pnpm test:coverage`, `pnpm build`. Everything must pass — add follow-up
               commits until it does.
            4. Push to `${{ env.BRANCH }}` with a plain `git push` — NEVER force-push. If
               the push is rejected because the branch advanced past the labelled commit,
               stop and post a comment saying the branch moved and the request needs a
               re-run (re-apply the label), rather than forcing.
            5. Reply to the feedback IN-THREAD — do NOT post one big catch-all summary
               comment. ALWAYS author each reply body with the Write tool to a file
               (e.g. `reply.md`) and pass that file to `gh` — never build a reply inside
               a shell argument. Inline `-f body='...'` corrupts: it breaks on an
               apostrophe ("doesn't") and tempts you to backslash-escape markdown. In the
               file, use plain characters and real newlines; never emit `\n`, `\<`, `\[`,
               or other backslash escapes (GitHub renders raw markdown). For each inline
               review comment you acted on, reply on its own thread citing the commit
               that addressed it (use the pushed short SHA):
               `gh api -X POST repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments/<id>/replies -F body=@reply.md`
               For a point you declined, reply on its thread explaining why (no commit).
               For one you deferred, reply linking the follow-up issue, e.g. "Out of scope
               for this PR — filed #N to track." For feedback NOT anchored to an inline
               comment (a review summary or a plain PR comment), post a single concise
               top-level reply with `gh pr comment ${{ env.PR_NUMBER }} --body-file <file>`.
            6. RESOLVE each inline thread you FIXED so it collapses out of the
               conversation and the PR stays readable. Resolve ONLY threads you addressed
               with a commit — leave threads you declined or deferred OPEN so the
               maintainer can weigh in. Thread IDs are GraphQL node IDs (not the REST
               comment ids you replied to), so map and resolve via GraphQL: list the PR's
               review threads with each thread's id and its first comment's databaseId,
               then for every thread whose first comment matches an inline comment you
               fixed, call the resolve mutation:

                   gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{id isResolved comments(first:1){nodes{databaseId}}}}}}}' \
                     -F o=${{ github.repository_owner }} -F r=${{ github.event.repository.name }} -F n=${{ env.PR_NUMBER }}

                   gh api graphql -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' -F t=<THREAD_NODE_ID>

            Do NOT approve or merge the PR, and do NOT push to main. A human re-reviews.

      # No explicit re-review trigger is needed: when the fix push lands it advances the
      # PR head, and review.yml re-reviews automatically via its `synchronize` trigger
      # (deduped per commit). The push-skip path (branch advanced past EVENT_SHA) leaves
      # the head at EVENT_SHA with no new push — the agent already posted a comment and
      # stopped — so nothing fires, which is the intended behaviour. `needs-review` stays
      # available as the manual "re-review now" signal a maintainer can apply by hand.
