name: Address PR review feedback

# Apply the `address-feedback` label to an agent PR and the agent reads the human
# review feedback (reviews + inline review threads) and addresses it. Triggering on
# a label — like rebase.yml and review.yml — means a maintainer reviews in the normal
# way (inline comments, a summary review) and then applies one label to say "go act
# on this", with no special @-mention comment required. The label is removed at the
# start of the run so it can be re-applied to trigger again.
#
# Labels can only be applied by users with write access, so the trigger is implicitly
# maintainer-gated. The job still checks out and executes the PR branch's code, so it
# is restricted to same-repo agent/issue-* branches — a forked PR can never run
# attacker-controlled code with our secrets.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: address-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  address:
    # Only the `address-feedback` label, on an OPEN same-repo agent branch.
    if: >-
      github.event.label.name == 'address-feedback' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # head.ref is PR-author-controlled; only ever used through this env var in
      # run: steps (never interpolated into a shell) so a crafted branch name can't
      # inject. The startsWith gate above also constrains it to agent/issue-*.
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # Pin the checkout to the commit that carried the label, not the moving branch
      # ref, to close the TOCTOU window.
      EVENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Remove the address-feedback label (so it can be re-applied)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --remove-label address-feedback || true

      - name: Checkout the labelled commit (pinned SHA, not the branch ref)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.EVENT_SHA }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity and working branch
        run: |
          git config user.name "smonn[bot]"
          git config user.email "110314539+smonn[bot]@users.noreply.github.com"
          # We checked out a detached SHA; recreate the branch at it so we can push.
          git checkout -B "$BRANCH"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Address the feedback
        uses: anthropics/claude-code-action@51705da45eecce209d4700538bf8377d5b5fc695 # v1.0.152
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The label may be applied by a maintainer (human) or our App.
          allowed_bots: "smonn[bot]"
          # Code/test changes go through the project `tdd` skill (.claude/skills/tdd),
          # invoked via `/tdd` in the prompt, so review fixes follow red→green→refactor
          # and the testing standards rather than ad-hoc edits; `Skill` is in allowedTools
          # so it can run (and chain to `/codebase-design`). The skill spends several
          # turns per cycle, and a review can carry many threads, so this needs the same
          # generous budget as implement.yml — keep --max-turns and timeout-minutes in
          # step with each other.
          claude_args: |
            --max-turns 150
            --model claude-sonnet-4-6
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite,Skill"
          prompt: |
            A human applied the `address-feedback` label to pull request
            #${{ env.PR_NUMBER }} (branch `${{ env.BRANCH }}`) of ${{ github.repository }}
            to ask you to address their review feedback. The branch is checked out, `gh`
            is authenticated, and git can push.

            1. Read all the feedback: the PR's reviews and review threads
               (`gh pr view ${{ env.PR_NUMBER }} --json reviews,comments,title,body`,
               and `gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments`
               for inline review comments — record each comment's `id`, `path`, and
               `line`). Focus on the most recent human review.
            2. Address each actionable point as ITS OWN commit: make the change, then
               `git commit` it alone with a clear, scoped message (one fix per commit, so
               each maps to a single hash). Make the changes faithfully. For any point
               that changes behavior or needs new/changed tests, use the repo's `tdd`
               skill — invoke it with `/tdd` — so the fix follows red→green→refactor and
               the testing standards; you are headless, so do NOT pause for the skill's
               interactive approval steps, proceed on the review comment as the agreed
               spec. Trivial, non-behavioral edits (typos, comments, renames already
               covered by tests) do not need the skill. NEVER weaken,
               skip, or delete tests to satisfy a comment, and NEVER touch a CLOSED design
               decision (CONTEXT.md, docs/adr/). You do not have to implement every
               point — for each one you don't, pick the honest resolution:
                 - DISAGREE / unsafe / conflicts with a CLOSED decision: don't implement;
                   you'll explain your reasoning on the thread in step 5.
                 - OUT OF SCOPE but a legitimate improvement: file a follow-up issue with
                   `gh issue create` and capture its number. Structure the body to match the
                   matching repo issue form under `.github/ISSUE_TEMPLATE/`
                   (`feature_request.yml` for an enhancement/refactor, `bug_report.yml` for a
                   bug), filling each of its fields under the same headings — `gh issue
                   create` bypasses the web form, so a freeform body would not match what a
                   human submission produces and triage expects. Give it a clear,
                   conventional-commit-style title, link this PR #${{ env.PR_NUMBER }} and the
                   review thread in the body, and label it `needs-triage`. Don't file for
                   points you merely disagree with, or that are already covered by an existing
                   issue.
               Keep a map of {review comment id → commit sha | "declined: reason" |
               "follow-up: #N"}.
            3. With every fix committed, re-run the full CI gate exactly as ci.yml does:
               `pnpm lint`, `pnpm depcruise`, `pnpm fmt:check`, `pnpm typecheck`,
               `pnpm test:coverage`, `pnpm build`. Everything must pass — add follow-up
               commits until it does.
            4. Push to `${{ env.BRANCH }}` with a plain `git push` — NEVER force-push. If
               the push is rejected because the branch advanced past the labelled commit,
               stop and post a comment saying the branch moved and the request needs a
               re-run (re-apply the label), rather than forcing.
            5. Reply to the feedback IN-THREAD — do NOT post one big catch-all summary
               comment. ALWAYS author each reply body with the Write tool to a file
               (e.g. `reply.md`) and pass that file to `gh` — never build a reply inside
               a shell argument. Inline `-f body='...'` corrupts: it breaks on an
               apostrophe ("doesn't") and tempts you to backslash-escape markdown. In the
               file, use plain characters and real newlines; never emit `\n`, `\<`, `\[`,
               or other backslash escapes (GitHub renders raw markdown). For each inline
               review comment you acted on, reply on its own thread citing the commit
               that addressed it (use the pushed short SHA):
               `gh api -X POST repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/comments/<id>/replies -F body=@reply.md`
               For a point you declined, reply on its thread explaining why (no commit).
               For one you deferred, reply linking the follow-up issue, e.g. "Out of scope
               for this PR — filed #N to track." For feedback NOT anchored to an inline
               comment (a review summary or a plain PR comment), post a single concise
               top-level reply with `gh pr comment ${{ env.PR_NUMBER }} --body-file <file>`.

            Do NOT approve or merge the PR, and do NOT push to main. A human re-reviews.
