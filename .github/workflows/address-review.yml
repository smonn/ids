name: Address PR review feedback

# Apply the `do:address` label to an agent PR and the agent reads the human
# review feedback (reviews + inline review threads) and addresses it. Triggering on
# a label — like rebase.yml and review.yml — means a maintainer reviews in the normal
# way (inline comments, a summary review) and then applies one label to say "go act
# on this", with no special @-mention comment required. The label is removed at the
# start of the run so it can be re-applied to trigger again.
#
# Labels can only be applied by users with write access, so the trigger is implicitly
# maintainer-gated. The job still checks out and executes the PR branch's code, so it
# is restricted to same-repo agent/issue-* branches — a forked PR can never run
# attacker-controlled code with our secrets.
#
# PRODUCE / POST split with ENFORCED no-push (see .github/workflows/README.md "Producer /
# poster split" and "App token & the read/write security split"). This workflow's agent
# does two kinds of work and only one of them stays with it:
#   - JUDGMENT (stays): read the feedback, edit code via the `/tdd` skill, make one
#     LOCAL commit per fix with a good message, run the full CI gate, and decide each
#     point's resolution (fixed / declined / deferred + follow-up).
#   - MECHANICAL (moves to a deterministic poster): pushing the branch, posting the
#     in-thread replies, resolving the fixed threads, filing follow-up issues.
# The agent writes its output (raw reply/issue bodies + a scalars-only manifest) under
# `.address/` and makes ZERO GitHub mutations. The no-push is ENFORCED at the credential
# level — the checkout uses `persist-credentials: false` and the producer step gets NO
# `GH_TOKEN`, so its git has no push credential and its gh is unauthenticated; only the
# deterministic `post` step (which gets the token) pushes and posts.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: address-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# No default GITHUB_TOKEN scopes: every GitHub mutation in this workflow flows
# through the narrowly-scoped App tokens minted at runtime (see the app-token
# steps below), never the built-in token. The checkouts target a public repo and
# need no token. Mirrors the conflicts.yml / labels.yml `permissions: {}` pattern.
permissions: {}

jobs:
  address:
    # Only the `do:address` trigger, on an OPEN same-repo agent branch.
    if: >-
      github.event.label.name == 'do:address' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # head.ref is PR-author-controlled; only ever used through this env var in
      # run: steps (never interpolated into a shell) so a crafted branch name can't
      # inject. The startsWith gate above also constrains it to agent/issue-*.
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # Pin the checkout to the commit that carried the label, not the moving branch
      # ref, to close the TOCTOU window.
      EVENT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Provision the LOCAL composite action (.github/actions/app-token) on disk
      # before the mints below use it. This is a default-ref checkout that needs no
      # token, and MUST NOT persist one: the job's built-in token carries write scopes,
      # and a persisted credential here would survive into the producer's workspace and
      # defeat the working checkout's persist-credentials: false (the no-push boundary).
      # The pinned-SHA working checkout runs later, after the gate, and overwrites the
      # tree at the reviewed commit.
      - name: Checkout (provision local actions)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: scope the minted token to exactly what this job does —
          # push fixes, reply on review threads, file follow-up issues, toggle labels —
          # so a prompt-injection via untrusted PR/review content can't wield the App's
          # full installation grant. This WRITE token reaches ONLY the deterministic
          # steps that mutate: the runaway-loop gate, the label-removal step, the
          # precompute reads, and the poster. It is NEVER handed to the producer (agent)
          # step — that step gets the read-only token below instead.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # A SECOND, READ-ONLY App token, minted exclusively for the producer (agent) step.
      # claude-code-action wires whatever `github_token` it receives into the agent's
      # git/gh auth (and that can override `persist-credentials: false`), so handing the
      # agent the WRITE token above would give it real push/mutate capability — exactly
      # the wrong thing for a step that processes untrusted human review text (a
      # prompt-injection surface). With a read-only token, even if the action sets up
      # git/gh for the agent, it can only READ: no push, no replies, no issue creation,
      # no thread resolution. The agent's local per-fix commits need no token at all.
      # Kept as a SEPARATE mint from the write token above — the write/read-only
      # split is the security boundary, never merged into one token.
      - name: Generate read-only GitHub App token (for the producer)
        id: app-token-ro
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      # Cost guard: the review → do:address → address-review → push → review
      # cycle is entirely bot-driven once started (review.yml auto-applies
      # do:address on hard findings; the fix push re-fires review.yml via its
      # synchronize trigger). Cap the consecutive BOT-driven rounds so a reviewer that keeps
      # flagging the same point can't loop forever — mirrors autofix.yml's MAX_ATTEMPTS.
      # A human applying the label breaks the cycle and resets the counter, and an
      # already-escalated PR is skipped.
      #
      # The round count lives in an `auto-round:N` label on the PR (defined in labels.yml),
      # NOT a hidden comment — a body-only `<!-- ... -->` comment still renders as a blank
      # bubble in the timeline. A label keeps the conversation clean and lets a maintainer
      # RESET the counter by simply removing the `auto-round:N` label in the PR sidebar.
      - name: Guard against runaway auto-address loops
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          # Keep in step with the auto-round:* labels defined in labels.yml.
          MAX_AUTO_ROUNDS: "3"
        run: |
          # Resolve the PR labels + triggering sender and let the unit-tested decision
          # function in .github/scripts/address-gate.mjs make the call (already-escalated /
          # automation:* mutex defer / human-reset / advance / cap-reached). The decision
          # precedence and the auto-round:N counter logic are tested there; this step is
          # pure I/O — it applies the label mutations and escalation comment the decision
          # returns. See .github/workflows/README.md for the automation:* pause-mutex (a
          # defer must clear a stale pr:addressing-feedback) and the round-counter design.
          labels_json=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          decision=$(jq -nc \
            --argjson labels "$labels_json" \
            --arg sender "$SENDER" \
            --argjson maxRounds "$MAX_AUTO_ROUNDS" \
            --arg botLogin 'smonn[bot]' \
            '{labels:$labels, sender:$sender, maxRounds:$maxRounds, botLogin:$botLogin}' \
            | node .github/scripts/address-gate.mjs)
          echo "Gate: $(jq -r '.reason' <<<"$decision") (proceed=$(jq -r '.proceed' <<<"$decision"))"

          # Apply the mutations the decision dictates (remove before add). A no-op gate
          # (already-escalated / mutex defer / cap-reached) may still clear a stale label,
          # but the "Remove the address trigger label" step below is guarded on
          # proceed==true so a no-op never consumes the do:address trigger.
          while IFS= read -r l; do
            [ -n "$l" ] && { gh pr edit "$PR_NUMBER" --remove-label "$l" || true; }
          done < <(jq -r '.labelsToRemove[]' <<<"$decision")
          while IFS= read -r l; do
            [ -n "$l" ] && gh pr edit "$PR_NUMBER" --add-label "$l"
          done < <(jq -r '.labelsToAdd[]' <<<"$decision")
          if [ "$(jq -r '.escalate' <<<"$decision")" = "true" ]; then
            jq -r '.comment' <<<"$decision" | gh pr comment "$PR_NUMBER" --body-file -
          fi
          echo "proceed=$(jq -r '.proceed' <<<"$decision")" >> "$GITHUB_OUTPUT"

      - name: Remove the address trigger label (so it can be re-applied)
        # Guard on proceed: a no-op gate (already escalated, cap reached, or deferred
        # because the PR is mid-conflict-rebase) must NOT consume the trigger label —
        # otherwise the feedback would never be addressed once the PR is ready again.
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        # Consume the do:address trigger so it can be re-applied to re-run.
        run: |
          gh pr edit "$PR_NUMBER" --remove-label do:address || true

      # ENFORCED no-push: persist-credentials:false leaves NO push credential in the
      # checkout's git config, so the agent literally cannot push. The poster step
      # re-establishes a credential (token-in-URL) when it pushes. The pinned SHA still
      # closes the TOCTOU window.
      - name: Checkout the labelled commit (pinned SHA, not the branch ref)
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.EVENT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Provision workflow helpers from main if absent
        if: steps.gate.outputs.proceed == 'true'
        # Provision local actions/scripts from main when this branch predates them (kept
        # UNTRACKED, so they never enter the agent's commits) — see
        # .github/workflows/README.md "Provisioning workflow helpers from main".
        env:
          GH_TOKEN: ${{ steps.app-token-ro.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f .github/actions/setup-node-pnpm/action.yml ] \
             || [ ! -f .github/scripts/poster-lib.sh ] \
             || [ ! -f .github/scripts/git-identity.sh ] \
             || [ ! -f .github/scripts/lifecycle-status.sh ] \
             || [ ! -f .github/scripts/fetch-closing-issues.sh ]; then
            echo "Provisioning workflow helpers from main (this branch predates them)."
            git fetch --no-tags --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main >/dev/null 2>&1
            git archive FETCH_HEAD .github/actions .github/scripts | tar -x
            printf '.github/actions/\n.github/scripts/\n' >> .git/info/exclude
          fi

      # Start/stop status contract (ADR-0030): the agent is about to address feedback, so
      # set the namespaced pr: status. The subsequent re-review of the pushed fix sets the
      # pr: outcome (ready / changes-requested). Placed after provisioning so the helper is
      # on disk.
      - name: Mark the PR as addressing feedback (namespaced status)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source .github/scripts/lifecycle-status.sh
          set_pr_status "$PR_NUMBER" pr:addressing-feedback

      - name: Configure git identity and working branch
        if: steps.gate.outputs.proceed == 'true'
        run: |
          bash .github/scripts/git-identity.sh
          # We checked out a detached SHA; recreate the branch at it so the agent can
          # commit locally. There is no push credential — the poster pushes later.
          git checkout -B "$BRANCH"

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.gate.outputs.proceed == 'true'

      # Precompute every GitHub input the agent needs and write it under
      # .address-context/, so the agent runs NO gh to read the feedback (its gh is
      # unauthenticated anyway). Records each inline comment's id/path/line as JSON so
      # the agent can map fixes to threads without any API call.
      - name: Build address context (reviews, threads, inline comments, issue)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .address-context

          # The PR title, body, reviews, and review-thread comments (the summary-level
          # view) — what `gh pr view --json reviews,comments,title,body` would return.
          gh pr view "$PR_NUMBER" --json reviews,comments,title,body \
            > .address-context/pr.json

          # The inline review comments with each comment's id, path, and line (and the
          # in_reply_to chain), so the agent can act on a thread and the poster can map
          # REST comment id -> reply target. Kept as raw JSON; the agent reads it.
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate \
            > .address-context/inline-comments.json

          # A flattened, human-readable digest of the inline comments (id, path, line,
          # author, body) so the agent doesn't have to parse the full REST objects.
          jq -r '.[] | "### comment \(.id) — `\(.path)`:\(.line // .original_line // "?") by @\(.user.login)\n\n\(.body)\n"' \
            .address-context/inline-comments.json > .address-context/inline-comments.md || true

          # The PR body and the originating issue(s) it closes (the Spec / scope source).
          # Parse Closes/Fixes/Resolves #N from the body and fetch each; never fail the
          # build if an issue can't be read.
          pr_body=$(jq -r '(.title // "") + "\n\n" + (.body // "")' .address-context/pr.json)
          printf '%s\n' "$pr_body" > .address-context/pr.md
          printf '%s' "$pr_body" | bash .github/scripts/fetch-closing-issues.sh > .address-context/issue.md

          echo "Context built:"; wc -l .address-context/* 2>/dev/null || true

      - name: Address the feedback (edit + commit locally, write .address/, post nothing)
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        # NOTE: deliberately NO GH_TOKEN in env, and the only token handed to the action
        # is the READ-ONLY app-token-ro. claude-code-action wires its `github_token` into
        # the agent's git/gh auth (which can override `persist-credentials: false`), so it
        # MUST be the read-only token: the worst the agent can do through it is read.
        # Combined with persist-credentials:false and no GH_TOKEN in env, the agent has no
        # write capability at all — it can only edit code, commit locally, and write
        # files. The poster (with the write token) does all pushing and mutation.
        env:
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only token: even if the action sets up git/gh for the agent, it cannot
          # push, reply, create issues, label, or resolve threads.
          github_token: ${{ steps.app-token-ro.outputs.token }}
          # The label may be applied by a maintainer (human) or our App.
          allowed_bots: "smonn[bot]"
          # Code/test changes go through the project `tdd` skill (.claude/skills/tdd),
          # invoked via `/tdd` in the prompt, so review fixes follow red→green→refactor
          # and the testing standards rather than ad-hoc edits; `Skill` is in allowedTools
          # so it can run (and chain to `/codebase-design`). Bash is scoped to git
          # (local commits) and pnpm (the CI gate); gh isn't in the allowlist and the
          # prompt forbids push — there are no credentials for either. The skill spends several
          # turns per cycle, and a review can carry many threads, so this needs the same
          # generous budget as implement.yml — keep --max-turns and timeout-minutes in
          # step with each other.
          claude_args: |
            --max-turns 150
            --model claude-sonnet-5
            --effort high
            --allowedTools "Bash(pnpm:*),Bash(git:*),Edit,MultiEdit,Write,Read,Grep,Glob,TodoWrite,Skill"
          prompt: |
            A human applied the `do:address` label to pull request
            #${{ env.PR_NUMBER }} (branch `${{ env.BRANCH }}`) of ${{ github.repository }}
            to ask you to address their review feedback. The branch is checked out and
            git can commit LOCALLY.

            You are a PRODUCER. You have NO write access to GitHub: any token available
            to you is READ-ONLY and git has NO push credential, so every mutation will
            fail. Do NOT run `gh` to read either (use the precomputed files below), and
            do NOT attempt to `git push`, post, reply, resolve threads, create issues,
            label, or merge — they cannot succeed. Your job is to edit code, commit each
            fix LOCALLY, run the CI gate,
            and WRITE your intended GitHub actions to files under a `.address/`
            directory; a later deterministic step reads those files and does ALL pushing
            and posting. Everything you would have fetched from GitHub has been
            PRECOMPUTED for you — read it, never call gh.

            1. Read all the feedback from the precomputed context (do NOT call gh):
               - `.address-context/pr.json` — the PR title, body, reviews, and
                 review-thread comments (what `gh pr view --json
                 reviews,comments,title,body` returns).
               - `.address-context/inline-comments.json` — the inline review comments as
                 raw REST objects; each has `id`, `path`, and `line` (or
                 `original_line`). This is your source of comment ids.
               - `.address-context/inline-comments.md` — a readable digest of the same,
                 one section per comment (id, path, line, author, body).
               - `.address-context/issue.md` — the originating issue(s) (the Spec /
                 scope source). If it says none was found, treat the issue as the only
                 scope anchor.
               Focus on the most recent human review.
            2. SCOPE RULE (applies to every point): a fix HONES this PR, it never
               extends it. Implement ONLY (a) defects in the lines/files this PR already
               changed and (b) missed or incorrect acceptance criteria from the
               originating issue. If addressing a point would GROW the diff beyond the
               issue's scope — a new file, a new capability, a new rule / abstraction,
               tests for code this PR didn't touch, or a broader refactor — do NOT
               implement it: record a follow-up issue to file (see below) and reply on
               the thread deferring it. When in doubt, prefer a follow-up over expanding
               the diff. Honing changes (tightening, simplifying, removing, fixing this
               PR's own new code) are always fine.

               Address each in-scope actionable point as ITS OWN commit: make the change,
               then `git commit` it alone (LOCAL commit, no push) with a clear, scoped
               message (one fix per commit, so each maps to a single hash). Make the
               changes faithfully. For any point that changes behavior or needs
               new/changed tests, use the repo's `tdd` skill — invoke it with `/tdd` — so
               the fix follows red→green→refactor and the testing standards; you are
               headless, so do NOT pause for the skill's interactive approval steps,
               proceed on the review comment as the agreed spec. Trivial, non-behavioral
               edits (typos, comments, renames already covered by tests) do not need the
               skill. NEVER weaken, skip, or delete tests to satisfy a comment, and NEVER
               touch a CLOSED design decision (CONTEXT.md, docs/adr/). NEVER create or
               modify a GitHub Actions workflow file under `.github/workflows/`: the
               poster's token lacks the `workflows` permission, so a push touching one is
               rejected and nothing lands. If a comment asks for a `.github/workflows/*`
               change, do NOT edit it — resolve that point as `declined` (or `deferred`)
               and say in the reply that a maintainer must make the workflow change by
               hand. FROZEN WIRE ORACLE: `spec/vectors.json` and `SPEC.md` are the frozen
               wire oracle. A failing vector assertion means the CODE drifted from the
               frozen wire format — fix the code; NEVER edit `spec/vectors.json` or
               `SPEC.md` to make a vector pass (that silently un-freezes the contract over
               a wire break). If a comment asks for a change to `spec/vectors.json` or
               `SPEC.md`, do NOT edit it — resolve that point as `declined` (or `deferred`)
               and say in the reply that a maintainer must make the spec change by hand.
               You do not have to
               implement every point — for each one you don't, pick the honest
               resolution:
                 - DISAGREE / unsafe / conflicts with a CLOSED decision: don't implement;
                   status `declined`, and explain your reasoning in its reply body.
                 - OUT OF SCOPE but a legitimate improvement: status `deferred`. Write a
                   follow-up issue body file (see step 4) and have the reply cite it.
                   Don't file for points you merely disagree with, or that are already
                   covered by an existing issue.
            3. With every fix committed LOCALLY, re-run the full CI gate exactly as
               ci.yml does: `pnpm lint`, `pnpm depcruise`, `pnpm fmt:check`,
               `pnpm typecheck`, `pnpm test:coverage`, `pnpm build`. Everything must
               pass — add follow-up commits until it does. After the gate is green,
               record each fixed comment's SHORT commit sha (these are stable across a
               plain push, so the poster can cite them verbatim).
            STYLE — replies are read by the reviewer who wrote the comment: answer in
            one to three short sentences (what you did or why not, plus the commit or
            follow-up reference). Do not restate their comment, narrate your process,
            or add pleasantries. Follow-up issue bodies fill the template fields
            tersely — a sentence or two per field.

            4. Author every output file with the Write tool, which writes bytes verbatim:
               use REAL newlines (press enter), never the characters backslash-n. In
               prose bodies, never emit backslash escapes and never backslash-escape
               markdown metacharacters (`<`, `>`, `[`, `]`, backtick) — write them as
               plain characters; GitHub renders them correctly. You never touch JSON
               escaping or `gh`; the poster does that. Write under `.address/`:

               a. `.address/replies/<comment-id>.md` — one raw reply body per inline
                  comment you ACTED ON, named by the REST comment id from
                  inline-comments.json. For a FIXED point, cite the commit, e.g. "Fixed
                  in `<short-sha>`." For a DECLINED point, explain why (no commit). For a
                  DEFERRED point, cite the follow-up you are filing using the PLACEHOLDER
                  token `{{followup:<slug>}}` — the poster substitutes it with the real
                  `#N` once the issue is created, e.g. "Out of scope for this PR — filed
                  {{followup:retry-backoff}} to track." Use the SAME slug you give the
                  follow-up in step 4c.
               b. `.address/toplevel.md` (OPTIONAL) — a single reply body for feedback
                  NOT anchored to any inline comment (a review summary or a plain PR
                  discussion comment). Omit the file entirely if there is no such
                  feedback. It may also use `{{followup:<slug>}}` tokens.
               c. `.address/followups/<slug>.md` — one raw issue body per follow-up to
                  file. Choose a short kebab-case `<slug>` per follow-up. Structure the
                  body to MATCH the matching repo issue form under
                  `.github/ISSUE_TEMPLATE/` (`feature_request.yml` for an
                  enhancement/refactor, `bug_report.yml` for a bug), filling each of its
                  fields under the same headings — `gh issue create` bypasses the web
                  form, so a freeform body would not match what a human submission
                  produces and triage expects. Link this PR #${{ env.PR_NUMBER }} and the
                  review thread in the body.
               d. `.address/manifest.json` — SCALARS ONLY (ids, statuses, shas, slugs,
                  file paths, booleans) — never prose, so there is nothing to escape.
                  Shape:

                      {
                        "comments": [
                          { "comment_id": <rest-id>, "status": "fixed",
                            "sha": "<short-sha>", "reply_file": "replies/<id>.md" },
                          { "comment_id": <rest-id>, "status": "declined",
                            "reply_file": "replies/<id>.md" },
                          { "comment_id": <rest-id>, "status": "deferred",
                            "reply_file": "replies/<id>.md",
                            "followup_slug": "<slug>" }
                        ],
                        "followups": [
                          { "slug": "<slug>", "title": "<conventional-commit title>",
                            "labels": ["enhancement"], "body_file": "followups/<slug>.md" }
                        ],
                        "toplevel_file": "toplevel.md",
                        "escalate": false
                      }

                  - One `comments` entry per inline comment you acted on. `sha` is
                    REQUIRED for `status: "fixed"` (short sha) and omitted otherwise.
                    `followup_slug` appears on `deferred` entries that file a follow-up.
                  - `followups` lists every issue to create; `labels` is an array of
                    strings (the poster always adds `do:triage` on top). Omit or use
                    `[]` if none.
                  - `toplevel_file` is present only if you wrote `.address/toplevel.md`;
                    omit it otherwise.
                  - `escalate` is `false` normally. Set it to `true` (and add
                    `"escalate_reason": "<why>"`) ONLY for the "branch moved / cannot
                    proceed" path — if you determine you cannot make a coherent set of
                    fixes against the labelled commit. The poster then posts the
                    escalation and does NOT push.

               Always write `.address/manifest.json`. The poster takes it from there —
               do not push and do not call gh.
            5. Do NOT approve or merge the PR, and do NOT push to main or anywhere. A
               human re-reviews after the poster pushes your local commits.

      # Deterministic poster: read the agent's local commits + .address/ files and do
      # ALL GitHub mutation. ORDER MATTERS (clean all-or-nothing):
      #   1. escalate -> comment + label, no push, stop.
      #   2. else push the branch FIRST (plain, NEVER force). Non-fast-forward (the
      #      branch advanced past the labelled commit) -> post "branch moved" + stop;
      #      nothing else is posted.
      #   3. create follow-up issues, capture each #N, substitute {{followup:slug}}.
      #   4. post in-thread replies (one per acted-on inline comment).
      #   5. post the top-level reply if present.
      #   6. resolve the GraphQL review threads for comments whose status is "fixed".
      # The token is re-established here (token-in-URL push) — the only place with push
      # credentials. jq does all JSON encoding from raw body files via --input -.
      - name: Push, post replies, file follow-ups, resolve threads
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          source .github/scripts/poster-lib.sh
          require_manifest .address

          # --- 1. Escalation path: comment + label, NO push, stop. ---
          if [ "$(jq -r '.escalate // false' .address/manifest.json)" = "true" ]; then
            reason=$(jq -r '.escalate_reason // "The agent could not produce a coherent set of fixes against the labelled commit."' .address/manifest.json)
            printf '%s\n\n%s\n' "$reason" "Re-apply the \`do:address\` label to try again." > .address-escalate.md
            gh pr comment "$PR_NUMBER" --body-file .address-escalate.md
            gh pr edit "$PR_NUMBER" --add-label needs-human || true
            echo "Escalated PR #$PR_NUMBER without pushing."
            exit 0
          fi

          # WORKFLOW-FILE GUARD: the token lacks the `workflows` permission, so GitHub
          # rejects any push touching .github/workflows/. Check BEFORE the push below —
          # otherwise such a rejection would be misread as a non-fast-forward and post the
          # wrong "branch moved" notice. If the agent's commits (those past the reviewed
          # head EVENT_SHA) touch a workflow file, escalate to a human instead of pushing.
          wf_changes=$(git diff --name-only "$EVENT_SHA..HEAD" -- '.github/workflows/')
          if [ -n "$wf_changes" ]; then
            {
              printf 'I addressed the review feedback but the change modifies GitHub '
              printf 'Actions workflow files:\n\n'
              printf '%s\n' "$wf_changes" | sed 's/^/- `/; s/$/`/'
              printf '\nThe automation App token intentionally lacks the `workflows` '
              printf 'permission (least-privilege), so GitHub rejects any push that '
              printf 'touches `.github/workflows/`. I did not push. A maintainer needs to '
              printf 'apply the workflow change by hand. Escalating to `needs-human`.\n'
            } > .address-workflow-escalate.md
            echo "Escalating PR #$PR_NUMBER: commits touch .github/workflows/ (token lacks workflows permission)."
            gh pr comment "$PR_NUMBER" --body-file .address-workflow-escalate.md
            gh pr edit "$PR_NUMBER" --add-label needs-human || true
            exit 0
          fi

          # --- 2. Push FIRST (plain, never force). ---
          # Did the agent actually commit fixes? If HEAD is still the labelled commit it
          # only answered SOFT findings with replies (declined / deferred) and there is
          # nothing to push or re-review. This drives the pr: hand-off in step 7: real
          # fixes → request a re-review (do:review); replies-only → settle at pr:ready.
          advanced=false
          [ "$(git rev-parse HEAD)" != "$EVENT_SHA" ] && advanced=true
          # Re-establish a push credential here (the checkout had none). A
          # non-fast-forward rejection means the branch advanced past the labelled
          # commit: post "branch moved" and stop — post nothing else (all-or-nothing).
          # When advanced=false the push is a no-op fast-forward ("everything up to date").
          if push_branch "$BRANCH"; then
            if [ "$advanced" = "true" ]; then
              echo "Pushed local commits to $BRANCH."
            else
              echo "No new commits (soft findings answered with replies only) — nothing to push."
            fi
          else
            echo "::warning::push to $BRANCH was rejected (branch likely advanced past the labelled commit) — posting branch-moved notice and stopping."
            printf '%s\n' "The branch moved on past the commit I reviewed, so I did not push my fixes (I never force-push). Please re-apply the \`do:address\` label to run again against the current head." > .address-moved.md
            gh pr comment "$PR_NUMBER" --body-file .address-moved.md
            exit 0
          fi

          # --- 3. Create follow-up issues, capture each #N, build the slug->#N map. ---
          : > .address-followup-map.txt   # lines: "<slug>\t<number>"
          while IFS= read -r fu; do
            [ -n "$fu" ] || continue
            slug=$(printf '%s' "$fu" | jq -r '.slug')
            title=$(printf '%s' "$fu" | jq -r '.title')
            body_file=$(printf '%s' "$fu" | jq -r '.body_file')
            test -f ".address/$body_file" || { echo "::error::follow-up body file $body_file missing"; exit 1; }
            # Build the --label args: always do:triage (so triage.yml picks the new issue
            # up), plus any descriptive labels the manifest carries.
            label_args=(--label do:triage)
            while IFS= read -r lbl; do
              [ -n "$lbl" ] || continue
              label_args+=(--label "$lbl")
            done < <(printf '%s' "$fu" | jq -r '.labels[]? // empty')
            url=$(gh issue create --title "$title" --body-file ".address/$body_file" "${label_args[@]}")
            num=$(printf '%s' "$url" | grep -oE '[0-9]+$')
            printf '%s\t%s\n' "$slug" "$num" >> .address-followup-map.txt
            echo "Filed follow-up #$num ($slug): $url"
          done < <(jq -c '.followups[]?' .address/manifest.json)

          # Substitute {{followup:<slug>}} -> #N in a body file, in place.
          substitute_followups() {
            f=$1
            while IFS=$'\t' read -r slug num; do
              [ -n "$slug" ] || continue
              # Plain-text replacement; slugs are kebab-case so no regex metachars.
              sed -i "s|{{followup:${slug}}}|#${num}|g" "$f"
            done < .address-followup-map.txt
          }

          # --- 4. Post in-thread replies (one per acted-on inline comment). ---
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            cid=$(printf '%s' "$c" | jq -r '.comment_id')
            reply_file=$(printf '%s' "$c" | jq -r '.reply_file // empty')
            [ -n "$reply_file" ] || continue
            test -f ".address/$reply_file" || { echo "::warning::reply file $reply_file missing for comment $cid — skipping"; continue; }
            cp ".address/$reply_file" .address-reply.md
            substitute_followups .address-reply.md
            # jq reads the body verbatim from the file and does all JSON encoding.
            jq -n --rawfile body .address-reply.md '{body:$body}' \
              | gh api -X POST "repos/$GH_REPO/pulls/$PR_NUMBER/comments/$cid/replies" --input - > /dev/null
            echo "Replied in-thread on comment $cid."
          done < <(jq -c '.comments[]?' .address/manifest.json)

          # --- 5. Post the top-level reply if present. ---
          toplevel_file=$(jq -r '.toplevel_file // empty' .address/manifest.json)
          if [ -n "$toplevel_file" ] && [ -f ".address/$toplevel_file" ]; then
            cp ".address/$toplevel_file" .address-toplevel.md
            substitute_followups .address-toplevel.md
            gh pr comment "$PR_NUMBER" --body-file .address-toplevel.md
            echo "Posted top-level reply."
          fi

          # --- 6. Resolve the review threads for comments whose status is "fixed". ---
          # Map REST comment id -> GraphQL thread node id, then resolve each. Thread ids
          # are GraphQL node ids (not the REST comment ids), so list the threads with
          # each thread's id and its first comment's databaseId and match on that.
          fixed_ids=$(jq -r '.comments[]? | select(.status == "fixed") | .comment_id' .address/manifest.json)
          if [ -n "$fixed_ids" ]; then
            threads=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{id isResolved comments(first:1){nodes{databaseId}}}}}}}' \
              -F o="$OWNER" -F r="$REPO_NAME" -F n="$PR_NUMBER")
            for cid in $fixed_ids; do
              tid=$(printf '%s' "$threads" | jq -r --argjson cid "$cid" \
                '.data.repository.pullRequest.reviewThreads.nodes[] | select(.comments.nodes[0].databaseId == $cid) | .id' | head -n1)
              if [ -n "$tid" ] && [ "$tid" != "null" ]; then
                gh api graphql -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' -F t="$tid" > /dev/null
                echo "Resolved thread for fixed comment $cid."
              else
                echo "::warning::no review thread found for fixed comment $cid — leaving unresolved."
              fi
            done
          fi

          # --- 7. Hand off the pr: lifecycle so the PR never strands on an in-progress
          # status. Two outcomes, by whether we pushed fixes:
          #   - advanced (fixes pushed): request a deterministic re-review with do:review.
          #     review.yml consumes it (FORCED, so no dedup) and drives
          #     pr:reviewing -> pr:ready / pr:changes-requested. The fix push's own
          #     `synchronize` also fires review.yml; review's cancel-in-progress concurrency
          #     dedups the two to a single review, and do:review guarantees one runs even if
          #     the push event is missed. This replaces the old implicit-synchronize-only
          #     hand-off, which could leave the PR sitting on pr:reviewing.
          #   - replies-only (no commit): nothing was pushed and there is nothing to
          #     re-review, so settle the PR at pr:ready (clearing pr:addressing-feedback) for
          #     a human. (Escalation / branch-moved paths above already exited and own their
          #     own terminal state — needs-human / re-apply do:address.)
          source .github/scripts/lifecycle-status.sh
          if [ "$advanced" = "true" ]; then
            gh pr edit "$PR_NUMBER" --add-label do:review || true
            echo "Requested a re-review of the pushed fixes (do:review)."
          else
            set_pr_status "$PR_NUMBER" pr:ready
            echo "Only soft findings were answered (nothing pushed) — settled at pr:ready."
          fi

          echo "Address-review poster complete."
