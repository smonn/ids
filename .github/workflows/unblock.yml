name: Unblock issues

# When an issue or pull request closes, any issue parked as `blocked` that
# depended on it may now be free. This sweeps open `blocked` issues, re-checks
# their declared blockers ("Blocked by #N" / "Depends on #N" / "Requires #N"),
# and once every blocker is closed, flips the issue back to `needs-triage` —
# which re-fires the triage workflow to re-scope it against the now-complete
# dependency.
#
# Blockers are frequently PRs, not issues (e.g. "Blocked by #179" where #179 is a
# pull request). Closing/merging a PR fires `pull_request`, never `issues`, so we
# trigger on both. The sweep itself is generic — it scans every open `blocked`
# issue and resolves each blocker's state via `gh issue view` (which works for PR
# numbers too), independent of which event fired it.

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: unblock
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: this job only reads and re-labels issues; no checkout, no
          # push, no PR access.
          permission-issues: write

      - name: Unblock issues whose blockers are all closed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          blocked=$(gh issue list --state open --label blocked --json number --jq '.[].number')
          if [ -z "$blocked" ]; then
            echo "No open blocked issues."
            exit 0
          fi
          for n in $blocked; do
            text=$(gh issue view "$n" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))')
            # Extract blocker issue numbers from two declaration forms:
            #   1. an inline phrase + number on one line ("Depends on #104"); and
            #   2. a "## Blocked by" (or Depends on / Requires) heading followed by a
            #      markdown bullet list of "- #N" items — the issue-template form, which a
            #      line-by-line grep misses because the number sits on its own bullet line.
            # The bullet pass reads only the LEADING #N of each bullet under the heading
            # (not surrounding prose), so a self-reference like "Issue #109 depends on
            # #104" resolves to #104, never #109.
            deps=$(
              {
                printf '%s' "$text" \
                  | grep -oiE '(blocked by|depends on|requires)[[:space:]]*:?[[:space:]]*#[0-9]+' \
                  | grep -oE '[0-9]+'
                printf '%s' "$text" | awk '
                  { lc = tolower($0) }
                  lc ~ /blocked by|depends on|requires/ { collect = 1; started = 0; next }
                  collect {
                    if ($0 ~ /^[ \t]*$/) { if (started) collect = 0; next }
                    if ($0 ~ /^[ \t]*[-*][ \t]*#?[0-9]+/) {
                      n = $0
                      sub(/^[ \t]*[-*][ \t]*#?/, "", n)
                      sub(/[^0-9].*$/, "", n)
                      print n
                      started = 1
                      next
                    }
                    collect = 0
                  }
                '
              } | sort -un
            )
            if [ -z "$deps" ]; then
              echo "#$n: blocked but no parseable blocker reference; leaving for a human."
              continue
            fi
            all_closed=true
            for d in $deps; do
              state=$(gh issue view "$d" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              echo "#$n blocker #$d: $state"
              # A blocker is resolved when it is CLOSED (issue or closed PR) or
              # MERGED. `gh issue view` on a *merged* PR reports state MERGED, not
              # CLOSED — blockers are often PRs (e.g. #179), so treat both as done.
              case "$state" in CLOSED | MERGED) ;; *) all_closed=false ;; esac
            done
            if [ "$all_closed" = true ]; then
              echo "#$n: all blockers closed — unblocking and re-triaging."
              gh issue edit "$n" --add-label needs-triage --remove-label blocked
              gh issue comment "$n" --body "All declared blockers ($(echo "$deps" | sed 's/^/#/' | paste -sd ', ' -)) are now closed; re-triaging."
            else
              echo "#$n: still has open blockers; leaving blocked."
            fi
          done
