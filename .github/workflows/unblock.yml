name: Unblock issues

# When an issue or pull request closes, any issue parked as `issue:blocked` that
# depended on it may now be free. This sweeps open `issue:blocked` issues, re-checks
# their declared blockers ("Blocked by #N" / "Depends on #N" / "Requires #N"),
# and once every blocker is closed, applies `do:triage` (and resets the status to
# `issue:triage`) — which re-fires the triage workflow to re-scope it against the
# now-complete dependency.
#
# Blockers are frequently PRs, not issues (e.g. "Blocked by #179" where #179 is a
# pull request). Closing/merging a PR fires `pull_request`, never `issues`, so we
# trigger on both. The sweep itself is generic — it scans every open `blocked`
# issue and resolves each blocker's state via `gh issue view` (which works for PR
# numbers too), independent of which event fired it.

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: unblock
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 10
    steps:
      # Checkout first: it puts the shared .github/scripts/parse-blockers.sh AND the
      # local .github/actions/app-token composite on disk (the latter is needed before
      # the mint below runs). This checkout needs no token. The job still makes no
      # commits and pushes nothing.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege: this job only reads and re-labels issues; no push, no PR
          # access.
          permission-issues: write

      - name: Unblock issues whose blockers are all closed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Namespaced issue: status helpers (ADR-0029); authoritative since Phase 4.
          source .github/scripts/lifecycle-status.sh
          blocked=$(gh issue list --state open --label issue:blocked --json number --jq '.[].number')
          if [ -z "$blocked" ]; then
            echo "No open blocked issues."
            exit 0
          fi
          for n in $blocked; do
            text=$(gh issue view "$n" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))')
            # Extract blocker issue numbers (two declaration forms: an inline
            # "Depends on #N" phrase, and a "## Blocked by"/Depends on/Requires heading
            # followed by a markdown "- #N" bullet list — the issue-template form). The
            # text→numbers parser is shared verbatim with triage.yml.
            deps=$(printf '%s' "$text" | bash .github/scripts/parse-blockers.sh)
            if [ -z "$deps" ]; then
              echo "#$n: blocked but no parseable blocker reference; leaving for a human."
              continue
            fi
            all_closed=true
            for d in $deps; do
              state=$(gh issue view "$d" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              echo "#$n blocker #$d: $state"
              # A blocker is resolved when it is CLOSED (issue or closed PR) or
              # MERGED. `gh issue view` on a *merged* PR reports state MERGED, not
              # CLOSED — blockers are often PRs (e.g. #179), so treat both as done.
              case "$state" in CLOSED | MERGED) ;; *) all_closed=false ;; esac
            done
            if [ "$all_closed" = true ]; then
              echo "#$n: all blockers closed — unblocking and re-triaging."
              # Re-triage: apply the `do:triage` trigger (fires triage.yml) and reset the
              # issue: status to triage, which clears issue:blocked (set_issue_status
              # reconciles the single-select issue: namespace).
              gh issue edit "$n" --add-label do:triage --remove-label issue:blocked
              set_issue_status "$n" needs-triage
              gh issue comment "$n" --body "All declared blockers ($(echo "$deps" | sed 's/^/#/' | paste -sd ', ' -)) are now closed; re-triaging."
            else
              echo "#$n: still has open blockers; leaving blocked."
            fi
          done
