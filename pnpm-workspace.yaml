packages:
  # The root package (@smonn/ids) is the published library; listing it keeps
  # changesets versioning/publishing it now that website/ makes this a monorepo.
  - "."
  - website

allowBuilds:
  # cdxgen pulls @appthreat/sqlite3 (native) only for its vuln/evidence
  # features; the `--type pnpm` lockfile SBOM doesn't need it, so its build
  # script is not run (consistent with not building unneeded native deps).
  "@appthreat/sqlite3": false
  "@prisma/client": true
  better-sqlite3: true
  esbuild: true
  sharp: true

# Install cooldown: don't let dependency resolution select a version published
# less than 24h ago. Mitigates the supply-chain pattern of installing a
# freshly-hijacked transitive release within minutes of its publish. CI uses
# `pnpm install --frozen-lockfile`, which skips resolution and is unaffected;
# this only gates new resolutions (lockfile updates, Dependabot bumps).
minimumReleaseAge: 1440

# Dependency vulnerability remediation overrides.
# All entries pin transitive, dev-only dependencies to patched releases.
overrides:
  # GHSA-fx2h-pf6j-xcff (high) + GHSA-v6wh-96g9-6wx3 (moderate):
  # vite <8.0.16 server.fs.deny bypass / launch-editor NTLMv2 disclosure.
  # Pulled in transitively via vitest; vitest accepts ^8.0.0.
  vite: ^8.0.16
  # GHSA-h67p-54hq-rp68 (moderate): js-yaml <=4.1.1 quadratic-complexity DoS
  # in merge-key handling. Reached via @changesets/parse (^4.1.1 range).
  # The separate js-yaml 3.x path (read-yaml-file -> @manypkg) cannot move to
  # 4.x — read-yaml-file calls the removed safeLoad API — so it is left to
  # upstream; impact is dev-only changeset parsing.
  js-yaml@^4.1.1: ^4.2.0
  # GHSA-g7r4-m6w7-qqqr (low): esbuild >=0.27.3 <0.28.1 allows arbitrary file
  # read via the dev server on Windows. Reached transitively via the website
  # toolchain (vite -> esbuild). Dev-only; does not affect the published package.
  esbuild@<0.28.1: ">=0.28.1"
  # GHSA-5j98-mcp5-4vw2 (high): glob CLI 11.0.x command injection via -c/--cmd
  # (executes matched paths with shell:true). Reached via @cyclonedx/cdxgen,
  # which pins glob ^11.0; 11.1.0 is the patched, semver-compatible release.
  # Dev-only SBOM tooling; the project never invokes the glob CLI.
  glob@11: ^11.1.0
  # GHSA-48c2-rrv3-qjmp (moderate): yaml <2.8.3 stack overflow via deeply
  # nested collections. The vulnerable 2.7.1 copy is reached transitively via
  # the website toolchain (@astrojs/check); the root devDep already uses 2.9.0.
  # Patch is semver-compatible within 2.x. Dev-only; not in the published package.
  yaml@2: ">=2.8.3"
  # GHSA-q8mj-m7cp-5q26 (moderate): qs 6.11.1-6.15.1 unhandled TypeError in
  # stringify() with arrayFormat 'comma' + encodeValuesOnly on null/undefined
  # array elements. Reached via @stryker-mutator/core -> typed-rest-client,
  # which pins qs 6.15.1 exactly, so resolution alone can never pick up the
  # patch. Dev-only mutation-testing tooling; not in the published package.
  qs@6.15.1: 6.15.2
